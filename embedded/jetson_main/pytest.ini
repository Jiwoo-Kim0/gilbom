[pytest]
# testpaths: 인자 없이 pytest를 돌려도 tests/만 수집한다. 없으면 scripts/web_test.py가
#            기본 패턴 *_test.py에 걸려 fastapi 미설치(개발 PC)로 수집이 통째로 중단된다.
# pythonpath: rootdir(저장소 루트)을 sys.path에 넣는다 — `python -m pytest`가 아니라
#             맨 `pytest`로 돌려도 driving/·perception/ import가 된다 (pytest 7+ 내장).
testpaths = tests
pythonpath = .
