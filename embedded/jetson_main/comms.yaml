# MQTT v2 통신 설정. 실행은 main.py --comms-config 를 줄 때만 활성화된다.
# 비밀값은 이 파일에 적지 않고 환경변수로 주입한다.
robot:
  id: ${env:MQTT_ID}
  firmware_version: 1.0.0

mqtt:
  host: ${env:MQTT_HOST}
  port: ${env?:MQTT_PORT|8883}
  username: ${env?:MQTT_USERNAME}
  client_id: ${env?:MQTT_CLIENT_ID}
  password: ${env:MQTT_PASSWORD}
  keepalive: 30
  ca_cert: ${env?:MQTT_CA_CERT|system}
  require_tls: true
  outbox_path: var/outbox.sqlite3
  # Backend가 Event DB Commit 뒤 ingest/receipt를 자동 발행한 후에만 true로 바꾼다.
  receipt_required: false

telemetry:
  interval_sec: 5.0

upload:
  # 증거 이미지 HTTPS 업로드. 비면 업로드만 건너뛰고 로봇은 정상 기동한다 —
  # 결함 event 는 image_id: null 로 그대로 나간다 (계약 §8.3).
  url: ${env?:UPLOAD_URL}          # POST /api/v1/images 전체 URL
  api_key: ${env?:UPLOAD_API_KEY}  # 기기별 X-API-Key. 세션 쿠키·CSRF 아니다.
  # ⚠️ 이 절에는 위 두 항목만 넣는다 — comms/uploader.py 가 미지 키를 거부한다.

robot_uuid: ${env?:ROBOT_UUID}
# ⚠️ 업로드 form 의 robot_id 에 실리는 DB 내부 UUID 다 — mqtt_id(RBT-001) 가 아니다.
#    서버가 UUID.fromString() 으로 파싱하므로 mqtt_id 를 보내면 400 이고, 400 은
#    재시도 대상이 아니라 사진이 조용히 유실된다.

incident:
  # events/incident 의 model 블록 (계약 §8.3) — 판정에 실제로 쓴 모델의 이름·버전이다.
  # 모델 자체의 경로·임계값은 config.yaml perception.braille 에 있다.
  model_name: tbs-braille-yolo
  model_version: 0.0.0-stub        # ⚠️ 실제 export 버전으로 교체 필요
  # 증거 이미지 규격 (계약 §8) — 장변 1280px, JPEG q80, 500KB 이하.
  # 상한을 넘으면 품질을 min 까지 낮춰 재인코딩하고, 그래도 넘으면 저장을 건너뛴다.
  evidence_dir: var/evidence
  evidence_long_edge_px: 1280
  evidence_jpeg_quality: 80
  evidence_max_bytes: 512000
  evidence_min_jpeg_quality: 40
