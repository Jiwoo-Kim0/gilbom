# =====================================================================
# 자율주행 인도 주행 봇 — 튜닝값·경로 단일 출처
# 규칙: 튜닝 숫자와 경로는 이 파일에만 존재한다 (코드에는 프로토콜 상수만 허용)
# 근거: docs/HARDWARE.md (Phase 0 실측 + 기존 코드 추출), 임베디드 명세서
# =====================================================================

hardware:
  i2c_bus: 7                      # 40핀 헤더 I2C(핀 3/5) — 모터 HAT·서보 보드가 여기 연결
  drive_motor:                    # 구동: 모터 HAT(PCA9685) 0x40, TB6612FNG B채널
    address: 0x40
    pwm_frequency_hz: 60
    pwm_channel: 5                # PWMB
    in1_channel: 4                # BIN1
    in2_channel: 3                # BIN2
  steering_servo:                 # 조향: PCA9685 0x60 ch0, MG996R
    address: 0x60
    channel: 0
    center_deg: 100               # 조향 중심 (서보 절대각)
    left_offset_limit_deg: 45     # 왼쪽 최대 오프셋 → 절대 55°
    right_offset_limit_deg: 30    # 오른쪽 최대 오프셋 → 절대 130°
                                  # 이 둘은 여유를 둔 소프트 리밋이 아니라 주행 가능 한계다:
                                  # 좌우 어느 쪽이든 넘기면 조향은 들어가도 전·후진이 안 된다
                                  # (우측 절대 130°는 링키지 걸림 경계, 지속 조향은 +25° 이하
                                  #  권장). 올리지 말 것 — 근거는 docs/HARDWARE.md §4
  imu:                            # MPU6050 클론 — 방향 검증 완료, 배선은 임시 해제 상태.
                                  # 재배선: 헤더 17(3.3V)/25(GND)/27(SDA)/28(SCL)
    bus: 1                        # 헤더 27/28번 핀 = 버스 1 (구동 버스 7과 분리)
    address: 0x68                 # 단 WHO_AM_I는 0x72를 돌려주는 클론 칩 — 동작은 정상
    forward_axis: "+x"            # 차 정면이 실리는 센서 축 — 칩 x 화살표를 정면에 맞춰 장착
    up_axis: "+z"                 # 하늘 방향 축 — 칩면이 하늘을 보게 장착
    # ===== 값의 성격이 둘로 갈린다 (docs/IMU-ZERO-REFERENCE.md) =====
    # 고정값: 장착 기울기 — 차체 기준이라 상수다. **재지 않고 여기서 받는다.**
    # 매 시작: 자이로 바이어스 — 센서 오차라 온도로 변한다. 정지 상태에서 다시 잰다.
    mount_pitch_offset_deg: -1.71 # **고정 — IMU가 차체에 삐뚤게 붙은 각도(도).**
                                  # 실측 2026-08-05: m1 -1.53° / m2(180°) -1.89°
                                  #   → 장착 -1.71°, 그 바닥 +0.18° (거의 수평이었다)
                                  #   같은 회전에서 yaw 적분 +180° — 축·부호·스케일 정상
                                  # 측정: `python3 scripts/imu_calibrate.py`
                                  #   ① 바닥에 정면으로 놓고 측정  m1 = 장착 + 지면
                                  #   ② 제자리에서 약 180° 돌려 측정 m2 = 장착 − 지면
                                  #   → 장착 = (m1+m2)/2  (지면 기여가 상쇄된다)
                                  # 그래서 **평평한 바닥이 필요 없다** — 강의실 바닥이면 된다.
                                  # 차체를 다시 뜯기 전까지 유효하다.
                                  # ⚠️ 이 값을 '출발 자세'로 대신 잡으면 안 된다: 출발선
                                  #    경사가 매번 0점에 박혀, 15° 오르막에서 출발한 로봇이
                                  #    '평지'로 읽고 등판 보정도 하강 안전 정지도 안 걸린다.
                                  #    driving.slope 의 임계는 전부 중력 기준 물리량이다
    gyro_bias_samples: 200        # **매 시작** — 기동 첫 read()의 정지 영점 샘플 수
                                  # (~0.4초 블록). 부팅 직후 IDLE(브레이크)이라 정지
                                  # 전제가 성립한다. 출발 직전 터치 영점이 다시 잡으므로
                                  # 이 값은 그때까지 쓰는 잠정치다
    zero_sec: 2.0                 # **매 시작** — 출발 신호(터치·웹 시작·서버·조작자 A)를
                                  # 받으면 이만큼 정지한 채 자이로 영점을 다시 잡고 나서
                                  # 비로소 바퀴가 돈다. 바이어스는 온도로 변해서
                                  # 창고에서 잰 값이 출발선에서는 틀리고, 그 오차가 그대로
                                  # yaw 적분 드리프트(회차·회전 판정)가 된다.
                                  # 20Hz 루프에서 2초 = 표본 40개. 늘리면 정밀해지지만
                                  # 터치하고 기다리는 시간이 그만큼 길어진다
    zero_max_rate_dps: 4.0        # 영점 구간의 축별 진폭(peak-to-peak)이 이보다 크면
                                  # **정지가 아니었다고 보고 버린다**(출발도 하지 않는다).
                                  # 크기가 아니라 진폭을 보는 이유: 이 칩은 정지 상태에서도
                                  # (-2.8, +2.1, -0.2) dps 를 읽는다(2026-08-05 실측) —
                                  # 정지의 증거는 값의 크기가 아니라 **일정함**이다.
                                  # 4.0의 근거: 같은 날 정지 5회 실측 진폭이
                                  # 1.14 / 1.25 / 1.34 / 1.34 / 1.76 dps 였다.
                                  # 최대치의 2배 남짓이라 정지 오탐이 없고, 사람이 밀거나
                                  # 들면 수십 dps라 놓치지도 않는다.
                                  # ※ 2.0으로 뒀다가 실측에서 1.76이 나와 올렸다 —
                                  #   그대로 뒀으면 가만히 있는데 출발이 거부됐을 것이다
    complementary_alpha: 0.95     # pitch 상보필터 자이로 비중 — 높일수록 자이로 바이어스
                                  # 온도 드리프트가 증폭되니 0.95 초과 금지
    yaw_sign: 1                   # 좌회전 = yaw+ 로 통일하는 부호. DEAD_END 완료 판정이
                                  # 이 관례를 요구한다(좌회전 회차의 yaw 누적 ≥ +target).
                                  # ※ 0804 실측으로 -1 → 1 정정. -1일 때 좌조향 회차의
                                  #   yaw 누적이 음수로 가서(-1.5 → -7.0) 완료 조건
                                  #   (≥ +165°)에 **영원히 도달하지 못했고**, K턴이 매번
                                  #   timeout_sec 30초를 채우고 IDLE로 끝났다.
                                  #   확인 방법: 봇을 손으로 좌(반시계) 회전 →
                                  #   /api/status 의 imu.yaw_deg 가 +로 가야 한다.
  touch:                          # 터치 센서 — 명세의 '터치 시 주행 탐지 시작' 트리거.
                                  # 40핀 헤더 GPIO 1개를 main 루프가 20Hz로 폴링하고
                                  # **상승 엣지**만 시작 요청으로 소비한다(누르고 있는
                                  # 내내 요청이 반복되면 경계 소실 IDLE의 '수동 재시작만이
                                  # 출구' 설계가 무력해진다 — 손을 얹어 두면 자동 재출발이
                                  # 된다). 구현은 hardware/jetson/touch.py
    pin: 16                       # **물리 핀 번호(BOARD 모드)** — 0804 배선 확정:
                                  #   VCC = pin 1 (3.3V) / SIG = pin 16 / GND = pin 14
                                  # VCC가 3.3V인 것이 중요하다: pin 2·4는 5V이고 젯슨
                                  # GPIO는 3.3V 입력이라 5V 신호는 핀을 상하게 한다.
                                  # 구동 I2C(3/5)·IMU(27/28·17·25)와 겹치지 않는다.
                                  # null로 두면 비활성 — 시작 트리거는 Xbox A만 남는다
    active_high: true             # 눌렀을 때 핀이 HIGH인가. TTP223 등 모듈형 터치
                                  # 센서는 기본 설정이 '터치 시 HIGH'다.
                                  # 단순 접점 스위치를 GND로 당기는 배선이면 false
    required_for_start: false     # **출발 인터록** — true 면 웹 '시작'·서버
                                  # START_MISSION 같은 원격 신호만으로는 바퀴가 돌지
                                  # 않고 로봇 몸체의 터치까지 있어야 출발한다(논리곱).
                                  # ※ false 로 내렸다 (0805 운용 결정): 터치는 확인
                                  #   신호가 아니라 **시작 버튼을 대신하는 것**이다 —
                                  #   터치 한 번 = 웹 '시작' 한 번이고, 그 반대로 웹
                                  #   '시작'만으로도 출발한다. 두 신호를 다 요구하면
                                  #   현장에서 화면과 로봇을 오가야 해서 시연이 끊긴다.
                                  # 어느 쪽이든 출발 직후 정지 자이로 영점
                                  # (hardware.imu.zero_sec)은 그대로 지난다 —
                                  # 그것이 '가만히 있는 2초'의 자리다.
                                  # 구현은 driving/start_interlock.py
    arm_timeout_sec: 60.0         # 출발 신호가 터치를 기다리는 시간. 넘기면 버린다 —
                                  # 아침에 누른 시작이 저녁의 터치로 살아나면 안 된다
    touch_valid_sec: 10.0         # 터치가 출발 신호를 기다리는 시간(터치를 먼저 한 경우).
                                  # 짧은 이유: 터치는 '지금 여기 사람이 있다'는 증거이고
                                  # 그 증거는 빨리 상한다

  gps:                            # u-blox 7 (USB NMEA) — 위치 표시·좌표 보고용
    device: /dev/serial/by-id/usb-u-blox_AG_-_www.u-blox.com_u-blox_7_-_GPS_GNSS_Receiver-if00
    baud: 9600
  joystick:                       # Xbox360 컨트롤러 — 수동 조작 (웹 테스트 도구 전용)
    device: /dev/input/js0        # tegra 커널 xpad 커스텀 모듈 필요 (docs/HARDWARE.md)
    axis_steer: 0                 # 왼스틱 X
    axis_throttle: 1              # 왼스틱 Y (위 = 전진)
    axis_reverse_trigger: 2       # LT (안 누름 -32767, 완전 누름 +32767)
    axis_forward_trigger: 5       # RT
    button_manual_toggle: 0       # A — 수동/자동 모드 전환 (SSAFY에선 녹화 토글이던 버튼)
    button_estop: 1               # B — 수동 비상 정지 (스로틀 입력을 다 놓으면 재장전)
    button_cap_down: 2            # X — 최대 스로틀 -10%p
    button_cap_up: 3              # Y — 최대 스로틀 +10%p
    deadzone: 4000                # 스틱·트리거 노이즈 하한 (32767 기준, SSAFY 실측값)
    throttle_min_pct: 12          # 이 미만은 구동계가 소리만 낸다 (SSAFY 실측)
    throttle_cap_initial_pct: 70  # 기동 시 최대 스로틀 (X/Y 버튼으로 주행 중 조절)
    throttle_cap_step_pct: 10
    throttle_cap_min_pct: 20
    throttle_cap_max_pct: 100

battery:                          # 잔량 등급·조치 (MQTT 계약 §9). 원격 미션 모드에서만
                                  # 쓰인다 — 값을 만드는 것은 아래 estimate 절이고,
                                  # 등급 판정·이력(히스테리시스)은 communication/
                                  # robot_state.BatteryThresholds 가 이 값들로 한다
  low_pct: 20.0                   # 이 아래로 내려가면 LOW → 순찰 일시정지 + BATTERY_LOW
  low_recover_pct: 25.0           # 올라올 때는 여기까지 와야 NORMAL. 내려갈 때와 값이
                                  # 다른 것은 경계에서 LOW/RECOVERED 가 번갈아 나가는
                                  # 것을 막기 위한 이력폭이다
  critical_pct: 10.0              # 이 아래는 CRITICAL → 비상 정지 + BATTERY_CRITICAL.
                                  # 18.33%/h 기준 남은 시간 약 33분
  critical_recover_pct: 15.0
  confirm_samples: 2              # 등급 전이로 인정할 연속 표본 수. telemetry 주기(5초)
                                  # 에 읽히므로 2 = 10초 연속 확인
  stop_driving: true              # false면 보고만 하고 바퀴는 세우지 않는다(추정값으로
                                  # 주행을 막고 싶지 않을 때). true가 기본 —
                                  # communication/runtime.BatteryDriveGuard
  estimate:                       # ⚠️ 잔량을 읽는 장치가 없다 — **가동 시간으로 역산**한다.
                                  #    근거·한계·충전 반영 방법은 hardware/battery.py 머리말
    enabled: true                 # false면 배터리 경로 전체가 꺼지고 잔량은 종전대로
                                  # valid=false/UNKNOWN 으로 나간다
    drain_pct_per_hour: 18.33     # 실측 2026-08-05: DXF 4셀 팩으로 **3시간 실사용 후
                                  # 55% 소모** → 55/3 = 18.33%/h (만충→0% 약 5.5시간).
                                  # 주행·정차가 섞인 실사용 값이라 세워 두기만 해도
                                  # 같은 속도로 닳는 것으로 계산된다 — 오차는 일찍
                                  # 멈추는 쪽이라 그대로 둔다. 팩·구동계가 바뀌면 재실측
    full_pct: 100.0               # 만충으로 볼 값 = 기동 시 잔량 (아래 참조)
    resume_on_restart: false      # false(기본) = **기동할 때마다 만충에서 시작한다**.
                                  # 운용이 그렇게 정해져 있다: 매 실행 전 완충하고
                                  # 나가고, 쉬는 동안에도 계속 충전한다. 이 전제에서는
                                  # 지난 잔량을 이어받는 쪽이 오히려 틀린다(충전을 하고도
                                  # 낮은 값이 따라와 순찰이 막힌다).
                                  # true = 아래 기록을 이어받는다. 완충 없이 재시작하는
                                  # 운용(주행 중 프로세스 재시작)으로 바꿀 때만.
                                  # ※ 켜 둔 채 충전했다면 대시보드 '충전 완료' 버튼 —
                                  #   충전기를 꽂아도 로봇은 그 사실을 알 수 없다
    state_file: var/battery.json  # 잔량 기록 (comms.yaml 기준 상대 — mqtt.outbox_path 와
                                  # 같은 규칙). 화면·CLI 표시용이자 resume_on_restart 의 근거
    persist_step_pct: 1.0         # 이만큼 닳을 때마다 기록한다 (약 3분마다 1회 —
                                  # 5초 주기로 SD 카드에 쓰지 않기 위한 값)

perception:
  # 카메라는 /dev/v4l/by-id 고정 경로로 지정한다 — /dev/videoN 번호는 USB 재연결·
  # 재부팅 순서에 따라 바뀐다 (0731 실측: Web Camera=video0, Brio 100=video2).
  nav_camera_device: /dev/v4l/by-id/usb-Web_Camera_Web_Camera_202404120005-video-index0
                                  # 주행 판단(세그멘테이션)용 전방 카메라 — Phase 0 확인
  inspect_camera_device: /dev/v4l/by-id/usb-046d_Brio_100_2515ZBV1XK58-video-index0
                                  # 점자블록 파손 검사용 로지텍 Brio 100 (하향 마운트)
  inspect_capture_flush_frames: 3 # 검사 캡처 전에 버리는 read 횟수. 검사 카메라는
                                  # INSPECT 때만 읽히므로 V4L2 내부 버퍼(1장)에 직전
                                  # 검사 직후의 낡은 프레임이 남아 있다 — 버리지 않으면
                                  # 블록 N 보고에 블록 N-1 사진이 실린다. AE(자동 노출)
                                  # 재수렴 여유도 겸한다. 보드 실측 후 재보정 대상

  # 모델 경로는 저장소 루트 기준 상대경로 (main.py가 config.yaml 위치를 루트로 삼는다).
  # 모델의 정체·성능·한계는 models/README.md — 숫자는 여기에만 둔다.
  segmentation:                   # 인도 세그멘테이션 (상시) — 주행 + 점자블록 발견
    model_path: models/segv2.pt
    imgsz: 640                    # 학습 시 imgsz — 바꾸면 정확도가 떨어진다
    conf: 0.25                    # 검출 신뢰도 하한 (아래 class_conf에 없는 클래스)
    class_conf:                   # **클래스별** 신뢰도 하한 — 추론은 이 중 최솟값으로
                                  # 한 번만 돌리고 클래스마다 따로 거른다
                                  # (perception/segmentation.keep_instances).
                                  # 전역 conf 하나로는 두 요구를 동시에 못 맞춘다:
      braille_guide_blocks: 0.05  # 점자블록은 **재현율**이 미션 그 자체다.
                                  # 실측 2026-08-05(실사 31장면 육안 라벨):
                                  #   conf 0.25 → 재현율 2/8, 오탐 0/20  ← 종전 운영점
                                  #   conf 0.10 → 3/8, 오탐 0
                                  #   conf 0.05 → 5/8, 오탐 1/20
                                  # 놓친 블록 픽셀은 미분류로 떨어져 **유령 장애물**까지
                                  # 만든다(같은 실측: conf 0.25에서 blocking=True 이던
                                  # 프레임이 0.10에서는 blocking 없음) — 즉 이 값이
                                  # 낮을수록 검사도 살고 헛회피도 준다.
                                  # 오탐의 대가는 작다: 잘못 켜져도 추종 속도는 순찰과
                                  # 같고(trace.throttle_pct=100), 조향은 근접도 비례
                                  # 혼합이라 원거리 오탐이 조향을 끌지 못한다.
                                  # ※ 차도·횡단보도는 여기 넣지 말 것 — 그쪽 오탐은
                                  #   코리도 20%면 선회, 55%면 즉시 ESTOP 이다
    braille_class: braille_guide_blocks  # 검사 트리거가 되는 클래스 이름
    crosswalk_class: crosswalk    # 미설치 구역 판정(명세 5단계) 트리거 클래스 이름
    classes:                      # ===== 7클래스 우선순위 표 — 주행 판단의 단일 출처 =====
                                  # 명세 '7개 클래스 각각 우선순위를 배정'의 구현체다.
                                  # 종전에는 같은 정보가 drivable_classes/roadway_classes/
                                  # costmap.class_costs 세 곳에 흩어져 있어 한 클래스의
                                  # 취급을 바꾸려면 세 곳을 맞춰야 했고, 실제로 어긋났다
                                  # (alley가 drivable이면서 비용 0.2였고, bike_lane은
                                  #  비용표에만 있어 '주행불가=장애물'로 잡혔다).
                                  #
                                  # 필드 뜻:
                                  #   drivable  이 클래스 위를 달려도 되는가. 인도 경계
                                  #             판정(sidewalk_detected)·중심선 적합·
                                  #             자유공간 도달거리가 전부 이 합집합을 쓴다.
                                  #   cost      코스트맵 통행 비용. 0=선호, .inf=절대 금지.
                                  #             우선순위의 실체가 이 숫자다(작을수록 우선).
                                  #   roadway   차도 취급 — 코리도에 들어오면 회피 선회
                                  #             (ESCAPE), 임계 초과면 ESTOP.
                                  #
                                  # 우선순위(cost 오름차순): 점자블록 = 인도 < 주의구역
                                  #   < 골목 < 자전거도로 < 횡단보도 = 차도(절대 금지)
      braille_guide_blocks:       # 미션 대상. 밟아도 되고 오히려 그 위를 가는 편이
        drivable: true            # 하향 탐지 카메라 화각에 블록이 들어온다
        cost: 0.0
      sidewalk:                   # 주행 기본면
        drivable: true
        cost: 0.0
      caution_zone:               # 인도 내 위험·공사 구역 — 지나갈 수는 있으나 피한다.
        drivable: false           # drivable=false라 자유공간이 여기서 끊긴다 = 정면에
        cost: 0.8                 # 있으면 회피 대상이 된다(의도).
      alley:                      # 골목 — 차량이 드나드는 노면이다. 인도가 아니다.
        drivable: true            # ⚠️ **실내 값** (2026-08-06 이번 실내 테스트 한정).
        cost: 0.0                 #   실외로 나가기 전에 반드시 drivable: false / cost: 1.5
                                  #   로 되돌릴 것 — 실외 골목은 차량이 드나드는 노면이다.
                                  # (원래 실외 주석) 코스트맵이 강하게 회피하되 ∞는 아니다 —
                                  #   골목을 가로질러야 하는 구간이 있고, 그건 차도와 다르다.
                                  # ⚠️ **실내 테스트로 돌아갈 때는 drivable: true / cost: 0.0**
                                  #   으로 다시 켤 것 — 실내 바닥이 alley 로 분류된다
                                  #   (0731 실측 0.62). 그때 cost 도 반드시 0.0 이어야 한다:
                                  #   주행가능인데 비용이 붙으면 '갈 수 있지만 가기 싫은 곳'이
                                  #   되어 표가 어긋나고 tests/test_costmap.py 가 그걸 막는다
      bike_lane:                   # 자전거도로 — 인도보다 위험(자전거 속도)
        drivable: false
        cost: 2.0
      crosswalk:                  # 횡단보도 = 차도 위 도색면. segv2 신규 클래스로,
        drivable: false           # 구모델에선 roadway로 잡히던 픽셀이다 — roadway: true를
        cost: .inf                # 빼면 횡단보도 앞 방어가 조용히 사라진다.
        roadway: true             # 명세 5단계(점자블록 미설치 판정)의 트리거이기도 하다
      roadway:                    # 차도 — 절대 접근 금지 (명세 하드 제약)
        drivable: false
        cost: .inf
        roadway: true
    post:                         # 마스크 → SegmentationFrame 요약 임계값
                                  # ※ 전부 초기 추정값 — 보드 실사 영상으로 재보정 필요
      sidewalk_min_fraction: 0.08 # 하단 절반 주행가능 비율이 미만이면 경계 소실 판정
      corridor_width_ratio: 0.5   # 진행 코리도: 중앙 폭 비율
      corridor_height_ratio: 0.4  # 진행 코리도: 하단 높이 비율
      ego_gap_rows: 6             # 자차 연결 판정 시 메우는 세로 끊김 최대 행 수.
                                  # 주행가능 판정은 '화면 아래에서 위로 내 열이 끊기지
                                  # 않고 이어지는가'로 한다(자차 연결 — 아래 근거).
                                  # 그림자·맨홀·타일 이음선이 한두 행 끊으면 그 위
                                  # 인도가 통째로 '내 것이 아닌' 영역이 되므로, 이
                                  # 행 수 이하의 끊김은 세로 닫힘(closing)으로 메운다.
                                  # 카메라 하향각에서 6행 ≈ 원거리 수십 cm — 실사
                                  # 재보정 대상. 올리면 사람 다리 사이로 이어져 버린다
      roadway_risk_fraction: 0.20 # 코리도 내 차도 비율 ≥ → 침범 위험. **ESTOP이 아니라
                                  # 회피 선회(ESCAPE)** 다 — 명세: '차도를 만나면 좌 or
                                  # 우로 방향 전환 후 인도로 주행'. 0.25에서 내렸다:
                                  # 선회는 정지와 달리 되돌릴 수 있는 동작이라 더 일찍
                                  # 반응해도 손해가 없고, 늦게 반응하면 선회 반경이
                                  # 인도 폭을 넘는다
      roadway_critical_fraction: 0.55  # 코리도 내 차도 비율 ≥ → 즉시 ESTOP(수동 해제).
                                  # 선회로는 이미 늦은 경우 = 로봇이 사실상 차도 위다.
                                  # 명세의 '차도 절대 접근 금지'가 남긴 최후 방어선이고,
                                  # 이 한 줄이 ESCAPE를 안전하게 만드는 근거다:
                                  # 위험(0.20)에서는 되돌리려 시도하고, 실패해서 절반을
                                  # 넘기면 사람을 부른다. 코리도 절반 이상이 차도로
                                  # 찍히는 장면은 정상 인도 주행에서 나오지 않는다
      obstacle_min_fraction: 0.10 # 판정 밴드 내 **미분류** 비율 ≥ → 장애물 후보.
                                  # 미분류 = 7개 클래스 어디에도 안 잡힌 픽셀 =
                                  # 명세의 '7개 클래스 제외 장애물'(사람·킥보드·볼라드).
                                  # ※ 종전 정의는 '비주행 & 비차도'라 bike_lane·
                                  #   caution_zone이 장애물로 잡혔다 — 자전거도로 옆을
                                  #   지나는 것만으로 회피가 걸렸다. 0.12에서 내린 것은
                                  #   조기 반응 요구(0803 실외) 반영
      obstacle_blocking_proximity: 0.40  # 장애물 근접도 ≥ → blocking(회피 기동).
                                  # 기준은 판정 밴드 내부(0=밴드 상단, 1=밴드 하단).
                                  # ※ 0.55에서 내렸다 — 0803 실외 '반응이 늦다'.
                                  # 회피가 정지가 아니라 선회가 된 뒤로는 조기 반응의
                                  # 대가가 작다(잘못 피해도 인도 안에서 비껴가고 끝)
      # '미분류 픽셀 = 장애물'은 모델의 미검출과 실제 물체를 구분하지 못한다. 비율
      # 하나로만 판정하면 실외에서 상시 오탐이라 아래 두 기하 조건을 함께 요구한다
      # (근거·유도는 perception/segmentation.py 모듈 독스트링의 '장애물' 항목).
      obstacle_bottom_margin_ratio: 0.25  # 판정 밴드에서 제외할 코리도 최하단 비율.
                                  # 이 구간은 로봇 자기 몸체·그림자·극단 사각으로 세그
                                  # 미검출이 몰리고, 그 미검출이 곧 '범퍼 앞 장애물'로
                                  # 잡혀 회피를 유발한다. 차도 위험 판정은 이 여백을
                                  # 쓰지 않는다 — roadway는 명시적 예측 클래스라
                                  # 미검출이 오탐 방향으로 작동하지 않는다
      obstacle_min_height_ratio: 0.35  # 영역 세로 폭 / 밴드 높이 하한. 지면에 선 물체는
                                  # 화면에서 위아래로 뻗지만 노면 오분류는 얇은 띠로
                                  # 깔린다. blocking은 근접도가 높을 때만이고 가까운
                                  # 물체는 화면에서 크므로 실물은 이 조건을 쉽게 넘는다.
                                  # ※ 보드 실사 영상으로 재보정 대상(초기 추정값)
      braille_min_fraction: 0.005 # 화면 내 점자블록 비율 ≥ → 발견(접근 추종 시작)
      proximity_quantile: 0.95    # 근접도 = 마스크 행의 이 퍼센타일 — 최하단 노이즈
                                  # 픽셀 1개가 근접도를 1로 튀게 하는 것을 막는다
      # 횡단보도 점자블록 **미설치 구역** 판정 (명세 5단계).
      # 원리: 로봇은 인도 위에 있고 횡단보도는 그 앞이므로 화면에서 횡단보도가 위,
      # 인도가 아래다. 점형(경고) 블록은 그 경계 바로 앞 인도 쪽에 깔려야 한다 —
      # 즉 '횡단보도 마스크의 가장 가까운 행 바로 아래 띠'에 점자블록이 있는지만
      # 보면 된다. 그 띠에 없으면 미설치 구역이다.
      crosswalk_min_fraction: 0.03    # 화면 내 횡단보도 비율 ≥ → 횡단보도 발견.
                                  # 점자블록 하한(0.005)보다 훨씬 높다: 횡단보도는
                                  # 도색면이 넓어 원거리에서도 이보다 크게 잡히고,
                                  # 낮게 두면 노면 반사·흰 도색 오탐이 미설치 보고를
                                  # 남발한다(보고는 되돌릴 수 없는 외부 출력이다)
      crosswalk_seam_band_ratio: 0.12  # 판정 띠의 높이 / 화면 높이. 횡단보도 최근접
                                  # 행에서 이 비율만큼 **아래**(로봇 쪽)가 판정 구간.
                                  # 0.12 = 480px에서 58px — 하향각 카메라에서 대략
                                  # 점형블록 1~2줄 폭. 좁히면 미설치 오보고가 늘고
                                  # (있는데 띠를 비껴간다), 넓히면 미탐이 는다
                                  # (유도선의 선형블록까지 들어와 '있다'가 된다)
      crosswalk_seam_braille_min_fraction: 0.02  # 판정 띠 내 점자블록 비율이 미만이면
                                  # **미설치**. 띠 면적의 2%뿐이라 낮아 보이지만
                                  # 점형블록은 띠 폭 전체를 채우지 않고(횡단보도 폭
                                  # 일부에만 깔린다) 세그가 블록 경계를 보수적으로
                                  # 자르므로, 실측 재보정 전에는 미탐(있는데 없다고
                                  # 보고)보다 미보고 쪽으로 기울여 둔다
      crosswalk_seam_drivable_min_fraction: 0.05  # 판정 띠 안 **주행가능 비율**이 미만이면
                                  # 판정을 보류한다(미설치로 단정하지 않는다). 명세가
                                  # '횡단보도와 **sidewalk** 사이'이므로, 띠가 차도·미분류
                                  # 영역에 얹혀 있으면 애초에 그 '사이'가 아니다.
                                  # ※ 0804 실외에서 미설치 12건이 전부 보고됐고 증거
                                  #   사진 확인 결과 최소 2건이 오탐이었다: 카메라가 하늘을
                                  #   본 프레임(횡단보도가 화면 하단에 걸려 띠가 잘림)과
                                  #   유도블록이 실제로 있는데 원거리라 세그가 놓친 프레임.
                                  #   전자는 띠 잘림 가드가, 후자는 이 비율이 막는다.
                                  #   올리면 보고가 줄고(보수적), 내리면 종전 동작에 가깝다
      # 빈 프레임 — 세그가 **어느 클래스도 못 잡은** 틱. 미분류 = 장애물이라는 정의상
      # 그 틱은 '화면 전체가 장애물 + 막다른 길'로 찍힌다. 근거·실측은
      # perception/segmentation.py BlankFrameGate 독스트링.
      blank_max_known_fraction: 0.02  # 분류된 픽셀 비율이 이 이하면 빈 프레임으로 본다.
                                  # 정상 장면은 인도만으로도 이 값을 훨씬 넘는다 —
                                  # 0.02는 '거의 아무것도 없다'의 여유값이지 튜닝 노브가
                                  # 아니다. 올리면 실제 장면이 빈 프레임으로 오인된다
      blank_confirm_sec: 0.6      # 빈 상태가 이만큼 이어져야 '앞이 막혔다'로 인정한다.
                                  # 추론 지터는 한두 틱(0.1~0.2초)이고 벽은 사라지지
                                  # 않는다 — 2026-08-05 실측 런길이가 1~2틱 다수 +
                                  # 30틱 이상 덩어리로 갈렸다. 유예 중 명령은 정지가
                                  # 아니라 인지 소실 복구 주행(저속 + 직전 조향)이므로
                                  # 0.6초 동안 나아가는 거리는 20cm 남짓이다.
                                  # 0으로 두면 종전 동작(빈 프레임 = 즉시 막힘)
      centerline:                 # 인도 중심선 RANSAC 적합 — 무게중심 스칼라를 대체한다.
                                  # 적합 실패 시 무게중심으로 자동 강등되므로 종전 동작이
                                  # 항상 폴백으로 남는다 (docs/ALGORITHMS.md N6)
        sample_rows: 16           # 하단 절반에서 뽑는 표본 행 수
        min_row_width_ratio: 0.08 # 행의 주행가능 구간 폭이 화면 폭의 이 비율 미만이면 버린다
        min_samples: 5            # 표본이 이보다 적으면 적합 포기 → 무게중심 폴백
        ransac_iterations: 30     # 후보 3개조 시도 횟수 (고정 시드 — 같은 입력이면 같은 결과)
        inlier_threshold_ratio: 0.08  # 잔차가 이 값 이내면 인라이어. 정규화 x(-1~+1)
                                  # 기준이므로 0.08은 화면 폭의 4%
        min_inlier_ratio: 0.6     # 인라이어가 표본의 이 비율 미만이면 적합 실패 → 폴백.
                                  # 교차로·갈라진 인도에서 엉뚱한 선을 잡는 것을 막는 안전판
        lookahead_ratio: 0.5      # 조향 목표를 중심선의 이 지점에서 읽는다.
                                  # 0=화면 최하단(바로 앞) ~ 1=밴드 상단(가장 멀리).
                                  # 올리면 굽은 길을 미리 파고들고, 내리면 현재 위치 추종
    free_space:                   # 자유공간 프로파일 — **원거리 장애물의 유일한 통로**
                                  # (docs/ALGORITHMS.md N8 '가상 LaserScan' 축소판)
                                  #
                                  # 왜 필요한가: 위 post 절의 장애물 판정은 화면 하단
                                  # 60~90% 밴드 안에서만 돈다. 카메라 높이 0.3m·하향 10°
                                  # 기준으로 그건 **지면 0.56~1.14m**뿐이고, 4~5m 앞
                                  # 보행자는 화면 y≈177에 찍혀 밴드(y 288~)에 들어오지도
                                  # 못한다 — 0803 실외 테스트에서 사람 다리·신발을 전혀
                                  # 인지하지 못한 원인이다. 밴드를 위로 넓히면 종전 정의
                                  # ('밴드 안 미분류 픽셀')로는 하늘·건물이 전부 장애물이
                                  # 되므로, 정의 자체를 바꿔야 넓힐 수 있다:
                                  # '미분류를 센다' → **'주행가능이 어디까지 이어지나'**.
                                  # 각 열을 아래에서 위로 훑어 주행가능이 끊기는 곳이
                                  # 그 방향의 자유거리이고, 지면에 선 물체는 자기 열의
                                  # 자유거리를 이웃보다 짧게 끊는다(노치). 하늘은 주행가능
                                  # 구간 위쪽이라 산식에 참여하지 않는다.
                                  # 슬롯 분할은 아래 costmap.slot_count를 그대로 쓴다
                                  # (비용을 원소별로 더하므로 같아야 한다).
                                  # ※ 임계값 전부 초기 추정값 — 보드 실사 영상 재보정 필수.
                                  #   절대 거리는 IPM(docs/ALGORITHMS.md B3) 없이는 나오지
                                  #   않으므로 여기 값은 전부 행 기반 유사-거리다
      enabled: true               # false면 종전 근거리 밴드 판정만 남는다 (폴백 경로 보존)
      slot_quantile: 0.3          # 슬롯의 자유거리 = 그 슬롯 열들의 이 분위수.
                                  # 중앙값(0.5)이 아닌 이유: 4.5m 사람의 겉보기 폭 ≈39px,
                                  # 슬롯 폭 640/15 ≈43px이라 두 슬롯에 걸치면 양쪽 모두
                                  # 다수결에서 지워진다. 낮추면 민감해지고 노이즈도 늘어난다
                                  # (노이즈 방어는 obstacle_min_slots가 담당)
      notch_min_ratio: 0.08       # 최선 슬롯 대비 자유거리가 이 비율 이상 짧아야 노치.
                                  # **상대** 판정 = '옆이 더 열려 있다' → 좌우 회피 트리거.
                                  # 절대 임계를 쓰지 않는 이유: 자유거리 상한이 장면마다
                                  # 다르다(곧은 인도는 지평선까지, 코너는 훨씬 아래에서
                                  # 끊긴다) — 절대값이면 코너마다 전 슬롯이 장애물이 된다.
                                  # 0.08의 근거: 카메라 0.3m·하향 10°에서 4.5m 사람의
                                  # 노치 깊이가 약 0.13으로 계산된다. 여유를 두고 그 아래.
                                  # 내리면 원거리 민감도↑ 오탐↑ — 실사로 재보정할 것
      notch_cost: 1.8             # 노치 깊이 × 이 계수 = 코스트맵 슬롯 비용 가산분.
                                  # ※ 1.2에서 올렸다. 0803 실외에서 '장애물을 크게
                                  #   인식하지 못한다'의 정량적 원인이 여기였다:
                                  #   4.5m 사람의 노치 깊이가 약 0.13이므로 가산 비용은
                                  #   1.2×0.13 = 0.156뿐이고, 그 사람을 피해 슬롯 2칸
                                  #   (ratio 0.27)을 옆으로 가는 대가는 목표 이탈
                                  #   1.0×0.27 = 0.27이다 — 즉 **비껴가는 쪽이 항상
                                  #   비싸서 사람 쪽으로 계속 조향했다.** 1.8이면
                                  #   0.234 > 0.27은 아직 아니지만 슬롯 1칸(0.133)
                                  #   회피는 이긴다. 근거리로 오면 노치가 깊어지며
                                  #   회피 폭이 자동으로 커진다(0.4 깊이 → 0.72)
                                  # 이 경로가 **상태 전이 없이 비껴가는** 동작을 만든다.
                                  # costmap.unknown_cost(0.9)보다 크게 둔다 — 마스크 구멍
                                  # 하나보다 '그 방향은 실제로 막혀 있다'가 더 강한 근거다.
                                  # driving.cruise.costmap.target_weight(1.0)와 견주는
                                  # 값이기도 하다: 이보다 작으면 목표 이탈 페널티가 이겨
                                  # 사람 쪽으로 계속 조향한다
      blocking_reach_ratio: 0.42  # 자유거리 비율이 이 값 미만이면 blocking → AVOID
                                  # 회피 기동. **절대** 판정 = '바로 앞이 막혔다'.
                                  # 상대 노치만으로 회피 기동에 들어가지 않는 이유:
                                  # 노치는 '옆이 더 열렸다'는 뜻이고 그건 비껴가면 될 일이다.
                                  # 회피 기동까지 갈 근거는 절대적으로 막혔을 때여야 한다.
                                  # ※ 0.30에서 올렸다(= 더 일찍 반응). 0.30은 판정 시작
                                  #   행 기준 하단 30% 안에서 끊긴 경우 = 카메라 0.3m·
                                  #   하향 10°에서 대략 1m 이내였다. 회피가 **정지에서
                                  #   선회로** 바뀐 뒤에는 그 거리가 너무 짧다: 선회로
                                  #   물체를 비껴가려면 물체 폭만큼의 횡이동 거리가
                                  #   필요하고, 1m 앞에서 시작하면 조향 15°·0.32m/s로는
                                  #   물체에 닿는다. 0.42 ≈ 1.5m 안 = 선회 시작 여유.
                                  #   더 올리면 원거리 노이즈가 회피 기동을 유발한다
                                  #   (그 구간은 노치 비용의 부드러운 조향이 담당)
      blocking_seam_px: 4         # 끊긴 행에서 **위로 몇 px** 보고 원인을 정할지.
                                  # 서로 다른 인스턴스 마스크는 맞닿지 않고 1~3px
                                  # 이음새(미분류)를 남긴다 — 실측 진단에서 인도가 끝나고
                                  # 횡단보도가 시작되는 자리의 '끊긴 행'이 슬롯 하나에
                                  # 66~89열이나 그 이음새였다. 한 행만 보면 모든 경계가
                                  # 물체로 읽혀 아래 판정이 통째로 죽는다.
                                  # 넓히지 말 것: 낮은 물체(가방·볼라드) 뒤로 보이는
                                  # 원거리 노면이 창에 들어와 물체가 경계로 지워진다
      blocking_object_min_ratio: 0.5  # 그 짧은 자유거리를 만든 열 중 **미분류에서 끊긴**
                                  # 비율이 이 값 이상이어야 blocking 이다.
                                  # 자유거리는 '주행가능이 어디까지 이어지나'만 재고
                                  # **왜 끊겼는지**를 묻지 않았다 — 그래서 인도가 끝나고
                                  # 차도가 시작되는 지점(횡단보도 연석)이 정면을 가로막은
                                  # 물체와 똑같이 취급됐다.
                                  # 실측 2026-08-05(실사 38장): blocking 22건 중 **6건이
                                  # crosswalk·roadway 에서 끊긴 것**이었고 전부 횡단보도
                                  # 접근 프레임이다 — 미설치 판정(명세 5단계)을 하러 가야
                                  # 하는 바로 그 자리에서 회피가 걸렸다.
                                  # 차도 방어는 그대로다: 코리도 차도 비율이 선회(0.20)와
                                  # ESTOP(0.55)을 따로 보고 있고, 이 값은 같은 사실에 두
                                  # 계층이 각각 반응하던 중복만 없앤다. 횡단보도 위에 선
                                  # 차·사람은 미분류라 여전히 잡힌다.
                                  # 0.5 = '그 슬롯의 짧은 도달이 절반 이상 물체 때문'.
                                  # 0으로 두면 원인을 묻지 않던 종전 동작이다
      obstacle_min_slots: 1       # 노치가 이 개수 이상 **연속**돼야 장애물로 보고한다.
                                  # 1인 이유: 4.5m 사람은 슬롯 1~2개폭이라 2를 요구하면
                                  # 바로 그 대상을 놓친다. 오탐이 잦으면 여기를 올리기
                                  # 전에 slot_quantile을 먼저 올릴 것(같은 노이즈를
                                  # 더 싼 비용으로 누른다)
    costmap:                      # N7 시맨틱 주행가능도 코스트맵 — docs/ALGORITHMS.md N7
                                  # 화면 하단 밴드(post.corridor_height_ratio, 전체 폭)를
                                  # x축 슬롯으로 쪼개 슬롯별 통행 비용을 만든다. CRUISE가 소비
      slot_count: 15              # 방향 슬롯 수 (홀수 → 정중앙 슬롯이 존재)
      unknown_cost: 0.9           # 미분류 픽셀 비용 — 마스크 구멍 = 미학습 물체(사람·볼라드)
      min_class_fraction: 0.02    # 슬롯 내 이 비율 미만 클래스는 노이즈로 보고 무시
                                  # (차도 오탐 픽셀 몇 개가 슬롯을 ∞로 만드는 것 방지)
                                  # ※ 클래스별 통행 비용은 위 segmentation.classes 표에
                                  #   있다 — 우선순위 정보를 두 곳에 두지 않는다

  braille:                        # 점자블록 파손 판정 (게이트 통과 시만) — YOLO26n
    model_path: models/braille_defect.pt
    engine_path: models/braille_defect.engine  # TensorRT 엔진 경로 — 보드 작업에서
                                  # 전환 예정. 현 코드는 model_path(.pt)만 로드한다.
                                  # tools/braille_detect/jetson_infer.py가 엔진을
                                  # 빌드하면 정확히 이 경로에 생긴다 (가중치 옆)
    imgsz: [960, 960]             # 학습 imgsz. 줄이면 defect_partial이 먼저 무너진다(≈55px)
    decision_rule: band_argmax    # band_argmax 전용 — 다른 값이면 기동 시 즉시 실패
                                  # (다른 규칙 구현은 tools/braille_detect/jetson_infer.py 참고)
    conf: 0.25                    # 검출 신뢰도 하한
    iou: 0.5                      # NMS IoU
    iou_same_band: 0.55           # 같은 띠로 묶는 IoU — 원본 jetson_infer.py 상수
    band_conf: 0.0                # 띠 판정 운영점. 0=순수 argmax가 F1·실사정확도 최대.
                                  # 올리면 오탐↓ 미탐↑ — 근거 없이 건드리지 말 것
    defect_conf: 0.35             # 띠 판정에는 무영향. defect_partial 승격에만 쓰인다
    min_defects: 1                # 국소 파손 승격 최소 개수 (실제 하한은 max(2, 이 값))

driving:
  loop_hz: 20                     # 메인 루프 주기: 인지 입력 → step() → 하드웨어 명령
  steer_rate_deg_per_s: 200.0     # 조향 슬루율 상한(도/초) — 모든 상태의 명령에 적용된다.
                                  # 세그 중심 목표가 프레임마다 흔들리는 것을 그대로 서보에
                                  # 쓰면 조향이 떤다.
                                  # 낮추면 부드럽지만 굽은 길 추종이 늦는다 — 필드 튜닝.
                                  # ※ 60 → 100 → 200. 100은 MG996R 사양(4.8V에서 0.17초/60°
                                  #   ≈ 350°/s)의 1/3이라 **서보가 아니라 이 값이 병목**이었다.
                                  #   비용은 큰 조향 기동에서 나온다: 재정향의 좌 30° ↔ 우 25°
                                  #   전환이 55°이고, 100이면 0.55초 — 전진 호(2.0초)의 27%를
                                  #   조향이 도착하기를 기다리는 데 쓴다. 200이면 0.28초다.
                                  #   떨림 위험은 남는다: 중립 근처 조향 응답은 **미측정**이고
                                  #   (cruise 상한 주석의 실측 재분석 참조), 종전에 그 대역을
                                  #   '사각지대'라고 부른 것은 상태 선택 편향이었다.
                                  #   그래서 이 값은 실주행 관찰 대상 1순위다 — 주행선이
                                  #   톱니처럼 떨리면 여기부터 되돌릴 것.
                                  #   보드 실주행에서 '떨림 vs 추종 지연'으로 재보정할 것
  perception_grace_sec: 1.5       # 인도 경계 소실·인지 두절이 이 시간 이상 지속돼야 IDLE
                                  # 폴백. 유예 중에는 **정지하지 않고 복구 주행**을 한다
                                  # (아래 recovery_throttle_pct). 0이면 즉시 폴백.
                                  # ※ 0.3 → 1.0 → 1.5로 올려 왔다. IDLE은 수동 개입만이
                                  #   출구인 흡수 상태이므로, 실외 세그 깜빡임 한두 프레임에
                                  #   미션이 끝나는 것을 막는 것이 이 창의 목적이다.
                                  #   1.5초 × 복구 스로틀 35%(0.112m/s) = 최대 17cm 이동
  recovery_reverse_throttle_pct: 60   # 경계 소실의 원인이 '벗어나서'가 아니라 '막혀서'일 때
                                  # (정면 blocking 장애물이 잡힘) 쓰는 **후진 복구** 스로틀.
                                  # 벽에 코가 닿으면 화각을 벽이 채워 인도가 안 보인다 —
                                  # 길을 잃은 것이 아니라 너무 가까이 붙은 것이므로 대응이
                                  # 반대여야 한다. 뒤로 빼면 바로 보인다.
                                  # 조향은 중립으로 곧게 뺀다(후방은 카메라 사각).
  recovery_reverse_debounce_sec: 0.5  # '막혀서 안 보임'이 이만큼 **지속돼야** 후진을
                                  # 시작한다. 후진은 되돌리기 어려운 기동이라 깜빡임
                                  # 한 프레임으로 걸면 안 된다.
                                  # ※ 0804 실기: 이게 없어서 세그가 한 프레임 흔들릴
                                  #   때마다 min_sec(1.2초) 강제 후진이 걸렸고, 그 뒤
                                  #   인계 규칙에 따라 재정향·U턴까지 갔다. 코스트맵이
                                  #   거의 전부 0인(완전히 트인) 장면에서도 후진했다.
                                  #   perception_grace_sec 이 IDLE 폴백에 하는 역할을
                                  #   후진 분기에도 준 것이다.
  recovery_reverse_min_sec: 1.2   # 후진 복구 **최소** 시간. 한 번 시작하면 인도가
                                  # 다시 보여도 이만큼은 뺀다.
                                  # ※ 0804 실기: 이게 없어서 벽에서 한 틱 물러나
                                  #   바닥이 보이는 순간 가드가 풀리고 CRUISE가 다시
                                  #   전진해 벽에 박았다 — '후진 찔끔하고 계속 쳐박음'.
                                  #   상한만 있고 하한이 없어 실제 후진은 한두 틱이었다.
                                  #   60% × 1.2초 ≈ 23cm — 코가 벽에서 떨어지는 거리.
  recovery_reverse_sec: 5.0       # 후진 복구 상한. 이 시간 안에 경로가 안 보이면
                                  # 종전대로 IDLE(수동 대기)로 간다.
                                  # ※ 0804 추가. 종전에는 이 경우도 브레이크였고, 벽 앞에서
                                  #   1.5초 정지 후 IDLE이 전부였다. 재정향 승격은 AVOID
                                  #   재확인 3초가 필요한데 경계 소실이 2초에 끊어,
                                  #   벽 앞에서는 재정향에 구조적으로 도달할 수 없었다.
                                  #   ※ 2.5 → 5.0. 종료 기준을 '경로 인지'(인도가 보이고
                                  #     정면을 막는 것이 없음)로 강화하자 2.5초로는
                                  #     상한에 먼저 걸려 IDLE로 떨어졌다.
  recovery_backtrack_sec: 1.0     # 유예가 다한 뒤 **IDLE 로 떨어지기 직전에 한 번**
                                  # 하는 되짚기 후진의 길이. 0이면 종전 동작(즉시 IDLE).
                                  # 왜 필요한가: 소실 원인 중 '인도를 벗어남'은 앞이
                                  # 트여 있어 blocking 이 안 잡히고, 그래서 위 후진 복구
                                  # 경로로 가지 못한 채 1.5초 만에 미션이 끝난다 —
                                  # 정작 후진으로 가장 잘 풀리는 경우다(로봇은 직전까지
                                  # 인도 위에 있었으므로 되감으면 인도로 돌아간다).
                                  # 조향은 **직전 값을 유지**한다: 전진 때와 같은 조향각
                                  # 으로 후진하면 회전중심이 같아 그 호를 되짚는다.
                                  # 곧게 빼는 막힘 후진과 목적이 다르다('벽에서 물러나기'
                                  # vs '왔던 길로 돌아가기').
                                  # 1.0초 × 60% = 약 19cm — 유예 중 전진 복구가 간
                                  # 거리(35% × 1.5초 ≈ 17cm)를 되짚는 크기다.
                                  # 실패해도 잃는 것은 그 1초뿐이고 그 자리는 방금
                                  # 지나온 곳이다. 카메라가 죽었으면 하지 않는다
  recovery_throttle_pct: 35       # 경계 소실 유예 중의 **복구 주행** 스로틀.
                                  # 종전에는 유예 중 브레이크 정지였다. 명세는 '인도를
                                  # 벗어날 것 같을 때 좌우로 회피'이고, 0803 실외 관찰은
                                  # '자꾸 정지만 함'이었다 — 정지는 둘 다 어긴다.
                                  # 소실 순간의 조향(prev_steer_deg)을 그대로 유지하며
                                  # 저속 전진한다: 인도를 벗어나는 중이라면 그 조향이
                                  # 이미 되돌리는 방향이고(중심 오차가 커질수록 조향이
                                  # 그쪽으로 커진 뒤에 소실되므로), 유지하는 것이 최선의
                                  # 사전 정보다. 눈먼 주행이 아니다 — 차도 침범 가드는
                                  # 이 위에서 그대로 돌고, frame 자체가 없으면(카메라
                                  # 장애) 복구하지 않고 브레이크로 간다
  start_request_hold_sec: 3.0      # 시작 요청(터치센서·Xbox A·웹 버튼)을 몇 초간 들고
                                  # 재시도할 것인가. IDLE 탈출 조건이 '시작 요청 + 인도
                                  # 확인'이라, 누른 틱에 인도가 안 보이면 요청이 그대로
                                  # 소멸했다 — 경계 소실로 IDLE에 떨어진 직후가 정확히
                                  # 그 상황이라 아무리 눌러도 안 나갔다(0804 실외).
                                  # **무한 래치가 아니다**: 눌러 두고 자리를 떠난 뒤
                                  # 한참 있다 인도가 화면에 들어와 스스로 출발하는 것이
                                  # 'IDLE의 출구는 수동 개입뿐'이 막으려던 사고다.
                                  # 3초 = 조작자가 로봇 앞에서 카메라를 인도로 돌려주는
                                  # 데 걸리는 시간. 0이면 종전 동작(1틱 소비)
  cruise:
    throttle_pct: 100             # 주행 스로틀(%). 이 봇은 구동계 최고 ~0.32m/s라 100%가
                                  # 보행속도(4km/h≈1.1m/s)에 못 미친다 — 속도 상한을 두는
                                  # 의미가 없어 60에서 올렸다. 감속은 상태별로 한다
                                  # (turn·avoid·slope 하강). docs/HARDWARE.md '속도 캘리브레이션'
    steer_gain_deg: 30.0          # 인도 중심 오차(비율 -1~+1)당 조향 오프셋 이득(도).
                                  # ※ 20 → 30. 아래 상한과 **함께** 올린 값이고, 포화
                                  #   지점(오차 비율)은 종전과 같게 맞췄다: 좌 22/30=0.73
                                  #   (종전 15/20=0.75), 우 18/30=0.60 (종전 12/20=0.60).
                                  #   즉 '언제 포화되는가'는 그대로 두고 '포화됐을 때
                                  #   실제로 도는가'만 고친 것이다 — 근거는 상한 주석.
    # CRUISE 비례 조향 오프셋 상한(도) — 부드러운 추종. 하드웨어가 비대칭이므로
    # (hardware.steering_servo: 좌 45 / 우 30, 우측 절대 130°는 링키지 걸림 경계라
    #  지속 조향은 +25° 이하 권장 — docs/HARDWARE.md §4) 주행 계층도 좌우를 따로 든다.
    # 하드웨어 클램프는 안전망일 뿐이라 FSM이 우 30°를 내고 잘리면 자기 명령이 안 먹은
    # 걸 모른 채 계속 그 값을 낸다 — 그래서 상한을 여기서 먼저 건다.
    # ※ 둘 다 필드 튜닝 대상이다. 보드 실사 영상이 없어 종전 대칭값 12를 기준으로 잡았다:
    #   우측은 12 그대로(올릴 근거가 없고 지속 조향 권장 상한 25가 천장이다. 25 초과 금지),
    #   좌측만 하드웨어 여유(좌 45)를 반영해 소폭 올렸다. 굽은 길 추종이 늦으면 좌측부터
    #   올리고, 우측은 25에 닿기 전에 실차로 링키지 끌림을 확인할 것.
    # ===== 조향각 → 회전 실측 (0805 실기, drive_trace 세션 7+8) =====
    # ※ 2026-08-06 재분석. 종전 주석은 '18° 미만은 조향 사각지대(안 돈다)'라고 적고
    #   n=338/57/10 을 근거로 들었는데, 그 집계는 **틱 수**였고 상태를 섞고 있었다.
    #   정상상태 구간(조향·스로틀·상태가 0.3초 이상 일정) 단위로 다시 세면,
    #   **실제로 선회를 명령한 상태**(AVOID·TURN·DEAD_END·ESCAPE)에서 관측된 조향각은
    #   다섯 개뿐이다:
    #        좌 40°   4.2 dps (4.9초, DEAD_END 100%)
    #        좌 25°  10.9 dps (49.9초, AVOID 90%)
    #        중립      3.0 dps (13.3초)
    #        우 20°  17.6 dps (7.7초, AVOID 90%)
    #        우 28°  17.5 dps (4.3초, DEAD_END 100%)
    #   여기서 확실한 것은 둘이다:
    #     · **좌 40°는 좌 25°의 절반도 못 돈다** — 앞바퀴 스크럽 저항을 이 구동계가
    #       못 이긴다. '깊을수록 잘 돈다'는 전제는 좌측에서 반증됐다(dead_end 주석).
    #     · **우 20°와 우 28°는 사실상 같다**(17.6 vs 17.5).
    #   성립하지 않는 것:
    #     · '18° 미만 사각지대'. 그 대역 표본은 **전부 TRACE(직선 유도선 추종)·CRUISE**
    #       라 애초에 돌라고 명령한 적이 없다 — 0.0~0.2 dps 는 '조향이 안 먹었다'가
    #       아니라 '직진 중이었다'이다. 상태 선택 편향이지 조향 응답이 아니다.
    #     · 좌 25~40 사이와 우 0~20 사이는 **표본이 아예 없다** — 미측정 구간이다.
    # ※ 2026-08-06 (2차): 25 / 22 → **20 / 16**. 같은 날 아침에 25/22 로 올렸다가
    #   위 실측 재분석 뒤에 되돌린 값이다. 판단 근거가 셋으로 바뀌었다:
    #     ① **기동 각도(좌 25 / 우 20)보다 아래여야 한다.** 그것이 '완만 추종'과
    #        '깊은 회전'의 층위이고, 25/22 는 TURN(당시 30/25)에 3° 차로 붙어 있었다.
    #     ② **우측은 각도가 작아도 세다.** 우 16°의 기구학적 회전은 100% 스로틀에서
    #        약 15 dps 로, 실측된 좌 25°(12 dps 환산)보다 크다 — 즉 '우측 상한을
    #        풀어야 우로 돈다'는 전제 자체가 틀렸다. 우측은 원래 잘 돈다.
    #     ③ **슬루율을 100 → 200 으로 두 배 올렸다.** 같은 상한이라도 도달 시간이
    #        절반이라 실효 공격성이 그만큼 커진다. 상한을 낮춰 상쇄한다.
    #   좌:우 = 5:4 는 기동 각도(25:20)와 같은 비율이다 — 실측이 '좌측이 더 깊어야
    #   같은 값을 낸다'까지만 말해 주고 정확한 비율은 미측정이라, 두 층위가 같은
    #   비대칭을 쓰게 해서 한 곳만 어긋나는 일을 막는다.
    steer_left_max_deg: 20.0      # 좌회전(음수 오프셋) 상한 크기 — 15 → 22 → 25 → 20
    steer_right_max_deg: 16.0     # 우회전(양수 오프셋) 상한 — 12 → 18 → 22 → 16
    costmap:                      # 코스트맵 조향 — cost_profile이 있는 프레임에서만 활성
                                  # (없으면 위 이득·상한의 비례 조향 폴백: mock 기본값)
      target_weight: 1.0          # 목표 방향(인도 중심/블록 혼합) 이탈 페널티 — 비용/ratio.
                                  # perception…costmap.unknown_cost(0.9)보다 낮아야
                                  # 장애물이 낸 마스크 구멍을 옆으로 우회한다
      commit_weight: 0.15         # 직전 선택 방향 이탈 페널티 — 슬롯 간 채터링 방지
                                  # 히스테리시스. 조향 슬루율 제한(steer_rate_deg_per_s)과
                                  # 는 다른 층이다: 이쪽은 '어느 슬롯을 고르는가',
                                  # 슬루율은 '고른 각도에 얼마나 빨리 가는가'
  avoid:
    # ※ 0804 추가 — 반복 회피 승격. 인지가 '한쪽은 열려 있다'고 잘못 판단하면
    #   SWERVE→복귀→재막힘이 무한 반복되고, 재정향(dead_end)은 그 위에 있어
    #   영원히 발동하지 않는다. 실측: 90초 동안 회피 14회, 그동안
    #   all_directions_blocked는 **한 번도** True가 되지 않았다.
    #   그래서 '막혔다'를 인지에만 맡기지 않고 FSM 이력으로도 판단한다.
    thrash_limit: 4               # 창 안에서 이 횟수만큼 연달아 회피하면 재정향으로
                                  # 승격. 실측 주기가 2~3초라 4회 ≈ 10초 헛돎이다.
                                  # 낮추면 정상적인 연속 장애물에서도 후진하게 된다
    thrash_window_sec: 24.0       # 연속 판정 창 — 직전 회피와 이 시간 안이면 연속으로
                                  # 센다. 넘으면 리셋(그 사이에 실제로 나아갔다는 뜻).
                                  # ※ 6.0 → 8.0 → 24.0. 회피 상한 만료가 재정향이 아니라
                                  #   CRUISE 복귀이므로, 재정향 승격의 유일한 경로가 이
                                  #   카운터다. **창은 회피 상한보다 커야 한다** — 창이
                                  #   상한과 같거나 작으면 상한을 다 쓴 회피가 창 경계에
                                  #   걸려 연속으로 안 세어지고, 그러면 승격이 영영 안 온다.
                                  #   0806에 상한이 6 → 정체 10 / 절대 20이 됐으므로
                                  #   창도 그 위(24)로 올린다. 이 둘은 **같이 움직인다**

    # 장애물 회피 = **정지 없는 좌/우 선회**가 정상 경로다 (명세: '좌,우로 회피').
    # 국면: 벗어나기(SWERVE) → 통과(PASS) → 복귀(RETURN) → CRUISE.
    # 방향은 코스트맵 좌/우 절반 중 통행 불가 슬롯이 적은(동수면 비용이 낮은) 쪽,
    # 코스트맵이 없으면 장애물 치우침 반대쪽이다.
    #
    # ※ **IMU가 없어도 전 국면이 돈다.** 이것이 0803 실외 '좌우로 회피하지 않고
    #   자꾸 정지만 함'의 직접 원인이었다: 종전 회피는 종료 판정이 전부 yaw 기반
    #   (swerve_yaw_deg / return_yaw_tolerance_deg)이라 IMU 게이트 뒤에 있었고,
    #   IMU 배선이 해제된 상태(hardware.imu 주석)에서는 reading=None → 게이트가
    #   닫혀 **모든 장애물이 정지 대기(HOLD)로 떨어졌다.** 종료 판정을 시각(장애물
    #   소멸 / 중심 재정렬) + 시간으로 바꿔 게이트를 없앴다. 되돌아올 기준 방위를
    #   yaw로 잡지 못하는 대신 CRUISE 중심선 추종이 시각 피드백으로 수렴시킨다 —
    #   원래도 '남은 횡오차는 중심 추종이 담당'하는 설계였다.
    recheck_sec: 3.0              # 정지 대기(HOLD)에서 재확인까지 대기(초). HOLD는
                                  # 이제 **비껴갈 방향 자체가 없을 때**(코스트맵 전
                                  # 슬롯 ∞)와 경사발에만 쓰인다. 이 안에 풀리면 경로
                                  # 진행, 유지되면 막다른 길로 보고 회차 승격(IMU 게이트)
    bypass_throttle_pct: 90       # 우회 중 스로틀 — 30은 조향 꺾인 상태에서 링키지·
                                  # 타이어 저항을 못 이겨 거의 정지 (0803 야외 실측).
                                  # CRUISE 100 대비 감속은 유지하되 회피는 빨리 끝나는
                                  # 편이 인도 점유 시간이 짧다
    swerve_min_sec: 0.8           # **벗어나기 최소 커밋 시간** — 이 시간 전에는 장애물이
                                  # 화면에서 사라져도 SWERVE 를 끝내지 않는다.
                                  # ※ 0806 실기 '조향 후 이동을 찔끔찔끔 게이처럼 한다'의
                                  #   직접 원인이다. 종전 SWERVE 종료 조건은
                                  #   `not has_blocking_obstacle()` 단독이라 **한 틱(0.05초)**
                                  #   만에 끝날 수 있었다: 조향은 슬루율 때문에 아직 목표에
                                  #   도착하지도 않았고 로봇은 1.5cm 갔을 뿐인데, 장애물이
                                  #   코리도 밴드에서 한 프레임 빠지면 통과 국면으로 넘어간다.
                                  #   그러고 RETURN 이 반대로 꺾으면 같은 장애물을 같은
                                  #   각도에서 다시 만난다 — 그게 '헛짓하다 오히려 걸림'이다.
                                  #   0.8초 = 실측 회전(25°에서 13~19 dps)으로 11~16°를 버는
                                  #   시간이고, 90% 스로틀(0.29m/s)로 23cm 간다.
                                  #   국면 상한(phase_timeout_sec)보다 **작아야** 한다
    pass_sec: 1.5                 # 통과 직진 시간 — 전방 카메라는 옆의 장애물을
                                  # 못 보므로 통과 판정은 시간뿐이다.
                                  # ※ 0.8 → 1.5 (0806 실기). 0.8초 × 90%(0.29m/s) = 23cm 이고
                                  #   이 로봇의 전장이 그와 비슷하다 — 즉 '통과'가 끝난
                                  #   시점에 장애물은 아직 옆구리에 있었고, 그 상태에서
                                  #   RETURN 이 반대로 꺾으니 뒷바퀴가 걸렸다.
                                  #   1.5초 = 43cm 로, 전장 + 여유가 나온다
    return_center_abs: 0.35       # 복귀 종료 판정: |인도 중심 오차| ≤ 이 값.
                                  # ※ 0.25 → 0.35. 복귀는 '원래 자리로 되돌리는' 국면이
                                  #   아니라 '중심 추종에 넘길 수 있을 만큼 돌아오는'
                                  #   국면이다 — 남은 오차는 CRUISE 가 수렴시킨다는 것이
                                  #   원래 설계이고, 엄격하게 걸수록 복귀가 상한으로만
                                  #   끝나 회피 전체가 길어진다(실기 '붕쯔붕쯔가 길다').
                                  # yaw 원방위 대신 쓰는 시각 기준이다. turn의
                                  # exit_center_abs(0.15)보다 느슨하게 둔다 — 회피는
                                  # 원래 경로에서 옆으로 비켜난 상태라 중심 오차가
                                  # 완전히 0으로 돌아오지 않고, 엄격하게 걸면 복귀가
                                  # 타임아웃으로만 끝나 조향이 과도하게 꺾인 채 나온다
    timeout_sec: 10.0             # 회피 **정체** 상한 — 이만큼 **진행 없이** 비껴가고도 못
                                  # 지나갔으면 조향을 펴고 CRUISE 로 돌려보내 지금 장면으로
                                  # 다시 판단하게 한다.
                                  # ※ 6.0 → 10.0 + **기준점 변경** (0806 실기 '6초는 짧다,
                                  #   조건을 더 걸어야 한다'). 두 가지가 같이 바뀌었다:
                                  #     ① 6초는 정상 회피 한 바퀴를 자르고 있었다. 국면이
                                  #        swerve(최소 0.8~) + pass 1.5 + return 이고
                                  #        국면 상한이 3.0씩이라 최악 한 바퀴가 9초다.
                                  #     ② **진입 시각이 아니라 마지막 진행 시각부터 잰다** —
                                  #        여기서 재려던 것은 '얼마나 오래 회피했나'가 아니라
                                  #        '진행 없이 제자리를 맴돌고 있나'다. 국면이 앞으로
                                  #        넘어가면(SWERVE→PASS→RETURN) 그 시각을 찍고 다시
                                  #        센다. 0805 세션 7에서 회피 52회 중 21회가 이 상한에
                                  #        걸려 후진 재정향으로 갔고, 그중 상당수는 실제로
                                  #        국면을 밟아 나가던 중이었다.
                                  #   무한 연장은 아래 hard_timeout_sec 이 막는다.
                                  # ※ 종전에는 여기서 곧바로 재정향
                                  # (후진)이었고, 그것이 0805 실기의 '회피 6초로 줄이고
                                  # 너무 이상해졌다'의 정체다 — 그날 AVOID 20회 중
                                  # 13회가 이 상한에 걸려 후진했고 그중 8회가
                                  # '전 방향 막힘 → 수동 대기'로 미션을 끝냈다.
                                  # 재정향으로 가는 길은 반복 회피 카운터
                                  # (thrash_limit)가 그대로 들고 있다.
                                  # 국면 상한만으로는 이 상태를 못 빠져나온다: 장애물이
                                  # 계속 잡히면 PASS·RETURN 이 첫 틱에 SWERVE 로
                                  # 되돌아가고, 그 재시작은 상태 전이가 아니라 국면
                                  # 변경이라 반복 회피 카운터에도 안 잡힌다 —
                                  # SWERVE(상한) → PASS(1틱) → SWERVE … 가 끝없이 돈다
                                  # (mock obstacle_persists 에서 10초 내내 AVOID 였다).
                                  # 그동안 조향이 꺾인 채 달리므로 인도를 벗어나는 것으로
                                  # 끝난다. 6초 = 국면 2초 × 3 — 정상 회피 한 바퀴는
                                  # 다 돌 수 있고 그 이상은 '못 지나가는 중'이다
    hard_timeout_sec: 20.0        # 회피 **절대** 상한 — 진행이 계속 세어져도 진입 이후
                                  # 이 시간을 넘기면 무조건 나간다. 위 timeout_sec 의
                                  # 기준점이 '마지막 진행'으로 옮겨간 대가로 필요해진 값이다:
                                  # SWERVE(상한) → PASS(1틱) → SWERVE 루프가 국면 전진으로
                                  # 세어지면 정체 상한이 영원히 안 걸린다(_avoid_gave_up
                                  # 주석이 기록한 그 루프다). 20초 = 정체 상한 10초의 2배 —
                                  # '진행하고 있다'가 참인 채로도 이 이상은 한 장애물에
                                  # 쓰지 않는다. 조향이 꺾인 채 20초면 인도를 벗어난다
    phase_timeout_sec: 3.0        # 국면별 진행 상한 — 넘기면 다음 국면으로,
                                  # RETURN에서 넘기면 CRUISE로 나간다. 5.0 → 3.0 → 2.0 → 3.0:
                                  # ※ 2.0 → 3.0 (0806). swerve_min_sec(0.8)·pass_sec(1.5)이
                                  #   생긴 뒤로 2.0은 **정상 국면을 자른다** — 특히 PASS 는
                                  #   1.5초를 다 쓰기도 전에 상한 판정과 겹친다.
                                  #   국면 상한은 '시각 판정을 놓쳤을 때의 안전판'이지
                                  #   기동의 길이를 정하는 값이 아니다.
                                  # 시각 종료 판정이 생겨 정상 국면은 훨씬 짧고,
                                  # 상한이 길면 판정을 놓쳤을 때 조향이 꺾인 채
                                  # 그 시간을 달린다(스로틀 90에서 3초면 0.87m).
                                  # ※ 2.0 은 실기 관찰 '회피가 너무 오래 끈다' 반영이다.
                                  #   상한에 걸리는 것은 **시각 판정을 놓친 경우뿐**이고
                                  #   (장애물이 경로에서 빠지면 그 즉시 다음 국면),
                                  #   유령 장애물이면 빠지지 않아 매번 상한을 다 쓴다.
                                  #   최악 3국면 9초 → 6초, 전형 4초 → 2.5초.
                                  #   실물 회피는 SWERVE 가 대개 1초 내외에 끝나므로
                                  #   이 상한이 실제 기동을 자르지 않는다
  escape:                         # 차도 이탈 선회 — 명세 '차도를 만나면 좌 or 우로
                                  # 방향 전환 후 인도로 주행'의 구현체.
                                  # ※ 종전에는 차도 침범 위험이 곧 ESTOP(수동 해제만)이었다.
                                  #   명세와 정면으로 어긋났고, 0803 실외 '자꾸 정지만 함'의
                                  #   가장 무거운 사례였다 — 인도 옆이 차도인 것은 정상
                                  #   상황인데 판정 오탐 한 번에 미션이 끝났다.
                                  #   ESTOP은 roadway_critical_fraction(코리도 절반 이상이
                                  #   차도) 한 곳에만 남는다.
                                  # 방향은 코스트맵 좌/우 절반 중 열린 쪽 = **인도가 있는
                                  # 쪽**이다 (차도 슬롯은 비용 ∞라 절반 점수에서 진다).
    throttle_pct: 55              # 선회 중 스로틀 — 감속 후 선회. TURN(80)보다 낮다:
                                  # 차도 쪽으로 밀려나는 중일 수 있으므로 이동량을 줄이고
                                  # 조향에 시간을 준다. 단 30%대는 조향이 꺾이면 거의
                                  # 정지라(0803 실측) 그보다는 확실히 위여야 한다
    steer_left_deg: 25.0          # 좌 이탈 조향 크기 — TURN 과 같은 값(실측 최적점).
                                  # 이탈은 **반경이 작을수록 좋다**: 차도에서 빨리 벗어난다
    steer_right_deg: 20.0         # 우 이탈 조향 크기 — TURN 과 같은 값. 실측상 우 20°가
                                  # 반경 0.94m 로 전 조합 중 가장 작다 (좌 25°는 1.51m)
                                  # (우측 절대 130°가 링키지 걸림 경계 — docs/HARDWARE.md §4)
    clear_sec: 0.4                # 차도 위험이 해소된 뒤 이 시간 유지되면 CRUISE 복귀.
                                  # 즉시 복귀하면 코리도 경계에서 위험 판정이 켜졌다
                                  # 꺼지며 ESCAPE↔CRUISE를 왕복한다(조향이 떤다)
    timeout_sec: 4.0              # 이 시간 선회해도 차도가 코리도에서 빠지지 않으면
                                  # 선회로는 못 벗어나는 상황이다 → ESTOP(수동 대기).
                                  # 명세의 '차도 절대 접근 금지'를 지키는 두 번째 안전판
                                  # (첫째는 roadway_critical_fraction 즉시 ESTOP)

  trace:                          # 점자블록 추종 + 상시 탐지 (미션 본체)
                                  # 흐름: 세그가 블록 확정(confirm_sec) → CRUISE가 즉시
                                  # TRACE로 넘김(근접도·정렬 조건 없음 — 보이면 간다) →
                                  # 근접도 비례 혼합으로 블록 쪽으로 가며 하향 탐지
                                  # 카메라의 모델(models/braille_defect.pt, 3클래스)을
                                  # detect_period_sec마다 돌린다 → 파손 후보가 나오면
                                  # INSPECT로 정차 정밀 판정 → 판정 후 TRACE로 복귀
    approach_throttle_pct: 85     # **블록 쪽으로 가는 중**(근접도 < inspect.enter_proximity)
                                  # 의 스로틀. 도착 후 추종(아래 throttle_pct)과 나눈 이유:
                                  # 접근 구간은 조향 목표가 인도 중심에서 블록 중심으로
                                  # 옮겨 가는 중이라 조향 변화가 가장 큰 구간이고, 슬루율
                                  # 제한(steer_rate_deg_per_s) 때문에 조향이 목표를 따라가는
                                  # 데 시간이 걸린다 — 그 사이 속도가 빠르면 블록을 옆으로
                                  # 지나친다. 85% = 0.27 m/s (100%는 0.32 m/s).
                                  # 이 값은 **감속이 아니라 살짝 줄이는 것**이다: 0803의
                                  # '자율주행 속도가 너무 느림'을 되돌리지 않는 선을 지킨다.
                                  # 100으로 두면 종전 동작(접근·추종 같은 속도)
    throttle_pct: 100             # 추종 중 스로틀 — **감속하지 않는다** (= cruise와 같다).
                                  # ※ 35에서 올렸다. 이것이 0803 실외 '자율주행 속도가
                                  #   너무 느림'의 지배적 원인이었다: 한국 인도는 유도선이
                                  #   길게 깔려 있어 순찰 대부분이 TRACE 체류이고,
                                  #   35% = 0.112 m/s면 20m 구역에 3분이 걸린다.
                                  #   감속의 근거는 둘이었고 둘 다 성립하지 않는다:
                                  #     · 모션 블러 — 구동계 최고 0.32 m/s에서 노출
                                  #       1/60초면 이동량 5mm다. 30cm 타일 판정에 무해하다.
                                  #       (정밀 판정용 정지 화면은 INSPECT가 따로 잡는다)
                                  #     · 추론 주기 확보 — 0.32 m/s × 0.4초 = 0.128m이므로
                                  #       타일(0.30m) 하나당 추론이 2회 이상 돈다.
                                  #   명세가 '주행하며 탐지'인 것과도 이쪽이 맞는다.
                                  #   내려야 할 근거가 생기면 inspect.cooldown_sec을
                                  #   **함께** 재계산할 것 — 그 값은 타일 통과 시간이다
    detect_period_sec: 0.2        # 탐지 추론 주기(초). FSM이 아니라 main 루프가 쓴다.
                                  # ※ 0.4 → 0.2. 종전 값은 '검사 추론이 수백 ms'라는
                                  #   가정 위에 있었는데 **실측은 55ms**다
                                  #   (2026-08-05 이 보드, braille_defect.pt imgsz 960
                                  #    중앙값 55ms / 세그 segv2.pt imgsz 640 41ms).
                                  #   그 가정으로 검사 기회를 4배 아껴 두고 있었다:
                                  #     타일 0.30m ÷ 추종 0.32m/s = 타일당 0.94초
                                  #     0.4초 주기 → 타일당 검사 2.3회
                                  #     0.2초 주기 → 타일당 검사 4.7회
                                  #   파손은 프레임마다 잡히고 놓치기를 반복하므로
                                  #   (세그 재현율과 같은 성질) 기회 수가 곧 검출률이다.
                                  # 대가는 루프 실효 주기다: 검사가 도는 틱만 +55ms 이고
                                  # 평균 46×(1+55/200) ≈ 59ms → 약 17Hz (종전 19Hz).
                                  # 조향 슬루율·디바운스가 전부 시간 기준이라 무해하다.
                                  # 0으로 두지 말 것 — 매 틱 추론은 제어 루프를 반으로
                                  # 접는다. 더 줄이려면 추론을 워커 스레드로 빼거나
                                  # (scripts/web_test.py 의 InspectWorker 가 그 구조다)
                                  # TensorRT 엔진으로 바꾼다 (tools/braille_detect/README.md)
    timeout_sec: 120.0            # 한 번의 추종 세션 상한. 유도선은 끝없이 이어질 수
                                  # 있어 상한이 없으면 순찰이 저속 추종에 갇힌다.
                                  # 세션 시작 시각은 INSPECT를 다녀와도 리셋되지 않는다
                                  # (정차마다 리셋되면 파손이 잦은 구간에서 상한이 사실상
                                  #  사라진다 — context.trace_started_at).
                                  # 초과 시 CRUISE 복귀 + inspect.cooldown_sec 동안
                                  # 재추종 금지 — **추종을 막는 유일한 경우다**
                                  # ※ 추종 스로틀이 100%(0.32 m/s)가 된 뒤로는 상한이
                                  #   사실상 걸리지 않는다: 120초 = 38m이고, 정차
                                  #   (settle 0.7초 + 추론)를 빼도 30m 넘는 구역을
                                  #   한 세션에 커버한다. 한 구역에 선형+점형 20개
                                  #   (타일 6m 상당)가 보통이라는 현장 관찰(0803) 대비
                                  #   6배 여유다. 그래도 상한을 남겨 두는 이유는 하나:
                                  #   블록 오탐이 상시 켜진 채로 굳으면(젖은 노면 반사
                                  #   등) 순찰이 영구히 TRACE에 갇히기 때문이다 —
                                  #   이 값은 속도 예산이 아니라 그 고착의 상한이다
  inspect:                        # 파손 후보 정밀 판정 (TRACE→INSPECT 게이트)
    confirm_sec: 0.2              # 블록 **발견** 확정 디바운스. 이 시간만큼 유지돼야
                                  # 확정된다. braille_min_fraction이 화면의
                                  # 0.5%라 원거리 검출이 깜빡이고, 그대로 쓰면 추종
                                  # 목표가 매 틱 인도 중심↔블록 중심을 오간다.
                                  # ※ **turn.confirm_sec보다 작아야 한다.** 크면 유도선이
                                  #   꺾이는 코너에서 블록 확정보다 회전 확정이 먼저 나서
                                  #   TRACE 대신 TURN(80% + 깊은 조향)으로 코너를 돈다 —
                                  #   블록을 따라 서서히 가야 하는 바로 그 구간이다.
                                  #   0.4였고 turn(0.35)보다 커서 실제로 그렇게 됐다.
                                  #   순서 제약은 tests/test_costmap.py가 고정한다
                                  # ※ 이 디바운스가 **TRACE 진입의 유일한 인지 조건**이다
                                  #   (근접도 하한·정렬 조건은 없앴다 — 블록이 확정되면
                                  #    멀든 치우쳐 있든 최우선으로 간다.
                                  #    근거: state_machine._handle_cruise 게이트 주석)
    release_sec: 1.5              # 블록 **소실** 확정 디바운스 — 발견(0.2)보다 훨씬 길다.
                                  # 세그의 점자블록 재현율이 낮다는 실측이 근거다
                                  # (perception.segmentation.class_conf 주석): 같은 장면이
                                  # 5초 사이에 0.374 → 0.000 으로 사라진다. 같은 창을
                                  # 쓰면 블록 위를 달리는 동안에도 추종이 끊겼다 붙고,
                                  # 그때마다 TRACE→CRUISE 전이가 나며 **검사 추론이
                                  # 멈춘다**(미션 본체가 꺼진다). 놓친 것과 없어진 것은
                                  # 다르고 이 창이 그 차이를 흡수한다.
                                  # 길게 두는 대가는 작다: 블록이 안 보이는 틱은 근접도가
                                  # 0이라 추종 혼합 가중치도 0이 되어 조향은 그대로 인도
                                  # 중심을 따른다(state_machine._debounce_braille).
                                  # 1.5초 = 추종 100%(0.32 m/s)에서 48cm — 타일 1.6개분
    enter_proximity: 0.55         # **블록 추종 비중이 1이 되는 근접도** (0~1 proxy).
                                  # 근접도 0에서 0으로 시작해 여기서 1이 된다 — 원거리
                                  # 블록에도 약한 유인이 붙어야 '그쪽으로 이동'이 시작된다.
                                  # 스로틀도 같은 곡선을 탄다: 여기서 trace.throttle_pct,
                                  # 근접도 0에서 cruise.throttle_pct
                                  # (state_machine._approach_weight / _trace_throttle_pct)
    settle_sec: 0.7               # 진입 후 정차 안정 대기 — 정지 '명령'과 물리적 정차
                                  # 사이 감속 시간. 굴러가며 캡처하면 모션 블러로
                                  # defect_partial(≈55px)부터 무너진다. 보드 실측 재보정
    timeout_sec: 8.0              # 판정 통지 유실 시 이 시간 뒤 강제 재개 (무한 정지 방지)
    cooldown_sec: 2.0             # 두 타이머가 공유하는 **재시도 금지 간격**. 둘 다
                                  # 고착 방지 장치이고, 어느 쪽도 '블록을 최우선으로
                                  # 따라간다'를 막지 않는다:
                                  #  ① INSPECT 종료 후 **재정차** 금지. 판정을 마치고
                                  #     추종으로 돌아가면 로봇은 아직 같은 파손 위에
                                  #     있어 다음 탐지 주기에 같은 후보가 또 나온다 —
                                  #     이게 없으면 그 자리에서 정차가 무한 반복된다.
                                  #     이 창 안에서도 추종·탐지는 계속 돌고 정차만
                                  #     미뤄진다. (state_machine._inspect_cooldown_over)
                                  #  ② 추종 **타임아웃** 후 재추종 금지. 유도선은 끝없이
                                  #     이어질 수 있어 trace.timeout_sec을 두는데, 이 창이
                                  #     없으면 나온 그 틱에 같은 선을 다시 물어 상한이
                                  #     아무 일도 하지 않는다.
                                  #     (state_machine._trace_cooldown_over)
                                  # 블록 소실로 추종이 끝난 경우에는 **어느 창도 걸지
                                  # 않는다** — 다시 보이면 다시 가야 한다.
                                  # ※ 20.0 → 5.0 → 2.0으로 내려 왔다. ①의 목적이 '그
                                  #   파손을 지나갈 시간'이므로 필요한 값은 **타일 1개
                                  #   통과 시간**이고, 실측 속도(0.0032 m/s per 1%스로틀
                                  #   — docs/HARDWARE.md §4)를 넣으면 계산된다:
                                  #     추종 100% = 0.32 m/s, 점자블록 타일 0.30m
                                  #     → 타일 1개 = 0.94초
                                  #   2.0 = 타일 2.1개분이다. **0.94초 미만으로 내리지
                                  #   말 것** — 타일 통과 시간보다 짧으면 같은 타일에서
                                  #   재정차한다(①이 막으려던 바로 그 고착).
                                  #   추종 스로틀 35→100 인상에 맞춰 5.0에서 내렸다:
                                  #   같은 5.0초는 이제 1.6m = 타일 5.3개분이라 파손이
                                  #   밀집한 구간에서 대부분을 놓친다.
                                  #   ※ 이 값은 trace.throttle_pct에 **반비례**한다 —
                                  #     추종 속도를 바꾸면 여기도 함께 재계산할 것.
                                  #   거리 기준으로 바꾸면 이 연동이 사라진다 —
                                  #   오도메트리가 필요하다 (docs/ALGORITHMS.md N1).
  slope:                          # IMU 게이트 — IMU reading 없으면 전이 자체가 비활성.
                                  # pitch 부호는 hardware.imu 실측 규약: +오르막(기수 들림)
    enter_pitch_deg: 5.0          # |pitch|가 이 값 이상이면 SLOPE 진입
    exit_pitch_deg: 3.0           # |pitch|가 이 값 미만이면 CRUISE 복귀
    # 스로틀 프로파일 — SLOPE는 정지 상태가 아니라 '경사 보정 주행'이다: 인도 중심
    # 추종(조향)은 CRUISE와 동일하게 유지하고 스로틀만 pitch에 비례해 보정한다.
    # ※ 이득·상한 전부 초기 추정값 — 실경사 주행으로 재보정할 것 (구동계 최고
    #   ~0.32m/s의 저속 봇이라 이득이 커도 위험은 낮지만, 등판 실패/과속이 기준)
    uphill_throttle_gain_pct_per_deg: 2.5   # 오르막: cruise 스로틀 + 이득×pitch(°)
    uphill_throttle_max_pct: 100  # 오르막 스로틀 상한. cruise가 100이 된 뒤로는 이득이
                                  # 실효가 없다(항상 상한) — 등판에 여유분을 남길 수 있는
                                  # 구동계가 아니므로 상한도 100으로 맞춘다
    downhill_throttle_gain_pct_per_deg: 5.0 # 내리막: cruise 스로틀 − 이득×|pitch|(°).
                                  # cruise 60→100에 맞춰 3.0에서 올렸다 — 3.0이면
                                  # 브레이크 임계(12°)에서도 100−36=64%로 여전히 빠르다.
                                  # 5.0이면 12°에서 40%까지 떨어진다
    downhill_throttle_min_pct: 15 # 내리막 스로틀 하한. joystick.throttle_min_pct(12)
                                  # 실측보다 위에 둔다 — 그 아래는 모터가 소리만 나는
                                  # 사실상 무동력이고, 내리막 무동력은 가속 활강이다.
                                  # 저듀티 전진 PWM의 오프 구간이 모터 브레이크로 작동하는
                                  # 것이 이 하한의 근거다(멈춰 있어도 밀림 저항이 된다)
    # ===== 내리막 위치 고수 (0806 실기 지시) =====
    # "내리막길에서는 적절한 역주행을 통해 현재 위치를 고수할 줄 알아야 보도블록 탐지에
    #  도움이 될 듯 하다."
    # 종전에 이 로봇이 낼 수 있는 정지 명령은 둘뿐이었다: 무동력(stop)과 숏브레이크(brake).
    # 내리막에서 무동력은 활강이고, 숏브레이크도 완전한 제동이 아니다 — 특히 INSPECT
    # (파손 정밀 판정 정차)가 **무동력 정지**였다: 판정용 정지 화면을 찍는 그 0.7초 동안
    # 로봇이 굴러가면 모션 블러로 defect_partial(≈55px)부터 무너진다. 정차해서 얻으려던
    # 것을 정차가 못 지키고 있었다.
    # 그래서 세 번째 정지 명령을 만든다: **경사에 비례한 약한 역스로틀**. 저듀티 역전
    # PWM은 오프 구간이 모터 브레이크라(downhill_throttle_min_pct 주석과 같은 원리)
    # 숏브레이크보다 강한 제동이면서, 온 구간이 중력 성분을 밀어 올린다.
    downhill_hold_pitch_deg: 3.0  # 정지 명령이 **역스로틀 유지**로 바뀌는 내리막 임계.
                                  # SLOPE 해제 임계(exit_pitch_deg 3.0)와 같은 값이다 —
                                  # '경사로 볼 수 있는 최소'의 정의를 두 곳에서 가르지 않는다.
                                  # 이 아래(평지)에서는 종전대로 숏브레이크다
    downhill_hold_gain_pct_per_deg: 3.0  # 유지 역스로틀 = 이득 × |pitch|(°).
                                  # 초기 추정값이다 — 근거는 주행 스로틀 실측(0.0032 m/s
                                  # per 1%)이 아니라 대칭성이다: 같은 경사에서 주행 감속에
                                  # 쓰는 이득(downhill_throttle_gain 5.0)보다 작게 둬서,
                                  # **로봇을 뒤로 밀어내지 않는 쪽으로 틀린다**.
                                  # 실경사에서 정차시키고 굴러가는지·뒤로 가는지 보고 재보정할 것
    downhill_hold_max_pct: 35     # 유지 역스로틀 상한(크기). 12°(하강 안전 정지 임계)에서
                                  # 이득 3.0이면 36 이므로 사실상 그 지점에서 물린다.
                                  # 상한을 두는 이유는 개루프 제어라서다 — 노면이 미끄럽거나
                                  # 경사 판정이 틀리면 이 값만큼 **후진한다**. 35% = 0.11 m/s
    downhill_brake_pitch_deg: 12.0  # 이보다 급한 내리막(pitch ≤ −이 값)은 감속 주행
                                  # 대신 숏브레이크 정지 유지 — 명세의 '하강 안전 정지'.
                                  # 수동(조이스틱/ESTOP) 개입 전까지 그 자리에 선다
    downhill_brake_timeout_sec: 5.0  # 그 정지가 이만큼 이어지면 ESTOP 으로 승격한다.
                                  # 경사는 로봇이 서 있는 한 그대로라 **스스로 푸는
                                  # 출구가 없는 정지**인데, 종전에는 SLOPE 에 머문 채
                                  # 무한 브레이크였고 서버 투영은 내내 PATROLLING
                                  # (순찰 중)이었다 — 아무도 그 정지를 모른다.
                                  # ESTOP 이면 SAFE_STOP 으로 보고되고 사람이 온다
    downhill_avoid_brake_pitch_deg: 10.0
                                  # **이보다 급한 내리막에서만** 장애물에 정지 대기한다.
                                  # 그 아래와 **오르막 전체**는 평지처럼 좌/우로 회피한다.
                                  # 종전에는 경사 진입 임계(5°) 하나로 갈라 경사 위의
                                  # 모든 장애물이 무기한 정지였다 — AVOID(avoid_brake)는
                                  # 선회로도 재정향으로도 나가지 못하고 장애물이 스스로
                                  # 사라질 때까지 브레이크만 잡는다. 인지 오탐 하나가
                                  # 곧 '경사에서 안 움직이는 로봇'이 됐다. 그래서 임계를
                                  # 두어 완만한 경사를 풀었다.
                                  # ※ 0806 2차: **오르막을 통째로 뺐다** (`abs(pitch)` →
                                  #   `pitch <= -값`). 브레이크 대기의 근거 두 가지가
                                  #   오르막에서는 성립하지 않거나 반대로 작용한다:
                                  #     · 밀림 — 오르막에서 뒤로 밀리는 것을 막는 방법은
                                  #       브레이크가 아니라 **계속 굴러가는 것**이다.
                                  #       한 번 서면 정지마찰을 다시 이겨야 하고, 이
                                  #       구동계는 등판 여유가 없다(오르막 이득이 상한
                                  #       100에 물려 사실상 무효인 것이 그 증거다).
                                  #     · 등판 토크 — 서 있는 동안 토크는 0이다. 아끼는
                                  #       것이 아니라 버리는 것이다.
                                  #   즉 오르막에서 장애물에 서는 것은 '안전하게 기다림'이
                                  #   아니라 '못 올라가게 됨'이다. 내리막에서는 반대로
                                  #   밀림이 실재하므로 그대로 둔다.
                                  # 10°는 내리막 안전 정지(12°) 바로 아래다 — 실경사
                                  # 주행으로 재보정할 것
  turn:                           # 좌/우회전 — yaw가 있으면 회전 진행을 실측하고,
                                  # 없으면 시간으로 대체한다(min_progress_sec).
                                  # ※ 종전에는 IMU 게이트 뒤여서 IMU 배선이 해제된 상태
                                  #   (hardware.imu 주석)에서는 **회전이 아예 일어나지
                                  #   않았다** — 90° 코너에서 CRUISE 상한(좌 15/우 12)으로
                                  #   버티다 인도가 화면을 벗어나 경계 소실 IDLE로 끝났고,
                                  #   그것이 0803 실외에서 관찰된 '자꾸 정지만 함'의
                                  #   또 다른 경로였다. 회전 종료의 본 판정은 원래
                                  #   **시각 재정렬**이고 yaw는 교차 검증이었으므로,
                                  #   yaw가 없으면 교차 검증만 시간으로 바꾼다.
                                  # 진입: CRUISE 조향 수요(클램프 전)가 cruise 상한을
                                  # 넘어 포화된 채 confirm_sec 지속 = 인도가 실제로
                                  # 꺾였다는 판단. 회전 중에는 감속 + 깊은 조향 고정,
                                  # 종료는 시각 재정렬을 yaw 진행량이 교차 검증한다
    enter_steer_demand_deg: 20.0  # 진입 판정 조향 수요 임계(**목표 오차**×이득, 클램프
                                  # 전, 절대값). cruise 상한(좌 22/우 18)에 걸려 추종이
                                  # 포화되는 지점 근처여야 '상한으로 부족한 굽이'가 잡힌다.
                                  # 수요 최대는 steer_gain_deg(30) = 목표 오차 ±1.
                                  # ※ 18.0 → 13.0 → 20.0. 18은 목표 오차 0.9 이상을
                                  #   요구하는데 그건 인도 중심이 화면 좌우 끝 10% 안에
                                  #   들어온 상태고, 그 전에 sidewalk_min_fraction이 먼저
                                  #   깨져 경계 소실 IDLE로 떨어졌다 — 실차에서 도달
                                  #   불가능한 임계였다. 13.0은 이득 20 기준 목표 오차
                                  #   0.65였고, 이득이 30이 된 지금 **같은 오차 0.65**는
                                  #   19.5다 — 판정 자체는 바꾸지 않고 단위만 맞춘 것이다
    confirm_sec: 0.35             # 포화 지속 확정 시간 — 세그 노이즈 한두 프레임의
                                  # 목표 튐이 회전으로 승격되는 것을 막는 디바운스.
                                  # cruise 60→100에 맞춰 0.6에서 내렸다(0.6초면 100%
                                  # 스로틀에서 코너 진입점을 지나친다)
    throttle_pct: 80              # 회전 중 스로틀 — 감속 후 회전(명세). cruise(100)보다
                                  # 낮게, 단 **조향 25°가 꺾인 상태에서 실제로 굴러가는
                                  # 값**이어야 한다: 35였는데 avoid의 0803 야외 실측이
                                  # '30%는 조향 꺾이면 링키지·타이어 저항을 못 이겨 거의
                                  # 정지'였다 — 회전이 성립하지 않는 값이었다.
                                  # 종료 판정이 yaw 진행 + 시각 재정렬이라 속도를 올려도
                                  # 재보정할 시간 기준 파라미터가 없다(timeout만 상한)
    # ===== 기동 조향각의 단일 출처 — TURN · AVOID 선회 · (같은 값으로) ESCAPE·DEAD_END =====
    # ※ 2026-08-06: 25/20 → 30/25 로 올렸다가 실측 재분석 뒤 **25 / 20** 으로 확정했다.
    #   이 둘은 **0805 실기에서 실제로 측정된 최적점 그 자체**다 (cruise 상한 주석의 표):
    #       좌 25° → 10.9 dps (49.9초 표본)   좌 40° → 4.2 dps
    #       우 20° → 17.6 dps ( 7.7초 표본)   우 28° → 17.5 dps
    #   **양쪽 다 더 깊게 주면 더 느려지거나 그대로다.** 좌는 25 위에서 급격히 무너지고
    #   (40°는 절반 이하), 우는 20 위에서 이득이 없다. 깊은 조향의 대가는 앞바퀴
    #   스크럽 저항이고 이 구동계는 그것을 못 이긴다.
    #   회전반경으로 보면 더 분명하다 (같은 90% 스로틀, 0.288 m/s):
    #       우 20° → 0.94 m      좌 25° → 1.51 m
    #   즉 **우측이 60% 빠르고 반경도 38% 작다.** 좌우 값이 다른 것은 하드웨어 비대칭
    #   때문이고, 여기서는 '좌측이 약하니 좌를 더 깊게'가 된다 — 그래도 우측을 못 따라간다.
    #   ⚠️ 좌 0~25 와 우 0~20 은 **미측정 구간**이다. 이보다 얕은 쪽이 더 나을 가능성이
    #     남아 있으므로(기구학상 얕을수록 반경은 커지지만 스크럽은 준다) 다음 실기에서
    #     좌 18~22 / 우 14~18 을 직접 잴 것.
    #   ※ AVOID 의 회피 선회도 이 값을 쓴다 (_bypass_command → _turn_steer_deg) —
    #     그래서 이 값을 만지면 회피 선회 반경이 같이 바뀐다.
    steer_left_deg: 25.0          # 좌회전 조향 오프셋 크기 — 실측 최적점. 하드 한계 45 안
    steer_right_deg: 20.0         # 우회전 조향 오프셋 크기 — 실측 최적점(전 구간 최고 dps).
                                  # 지속 조향 권장 상한 25 아래라 링키지 여유가 5° 남는다
                                  # (절대 130°=링키지 걸림 경계 — docs/HARDWARE.md §4)
    min_progress_yaw_deg: 20.0    # 회전 완료 판정에 요구하는 최소 yaw 진행량(진입 대비,
                                  # 회전 방향 부호). 진입 직후 세그 노이즈가 '재정렬'로
                                  # 보여도 실제로 이만큼 돌기 전에는 완료로 치지 않는다
    min_progress_sec: 1.5         # IMU가 없을 때 위 yaw 조건을 대신하는 최소 회전 시간.
                                  # ※ 0.7 → 1.5 (0806 2차). 종전 값은 '0.7초면 20°대를
                                  #   돈다'는 **추정**에 기대고 있었는데, 0805 실측 회전율을
                                  #   넣으면 그 절반도 안 된다 (스로틀 80% 환산):
                                  #       좌 25° → 9.7 dps  → 0.7초에 6.8°
                                  #       우 20° → 15.6 dps → 0.7초에 11°
                                  #   min_progress_yaw_deg(20°)와 같은 크기가 되려면
                                  #   좌 2.1초 / 우 1.3초가 필요하다. 1.5초는 그 사이다.
                                  #   **IMU 배선이 해제된 지금은 이쪽이 실제로 쓰이는
                                  #   판정이다** — 코너를 덜 돌고 나오던 원인이 여기 있었다.
                                  #   timeout_sec(6.0) 안이라 고착 위험은 없다.
                                  # 실주행에서 코너를 덜 돌고 나오면 올리고, 지나치면 내린다
    max_yaw_deg: 120.0            # |yaw 변화|가 이 값 이상이면 강제 종료 → CRUISE.
                                  # 90° 코너 + 여유. 시각 재정렬이 계속 안 잡혀도
                                  # 제자리 선회를 무한정 계속하지 않는 안전 상한
    exit_center_abs: 0.15         # 회전 완료 판정: |인도 중심 오차| ≤ 이 값 (재정렬)
    timeout_sec: 6.0              # 어떤 조건도 안 잡히면 이 시간 뒤 CRUISE 복귀
                                  # (INSPECT timeout_sec와 같은 무한 고착 방지 안전판)
  dead_end:                       # 막다른 길 **재정향** — 진입은 AVOID 재확인 후에도
                                  # 좌/우 모두 경로 없음이 유지될 때. IMU 불필요.
                                  # 기동: 짧은 후진(공간 확보) → 유리한 쪽으로 깊은 조향
                                  # 선회 전진, 반복. **완료는 시각**(갈 수 있는 경로가
                                  # 다시 생겼는가)이고 yaw는 상한 판정에만 쓴다.
                                  # 방향은 진입 시 코스트맵 반쪽 점수로 한 번 고르고
                                  # 유지한다 — 막다른 길에서는 매 틱 재선택이 좌우
                                  # 진동만 낳는다.
                                  # ※ 0804 개편. 종전은 좌회전 고정 180° K턴이었고
                                  #   완료 판정이 yaw 단독이라 부호 오류에 통째로 무너졌다.
    max_yaw_deg: 300.0            # |회전| 상한 — 넘으면 갇힌 것으로 보고 IDLE.
                                  # **완료 기준이 아니다.** 완료는 시각(새 경로 확보)이고
                                  # 이 값은 제자리 무한 회전만 막는다. 180°보다 넉넉히
                                  # 크게 둔다 — 좁은 곳에서는 한 바퀴 가까이 돌아야
                                  # 열리는 경우가 있고, 각도로 성공을 정의하지 않기 때문에
                                  # 크게 잡아도 손해가 없다.
                                  # ※ 종전 target_yaw_deg(180)+yaw_tolerance_deg(15)를
                                  #   대체한다. 그 둘은 완료 기준이었고, yaw_sign 부호가
                                  #   틀리자 도달 불가가 되어 매번 timeout 을 채웠다(0804).
    attempt_window_sec: 8.0       # **탈출한 뒤 이 시간을 못 달리고** 다시 막히면 같은
                                  # 자리로 보고 시도 번호를 이어서 센다. 넘겨 달렸으면
                                  # 실제로 벗어난 것이니 1부터 다시 센다.
                                  # ※ 진입 시각 기준 20초였을 때는 사다리 한 번이 17.8초라
                                  #   다음 진입이 늘 창 안이었고, 카운터가 7→10→13→17로
                                  #   올라 **모든 탈출이 U턴**이 됐다. 좌/우 시도를
                                  #   건너뛰는 것은 낭비이고 야외에서는 위험하다.
    uturn_after_cycles: 3         # 이 번째 시도에서 U턴. 시도마다 **방향을 바꾼다**:
                                  #   1회 유리한 쪽 → (되짚기 후진) → 2회 반대쪽 → 3회 U턴.
                                  # 한 방향으로만 반복하면 그쪽이 막힌 자리에서는 몇 번을
                                  # 해도 같은 결과다 (0804 실기 지적).
                                  # ※ 3 → 5 → 3. 0806 실기 지시가 이 순서를 그대로 규정한다:
                                  #   "첫 조향에 실패하면 정렬하지 않고 그대로 후진해서 원점에
                                  #    오고, 첫 방향의 반대방향으로 쭉 조향해서 가야 한다.
                                  #    이 경우에도 실패했을 때 U턴."
                                  #   5로 올렸던 근거('시도 하나가 후진 0.9 + 호 1.1초 ≈ 35cm
                                  #   뿐이라 두 번으로는 막다른 길 판정이 성급하다')는 두 변경으로
                                  #   사라졌다: 호가 2.0초(27~39°)가 됐고, 실패한 호를 **되짚어
                                  #   원점으로 돌아간 뒤** 반대로 꺾으므로 좌/우 한 번씩이
                                  #   실제로 좌우를 다 시험한다. 종전에는 조향 0 직진 후진이라
                                  #   두 시도가 서로 다른 자리에서 출발했다.
                                  #   U턴이 더 이상 미션의 끝이 아닌 것도 근거다 — 아래
                                  #   uturn_escape_limit 참조(정지 대신 U턴으로 계속 간다)
    uturn_target_yaw_deg: 180.0   # U턴 종료 yaw 누적각. **U턴에서만** 완료 기준이 각도다
                                  # — 방향을 되돌리는 것이 목적이라 '경로가 보인다'로는
                                  #   끝낼 수 없다(그 판정으로 이미 여러 번 실패한 자리다).
                                  #   yaw_sign 정정 뒤에야 성립하는 판정이다.
    uturn_tolerance_deg: 15.0     # 완료 여유 — 남은 각도는 CRUISE 중심 추종이 수렴시킨다
    straighten_deg: 5.0           # 탈출 직후 조향이 이 이내로 돌아오면 정렬 완료로 보고
                                  # 추종을 시작한다. **정지한 채로** 정렬한다.
                                  # ※ 0804 실측: 조향 슬루율 제한 때문에 -40°에서 중앙까지
                                  #   0.5~0.6초가 걸리는데, 그동안 CRUISE가 스로틀 100%로
                                  #   전진해 19cm를 30° 꺾인 채 주행했다 — 방금 피한 쪽으로
                                  #   호를 그리며 다시 들어가 '재정향 완료 → 0.3초 뒤 다시
                                  #   AVOID'가 됐다. CRUISE 조향 상한이 좌15/우12인데
                                  #   실측 범위가 -33.3~+20.1이었던 것이 그 흔적이다.
    straighten_max_sec: 1.5       # 정렬 상한 — 서보가 안 따라와도 영원히 서 있지 않는다
    uturn_min_yaw_deg: 45.0       # U턴 중 '경로 확보'로 빠져나가려면 최소 이만큼은 돌아야
                                  # 한다. ※ 0804 실기: 이게 없어서 U턴이 **한 틱(0.1초)**
                                  #   만에 회전 0°로 이탈했다. 후진은 '경로 인지'가 참이
                                  #   되어야 끝나는데 그 상태를 그대로 U턴에 넘기므로,
                                  #   받는 쪽의 이탈 조건이 진입 시점에 이미 충족돼 있었다.
                                  #   기동은 제 몫을 하고 나서 판정받아야 한다.
    uturn_min_sec: 2.0            # 위의 시간판 — IMU가 없어 각도를 못 잴 때 쓴다
    uturn_direction: right        # U턴 회전 방향 **고정** (left / right). 탈출 시도처럼
                                  # 좌우를 교대하지 않는다 — 회차는 한 방향으로 끝까지
                                  # 도는 기동이라 중간에 바뀌면 이미 번 각도가 상쇄된다.
                                  # ※ left → **right** (0806 2차). 종전 근거는 '좌 조향
                                  #   여유(45°)가 우(30°)보다 커서 회전반경이 작다'였는데,
                                  #   실측이 정반대다: 같은 90% 스로틀에서
                                  #     우 20° → 17.6 dps, 반경 0.94 m
                                  #     좌 25° → 10.9 dps, 반경 1.51 m
                                  #   U턴은 전 상태 중 반경이 가장 중요한 기동이고(인도 폭
                                  #   안에서 180°를 돌아야 한다), 우측이 38% 작다.
                                  #   회전량도 60% 빠르니 U턴 시간 자체가 줄어든다.
    uturn_sec: 8.0                # IMU가 없을 때 U턴을 시간으로 대신하는 길이. 정확하지
                                  # 않지만 '아무것도 못 함'보다 낫다(AVOID·TURN이 같은
                                  # 이유로 시간 폴백을 쓴다). 실측 후 재보정.
    # ===== '정지 + 수동 대기' 대신 U턴 (0806 실기 지시) =====
    # "완전 정지 해야하는 경우에는 그냥 u턴으로 180도 돌려버리고 계속 진행해야한다."
    # 종전에 미션을 끝내던 세 자리 — 후진 복구 상한(전 방향 막힘) · 재정향 상한(회전/시간) ·
    # 경계 소실 유예 만료 — 가 전부 IDLE(수동 개입만이 출구) 이었다. 0805 세션 7에서
    # 미션 종료 33회 중 11회가 첫 번째 사유 하나였다. 이제 셋 다 U턴으로 승격한다.
    # **ESTOP 계열은 대상이 아니다** (수동 정지 · 코리도가 차도로 덮임 · 급경사 하강 정지
    # 지속) — 그건 고착이 아니라 안전 판단이라 방향을 되돌린다고 풀리지 않는다.
    uturn_escape_limit: 3         # 창 안에서 이 횟수만큼 U턴으로 탈출을 시도하고도 다시
                                  # 같은 자리로 오면 그때는 IDLE(수동 대기). 무한 배회를
                                  # 막는 유일한 장치다 — 없으면 로봇이 영영 사람을 안 부른다
    uturn_escape_window_sec: 60.0 # 연속 판정 창. 이 시간을 **정상 주행으로** 넘겼으면
                                  # 실제로 그 자리를 벗어난 것이니 카운터를 1부터 다시 센다.
                                  # 재정향 시도 창(attempt_window_sec 8초)보다 훨씬 길게
                                  # 둔다: U턴은 그 위 층위의 마지막 수단이라, 한 번 돌고
                                  # 몇 초 달리다 막힌 것을 '벗어났다'로 세면 안 된다
    # ※ 40 / 28 → 30 / 25. **깊을수록 잘 돈다는 전제가 실측으로 뒤집혔다.**
    #   이것은 0806 재분석에서도 살아남은 몇 안 되는 실측 결론이다 (정상상태 구간 기준,
    #   0805 세션 7+8):
    #       좌 40° → 4.2 dps (4.9초)   vs   좌 25° → 10.9 dps (49.9초)
    #   같은 노면에서 절반도 못 돈다. 조향을 깊게 줄수록 앞바퀴 스크럽이 커지는데 이
    #   구동계는 그 저항을 못 이겨서, 40°는 '반경이 작은 선회'가 아니라 **거의 정지**였다.
    #   실제 결과: 재정향 27회의 회전량 중앙값이 한 자릿수(°)였고, 그래서 시도가 전부
    #   실패로 세어져 U턴까지 갔다. 실기 지적 '조향 후 이동이 찔끔' · '툭하면 U턴'이
    #   전부 이 한 값에서 나왔다.
    #   ※ 30 → 25 (0806 2차). 좌 25 가 **실측된 최적점**이고 그 위는 전부 나빠진다.
    #     재정향은 호 하나가 벌어들이는 회전량이 곧 시도의 성패이므로, 여기서 '더 깊게'는
    #     정확히 반대 방향의 튜닝이었다: 좌 30 은 좌 25 보다 적게 돈다.
    steer_left_deg: 25.0          # 선회 전진 좌조향 크기 — 실측 최적점 (turn 과 같은 값)
    steer_right_deg: 20.0         # 우조향 크기 — 실측 최적점. 반경 0.94m 로 좌 25°(1.51m)
                                  # 보다 작다 — **회차·재정향은 우측이 유리하다**
    throttle_pct: 100             # 전진 호·후진 공통 스로틀 크기 (후진은 −로 나간다).
                                  # ※ 30에서 올렸다. 30은 avoid의 0803 야외 실측으로
                                  #   '조향 꺾인 상태에서 거의 정지'인 값이고, 당시 여기
                                  #   조향은 전 상태 중 가장 깊은 40°였다 — 즉 종전 설정의 K턴은
                                  #   yaw를 전혀 벌지 못하고 timeout_sec(30초) 뒤 IDLE로
                                  #   끝나는 동작이었다. 회차는 전 상태 중 최대 토크가
                                  #   필요한 기동이라 최대 출력을 준다
    forward_sec: 2.0              # 전진 호 1회 시간 — 호의 길이는 시간×속도다.
                                  # ※ 1.5 → 1.1 → 1.5 → 2.0. 조향각을 실측 대역으로 고친 뒤의
                                  #   재계산이다: 30°의 실측 회전이 13~19 dps 이므로
                                  #   2.0초 호 하나가 27~39°를 번다(1.5초면 20~29°).
                                  #   0806 실기 지적 '충분히 진행하면 피할 각인데 찔끔거리다
                                  #   오히려 걸린다'가 이 값이다 — 시도 하나가 제 몫을 하려면
                                  #   호 하나로 '꺾어서 지나갈 각'이 나와야 하고, 20°대는
                                  #   그 문턱 아래였다. 90° 코너도 3호면 돈다.
                                  #   호 하나의 이동은 약 0.64m(0.32m/s)이고 그중 상당
                                  #   부분이 횡방향이라 인도 폭 안에서 끝난다
    retrace_sec: 2.0              # **되짚기 후진** 시간 — 실패한 전진 호를 **같은 조향각으로**
                                  # 되감는 국면(RETRACE)의 길이. forward_sec 과 같은 값이어야
                                  # 원점으로 돌아온다(같은 조향각·같은 스로틀·같은 시간이면
                                  # 회전중심이 같아 그 호를 그대로 되짚는다 — 차량 기구학).
                                  # ※ 0806 실기 지적: "첫 조향에 실패하면 정렬하지 않고 그대로
                                  #   후진해서 원점에 오고, 첫 방향의 반대방향으로 쭉 조향해서
                                  #   가야 한다." 종전에는 실패한 호 뒤에 **조향 0 직진 후진**
                                  #   (REVERSE)을 했다 — 호로 나간 만큼 횡방향으로 어긋난
                                  #   자리에서 뒤로만 빠지므로, 반대쪽 시도가 원점이 아니라
                                  #   엉뚱한 자리에서 시작했다. 그래서 좌·우를 다 해 봐도
                                  #   같은 벽을 다른 각도로 만나기만 했다.
                                  # forward_sec 을 바꾸면 **여기도 같이 바꿀 것**.
                                  # reverse_max_sec 보다 작아야 한다(후방은 카메라 사각)
    reverse_min_sec: 1.2          # 후진 최소 시간 — 인지가 한 틱 깜빡이는 것으로
                                  # 후진이 끊기지 않게 하는 하한.
                                  # ※ 0.9 → 1.2 (0806). 0.9초 × 100% = 29cm 이고, 그중
                                  #   앞부분은 감속·역전에 쓰인다 — 벽에서 코를 떼기에
                                  #   빠듯했다. 1.2초 = 38cm
    reverse_max_sec: 5.0          # 후진 **상한**(안전 한계). 후방은 카메라 사각(완전
                                  # 무지)이라 무한정 뺄 수 없다.
                                  # ※ 후진 종료는 시간이 아니라 **주행 카메라가 경로를
                                  #   인지했을 때**다 — 인도가 보이고 정면을 막는 것이
                                  #   없어야 한다. 'blocked 아님'만으로는 부족하다:
                                  #   벽이 코앞이어도 슬롯이 ∞가 아니면 풀린다.
                                  #   3.0 → 5.0으로 올렸다(상한에 먼저 걸려 경로를 못 본
                                  #   채 선회로 넘어가는 일이 있었다).
    timeout_sec: 45.0             # 회차 전체 상한 — 넘기면 갇힌 것으로 보고 **U턴 승격**
                                  # (U턴 중이었으면 그때는 IDLE — uturn_escape_limit 참조).
                                  # yaw가 안 늘면(벽에 걸림·헛바퀴) 무한 반복하지 않는다.
                                  # ※ 30 → 45. 한 시도가 '전진 호 2.0 + 되짚기 2.0'으로
                                  #   길어졌고(4초), 진입 후진(최대 5초) + 시도 2회 + U턴
                                  #   (최대 8초) + 정렬(1.5초)이면 27초가 정상 경로다.
                                  #   30이면 U턴이 시작하자마자 상한에 걸린다

reporting:                        # 이상 보고 — **사진 + GPS 좌표 태깅**까지가 이 저장소의
                                  # 책임이다 (명세 4·5단계). 서버 전송/웹 지도 핀(6단계)은
                                  # 젯슨에 있는 통신 코드가 담당하고 보드에서 합친다 —
                                  # 여기서는 그 코드가 그대로 집어갈 수 있는 형식으로
                                  # 로컬에 남긴다: JPEG 1장 + JSONL 1줄(좌표·판정 포함).
                                  # 이음새는 reporting.write_report() 한 함수뿐이다.
  output_dir: reports             # 저장 경로 (config.yaml 위치 기준 상대). 하위에
                                  # <종류>_<타임스탬프>.jpg 와 events.jsonl 이 쌓인다
  save_images: true               # false면 좌표·판정만 남긴다 (SD 카드 수명·용량 관리용)
  crosswalk_confirm_frames: 3     # 미설치 판정이 이 프레임 수 **연속**돼야 보고한다.
                                  # 보고는 되돌릴 수 없는 외부 출력이라 디바운스를
                                  # FSM보다 엄격하게 든다 — 한 프레임 오탐이 '이 횡단보도에
                                  # 점자블록이 없다'는 기록을 남기면 지울 방법이 없다
  crosswalk_cooldown_sec: 30.0    # 같은 종류 보고 사이 최소 간격. 하나의 횡단보도는
                                  # 접근하는 동안 수십 프레임에 걸쳐 계속 보이므로 이
                                  # 창이 없으면 같은 지점을 수백 번 보고한다. 30초 =
                                  # 0.32 m/s에서 9.6m 이동분 — 인접 횡단보도가 그보다
                                  # 가깝게 붙어 있는 경우는 없다
  defect_cooldown_sec: 2.0        # 파손 보고 사이 최소 간격. INSPECT 정차 판정 1회당
                                  # 1건이 원칙이고, driving.inspect.cooldown_sec와 같은
                                  # 이유(같은 타일 재판정)로 같은 크기를 둔다

# perception/mocks.py 주입용 시나리오 — 초 단위 타임라인(각 구간은 until_sec까지 유지)
# ※ 장애물 회피·차도 이탈 선회·회전은 **IMU 없이도** 전부 돈다(종료 판정이 시각+시간).
#   IMU 게이트가 남은 것은 SLOPE(pitch가 있어야 경사를 안다)와 DEAD_END(yaw 누적으로
#   회차를 잰다)뿐이므로, IMU 미배선 dry-run에서는 그 둘만 비활성이다.
mock_scenarios:
  cruise_only:
    - {until_sec: 5.0, sidewalk_detected: true, center_offset_ratio: 0.2}
  costmap_steer:                  # 코스트맵 조향: 전방 중앙 비용 상승(장애물 구멍) →
                                  # 상태 전이 없이 비용 낮은 왼쪽으로 부드럽게 비껴감
    - {until_sec: 2.0, sidewalk_detected: true}
    - {until_sec: 5.0, sidewalk_detected: true,
       cost_profile: [0.0, 0.0, 0.2, 0.7, 0.9, 0.7, 0.3, 0.1, 0.1]}
    - {until_sec: 7.0, sidewalk_detected: true}
  obstacle_avoid:                 # 완료 기준 1: IDLE→CRUISE→AVOID(선회)→CRUISE.
                                  # 정지 없이 벗어나기→통과→복귀로 흘러야 한다
    - {until_sec: 2.0, sidewalk_detected: true, center_offset_ratio: 0.0}
    - {until_sec: 4.5, sidewalk_detected: true,
       obstacle: {lateral_bias: 0.3, proximity: 0.8, blocking: true}}
    - {until_sec: 9.0, sidewalk_detected: true, center_offset_ratio: 0.1}
  obstacle_persists:              # 장애물이 사라지지 않아도 선회로 통과한다 —
                                  # SWERVE는 국면 상한(phase_timeout_sec)으로 넘어간다
    - {until_sec: 2.0, sidewalk_detected: true}
    - {until_sec: 12.0, sidewalk_detected: true,
       obstacle: {lateral_bias: -0.4, proximity: 0.8, blocking: true}}
  boundary_lost:                  # 인도 경계 소실 → 유예창 동안 복구 주행(저속 + 조향
                                  # 유지) → 되짚기 후진 → 그래도 안 잡히면 **U턴**으로
                                  # 방향을 되돌려 계속 간다 (0806: 종전에는 여기가 IDLE)
    - {until_sec: 2.0, sidewalk_detected: true}
    - {until_sec: 12.0, sidewalk_detected: false}
  roadway_escape:                 # 차도 침범 위험 → **선회로 이탈**(ESCAPE) → 인도 복귀.
                                  # 종전에는 이 지점이 ESTOP(수동 해제 전 복귀 불가)이었다
    - {until_sec: 2.0, sidewalk_detected: true}
    - {until_sec: 4.0, sidewalk_detected: true, roadway_encroachment_risk: true,
       cost_profile: [0.0, 0.0, 0.1, 0.3, 0.6, .inf, .inf, .inf, .inf]}
    - {until_sec: 8.0, sidewalk_detected: true, center_offset_ratio: -0.1}
  roadway_estop:                  # 코리도 절반 이상이 차도 = 선회로는 이미 늦음 →
                                  # 즉시 ESTOP(수동 해제 전 복귀 불가). 최후 방어선
    - {until_sec: 2.0, sidewalk_detected: true}
    - {until_sec: 5.0, sidewalk_detected: true, roadway_critical: true}
  braille_trace:                  # 발견 → 추종(감속 없음) → 소실 → 순찰 복귀
                                  # (쿨다운 없음, 즉시 재추종 가능)
    - {until_sec: 2.0, sidewalk_detected: true}       # 순찰 (100%)
    - {until_sec: 3.5, sidewalk_detected: true,       # 발견 — 멀고 치우쳐 있다.
       braille: {center_offset_ratio: 0.6, proximity: 0.15}}   # 확정되면 TRACE 진입.
                                  # 근접도가 낮아 조향 유인은 약하다 — 스로틀은 순찰과
                                  # 같다(추종은 감속하지 않는다: trace.throttle_pct 근거)
    - {until_sec: 5.5, sidewalk_detected: true,       # 가까워짐 → 블록 쪽 조향 유인↑
       braille: {center_offset_ratio: 0.1, proximity: 0.42}}
    - {until_sec: 8.0, sidewalk_detected: true,       # 블록 위 — 혼합 조향 비중 1
       braille: {center_offset_ratio: 0.35, proximity: 0.7}}
    - {until_sec: 14.0, sidewalk_detected: true}      # 블록 소실 → 순찰 복귀
                                  # ※ TRACE→INSPECT(파손 후보 정차)는 탐지 모델 통지가
                                  #   있어야 일어난다 — mock 인지에는 검사기가 없으므로
                                  #   이 시나리오는 추종·복귀까지만 보여준다.
                                  #   그 전이는 tests/test_state_machine.py TestInspectFlow
  crosswalk_missing:              # 횡단보도 발견 + 이음 띠에 점자블록 없음 →
                                  # **미설치 구역** 보고(사진 + GPS 태깅) 후 주행 계속.
                                  # 주행 상태는 바뀌지 않는다 — 보고는 main 루프의 일이다
    - {until_sec: 2.0, sidewalk_detected: true}
    - {until_sec: 6.0, sidewalk_detected: true, crosswalk_ahead: true,
       braille_missing_at_crosswalk: true}
    - {until_sec: 8.0, sidewalk_detected: true}
