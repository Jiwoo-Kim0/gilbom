# placeholder 네 가지를 지원한다 (comms/config.py: load_document).
#   ${env:NAME}            환경변수. 없으면 기동 시 ConfigError — 필수값은 이 형식으로.
#   ${env?:NAME}           선택 환경변수. 없으면 null.
#   ${env?:NAME|기본값}    없으면 기본값. 기본값을 코드에 숨기지 않기 위한 것.
#   ${robot.id}            이 파일 안의 다른 값 참조.
#
# 실기 주입값은 scripts/orincar.env.example 참고. 로봇 등록·Credential 발급 응답에서
# 받은 값을 환경변수로 넣는다 — 이 파일에 직접 적고 커밋하지 않는다.

robot:
  # 웹 로봇 등록 응답의 mqttId. topic 세그먼트 {mqtt_id} · payload 의 mqtt_id ·
  # MQTT username 을 전부 이 값 하나가 결정한다.
  # ⚠️ DB 내부 PK 인 robot_id(UUID)와 다른 값이다. MQTT wire 에는 mqtt_id 만 나간다.
  id: ${env:MQTT_ID}
  # 이미지 업로드 form 의 robot_id 에 들어가는 DB 내부 UUID (robot.robot_id).
  # mqtt_id 가 아니다 — 서버 ImageUploadController 가 UUID.fromString() 으로 파싱하므로
  # RBT-001 을 보내면 400 COMMON_INVALID_REQUEST 가 떨어지고, 400 은 재시도 대상이
  # 아니라서 증거 이미지가 100% 유실된다.
  # 웹 로봇 등록 응답의 robotId. Credential·CA 와 함께 초기 환경변수로 주입한다.
  # `env?:` 라 없어도 기동한다 — 이 값이 없으면 이미지 업로드만 막히고 MQTT
  # (state·telemetry·event·command)는 전부 정상 동작하기 때문이다. 비어 있는 동안
  # 업로드는 건너뛰고 error 로그를 남기며, 결함 event 는 image_id: null 로 발행된다.
  uuid: ${env?:ROBOT_UUID}
  firmware_version: 1.0.0

mqtt:
  host: ${env:MQTT_HOST}              # 운영: i15d101.p.ssafy.io
  port: ${env?:MQTT_PORT|8883}
  # Credential 발급 응답의 username. 현재 서버는 mqttId 와 같은 값을 주지만 항목은
  # 분리해 둔다. 갈라지면 기동 시 거부한다 — 브로커 ACL 이 %u 를 mqtt_id 에 묶었고
  # 서버가 topic·payload 의 mqtt_id 를 대조하므로, 달라지면 접속은 되는데 발행이
  # 전부 거부되는 상태가 된다.
  username: ${env?:MQTT_USERNAME}     # 생략하면 robot.id
  # Credential 발급 응답의 clientId. 계약에 없는 접속 식별자라 mqtt_id 와 같을 필요는
  # 없다. 같은 client_id 로 두 번 붙으면 브로커가 먼저 붙은 쪽을 끊는다
  # ("session taken over") — 한 계정으로 여러 프로세스를 띄우는 테스트에서만 다르게 준다.
  client_id: ${env?:MQTT_CLIENT_ID}   # 생략하면 robot.id
  password: ${env:MQTT_PASSWORD}      # Credential 발급 시 1회만 보이는 값
  keepalive: 30                       # LTE NAT 매핑이 끊기기 전에 PINGREQ 를 보낸다
  # 브로커 CA. 운영 브로커는 8883 TLS 전용이라 이 값이 비면 평문으로 붙으려다
  # 무한 재접속만 반복한다.
  # 기본값 system = OS 신뢰 저장소 검증. 운영 브로커(i15d101.p.ssafy.io)는
  # Let's Encrypt 인증서라 CA 파일이 필요 없다 — 예전 사설 CA 파일을 주면 오히려
  # 검증에 실패한다. 사설 CA 브로커(로컬 mosquitto TLS 검증)에서만 파일 경로를 준다.
  # 상대경로는 이 파일이 있는 디렉터리 기준이다.
  ca_cert: ${env?:MQTT_CA_CERT|system}
  require_tls: true                   # ca_cert 가 비면 기동 시 바로 죽인다. 환경변수
                                      # 하나가 빠진 채 평문으로 뜨는 것을 막는다.
                                      # 로컬 평문 mosquitto 검증에서만 ca_cert: null +
                                      # require_tls: false 로 되돌린다.
  # QoS 는 topic 마다 계약이 고정한다 (comms/topics.py: PUBLISH_POLICY). 설정으로
  # 열지 않는다 — 하나로 뭉뚱그리면 QoS 1 topic 7종이 한꺼번에 강등돼 서버가
  # MQTT_QOS_MISMATCH 로 전부 거부한다. 웹의 MQTT_QOS=1 은 서버 구독 설정이다.
  outbox_path: var/outbox.sqlite3   # 미전송 event 저장소 (커밋 금지)

upload:
  # 관리자 Robot Credential 발급 응답의 imageUpload.url·imageUpload.apiKey를 넣는다.
  # 둘 다 `env?:`라 없어도 로봇은 정상 기동하지만 이미지 업로드만 건너뛰고 결함
  # event는 image_id: null로 발행된다. Secret 원문은 발급 응답에서 한 번만 보인다.
  url: ${env?:UPLOAD_URL}          # POST /api/v1/images 전체 URL
  api_key: ${env?:UPLOAD_API_KEY}  # 기기별 X-API-Key. 세션 쿠키·CSRF 아니다.
