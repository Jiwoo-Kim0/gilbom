listener 8883
protocol mqtt

certfile /mosquitto/certs/server-local.pem
keyfile /mosquitto/certs/server-local-key.pem
tls_version tlsv1.2

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
