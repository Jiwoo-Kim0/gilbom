user nginx;
worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr notice;

    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;

    server {
        listen 8080;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /api/health {
            proxy_pass http://backend:8080/api/health;
        }
    }
}
