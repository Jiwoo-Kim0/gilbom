name: gilbom-jenkins

x-logging: &jenkins-logging
  driver: json-file
  options:
    max-size: "${JENKINS_LOG_MAX_SIZE:-10m}"
    max-file: "${JENKINS_LOG_MAX_FILES:-3}"

services:
  docker-builder:
    image: docker:29.6.2-dind-alpine3.24
    # DinD가 생성하는 server certificate SAN에 접속 DNS 이름을 포함한다.
    hostname: docker-builder
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_DRIVER: overlay2
      HEALTHCHECK_TCP_PORT: "2376"
    volumes:
      # 기존 docker service의 TLS 상태와 분리된 전용 certificate volume이다.
      - jenkins_docker_builder_certs:/certs
      - jenkins_docker_data:/var/lib/docker
      # Remote daemon의 bind mount가 Jenkins와 같은 절대 workspace를 보게 한다.
      - ${JENKINS_HOME_DIR:-/opt/jenkins/home}:/var/jenkins_home
    healthcheck:
      test:
        - CMD
        - docker
        - info
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cpus: "${JENKINS_DIND_CPUS:-2.0}"
    mem_limit: ${JENKINS_DIND_MEMORY_LIMIT:-4g}
    mem_reservation: ${JENKINS_DIND_MEMORY_RESERVATION:-512m}
    pids_limit: ${JENKINS_DIND_PIDS_LIMIT:-512}
    networks:
      - ci
    logging: *jenkins-logging

  jenkins:
    build:
      context: .
      dockerfile: infra/jenkins/Dockerfile
    image: ${JENKINS_IMAGE:-gilbom-jenkins:2.555.3-docker-29.6.2}
    restart: unless-stopped
    depends_on:
      docker-builder:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://docker-builder:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      DOCKER_BUILDKIT: "1"
      COMPOSE_PARALLEL_LIMIT: "1"
      JENKINS_OPTS: --httpPort=8080
      JAVA_OPTS: -Xms512m -Xmx1536m
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ${JENKINS_HOME_DIR:-/opt/jenkins/home}:/var/jenkins_home
      - jenkins_docker_builder_certs:/certs:ro
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:8080/login >/dev/null
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    read_only: true
    tmpfs:
      # Jenkins Git Client는 HTTPS Credential을 전달하는 일회성 askpass
      # script를 java.io.tmpdir에서 실행한다. tmpfs의 휘발성·크기 제한과
      # nosuid/nodev는 유지하되 Git checkout에 필요한 실행만 허용한다.
      - /tmp:rw,exec,nosuid,nodev,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "${JENKINS_CPUS:-2.0}"
    mem_limit: ${JENKINS_MEMORY_LIMIT:-2g}
    mem_reservation: ${JENKINS_MEMORY_RESERVATION:-512m}
    pids_limit: ${JENKINS_PIDS_LIMIT:-512}
    networks:
      - ci
    logging: *jenkins-logging

volumes:
  jenkins_docker_builder_certs:
  jenkins_docker_data:

networks:
  ci:
    name: gilbom-ci
    driver: bridge
