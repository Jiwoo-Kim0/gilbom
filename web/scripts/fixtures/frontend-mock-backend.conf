server {
    listen 8080;
    server_name _;

    location = /api/runtime-check {
        default_type application/json;
        add_header X-Mock-Upstream backend always;
        return 200 '{"status":"UP"}';
    }

    location = /api/v1/stream/runtime-check {
        default_type text/event-stream;
        add_header Cache-Control "private, max-age=3600" always;
        add_header X-Mock-Upstream backend always;
        return 200 "event: runtime-check\ndata: ok\n\n";
    }

    # Frontend edge가 signed image 요청 cookie를 제거하고 이 응답의 Set-Cookie를
    # 숨기는지 검증한다. body에는 Backend가 실제로 받은 Cookie를 그대로 돌려준다.
    location = /api/v1/images/7c1e0000-0000-4000-8000-000000000051/content {
        default_type text/plain;
        add_header Set-Cookie "__Host-GILBOM_SESSION=must-not-reach-browser; Path=/; Secure; HttpOnly; SameSite=Lax" always;
        add_header X-Mock-Upstream backend always;
        return 200 "$http_cookie";
    }
}
