      summary: 순찰 구역 상태 변경
      description: |
        JSON Body로 목표 상태를 받으며 ACTIVE → INACTIVE → ARCHIVED 단방향 전이만
        허용한다. 현재 상태와 같은 요청은 변경 없이 현재 값을 반환한다.
        CREATED·READY·RUNNING·PAUSED Mission이 사용하는 구역은 상태를 변경할 수 없다.
        이전·이후 상태는 PATROL_AREA_UPDATED 감사 로그의 beforeValue와 afterValue에
        기록한다.
      x-required-permission: MISSION_MANAGE
