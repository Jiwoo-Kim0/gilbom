          format: date-time
        expiresAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          nullable: true
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        publishAttemptCount:
          type: integer
          minimum: 0
        lastErrorCode:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RobotCommandListResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
