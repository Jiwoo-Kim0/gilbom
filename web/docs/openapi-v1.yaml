      additionalProperties: false
      properties:
        lifecycleStatus:
          type: string
          enum: [ACTIVE, INACTIVE, ARCHIVED]

    PatrolAreaListResponse:
      type: object
      required: [areas]
      additionalProperties: false
      properties:
        areas:
          type: array
          items:
            $ref: "#/components/schemas/PatrolAreaResponse"

    PatrolRouteCreateRequest:
      type: object
      required:
        - routeCode
        - routeName
        - routeGeometry
      additionalProperties: false
      properties:
        routeCode:
          type: string
          minLength: 1
          maxLength: 50
          description: 동일 논리 경로의 버전을 묶는 코드
          example: AREA-SEOUL-01-MAIN
        routeName:
          type: string
          minLength: 1
          maxLength: 100
          description: >
            새 버전에 저장할 이름. 기존 버전의 이름 변경도 동일 routeCode의
            새 버전 등록으로 처리한다.
          example: 서울 순찰 구역 주 경로
        routeGeometry:
          type: object
          description: >
            선택한 순찰 구역 경계 안에 포함되는 SRID 4326
            LineString 또는 MultiLineString GeoJSON. 기존 버전의 Geometry는
            수정하지 않고 변경 Geometry를 새 버전으로 등록한다.
          required: [type, coordinates]
          additionalProperties: true
          properties:
            type:
              type: string
              enum: [LineString, MultiLineString]
            coordinates:
              type: array
              minItems: 1
              items: {}
          example:
            type: LineString
            coordinates:
              - [127.001, 37.001]
              - [127.019, 37.019]
        lifecycleStatus:
          type: string
          enum: [DRAFT, ACTIVE]
          default: ACTIVE
          description: >
            생성할 버전의 초기 상태. ACTIVE 등록 시 같은 routeCode의 기존 ACTIVE만
            자동 INACTIVE가 된다. DRAFT 승격과 수동 INACTIVE·ARCHIVED 전이는
            제공하지 않으며 운영 반영은 새 ACTIVE 버전 등록으로 처리한다.

    PatrolRouteResponse:
      type: object
      required:
