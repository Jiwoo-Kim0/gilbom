                $ref: "#/components/schemas/MissionTrajectoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/missions/{missionId}/map:
    get:
      tags: [Missions]
      operationId: getMissionMap
      summary: Mission 순찰 구역·실제 궤적·현재 위치 지도 조회
      description: |
        Mission의 순찰 Area 경계, 유효 GPS Telemetry 궤적과 Robot의 최신 유효
        현재 위치를 하나의 지도 Snapshot으로 반환합니다. 내부
        AUTONOMOUS_DEFAULT Route Geometry는 반환하지 않습니다.
      x-required-permission: MISSION_VIEW
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/MissionId"
        - name: limit
          in: query
          description: sampledAt 오름차순으로 반환할 최대 궤적 좌표 수
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 5000
      responses:
        "200":
          description: Mission 지도 Snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionMapResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/missions/{missionId}/history:
    get:
      tags: [Missions]
      operationId: getMissionStatusHistory
      summary: Mission 상태 전이 이력 조회
      x-required-permission: MISSION_VIEW
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/MissionId"
      responses:
        "200":
          description: 관리자·MQTT·시스템 상태 전이 이력
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionStatusHistoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/statistics/by-status:
    get:
      tags: [Statistics]
      operationId: getStatisticsByDefectStatus
      summary: 결함 처리 상태별 통계
      description: |
        defect.defect의 last_seen_at을 UTC [from,to)로 제한하고 병합 원본을
        제외한 현재 결함을 workflowStatus별로 집계합니다. 데이터가 없어도
        모든 처리 상태를 계약 순서로 반환하며 각 defectCount는 0입니다.
        이 endpoint는 from과 to 외 query parameter를 허용하지 않습니다.
      x-required-permission: DEFECT_STATUS_VIEW
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/StatisticsFrom"
        - $ref: "#/components/parameters/StatisticsTo"
      responses:
        "200":
          description: 결함 처리 상태별 집계
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticsByStatusResponse"
              example:
                from: "2026-07-01T00:00:00Z"
                to: "2026-07-05T00:00:00Z"
                totalDefectCount: 4
                items:
                  - workflowStatus: NEW
                    defectCount: 2
                  - workflowStatus: ACCEPTED
                    defectCount: 1
                  - workflowStatus: IN_PROGRESS
                    defectCount: 1
                  - workflowStatus: RESOLVED
                    defectCount: 0
                  - workflowStatus: FALSE_POSITIVE
                    defectCount: 0
                  - workflowStatus: REJECTED
                    defectCount: 0
        "400":
          $ref: "#/components/responses/StatisticsBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/StatisticsPeriodInvalid"

  /api/v1/statistics/by-defect-type:
    get:
      tags: [Statistics]
      operationId: getStatisticsByDefectType
      summary: 결함 유형별 통계
      description: |
        defect.defect의 last_seen_at을 UTC [from,to)로 제한하고 병합 원본을
        제외한 현재 결함을 defectType별로 집계합니다. 데이터가 없어도
        모든 결함 유형을 계약 순서로 반환하며 각 defectCount는 0입니다.
        집계 차원과 컬럼은 고정되어 있으며 from과 to 외 query parameter를
        허용하지 않습니다.
      x-required-permission: DEFECT_STATUS_VIEW
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/StatisticsFrom"
        - $ref: "#/components/parameters/StatisticsTo"
      responses:
        "200":
          description: 결함 유형별 집계
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticsByDefectTypeResponse"
              example:
                from: "2026-07-01T00:00:00Z"
                to: "2026-07-05T00:00:00Z"
                totalDefectCount: 4
                items:
                  - defectType: DAMAGED
                    defectCount: 1
                  - defectType: CONTAMINATED
                    defectCount: 1
                  - defectType: UPLIFTED
                    defectCount: 1
                  - defectType: BLOCKED
                    defectCount: 1
                  - defectType: MISSING_SUSPECTED
                    defectCount: 0
                  - defectType: INSTALLATION_INVALID
                    defectCount: 0
                  - defectType: UNKNOWN_ANOMALY
                    defectCount: 0
        "400":
          $ref: "#/components/responses/StatisticsBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/StatisticsPeriodInvalid"

  /api/v1/statistics/by-area:
    get:
      tags: [Statistics]
      operationId: getStatisticsByArea
      summary: 지역별 Mission·Incident·결함·Observation 통계
      description: |
        Mission started_at, Incident Event occurred_at, Defect last_seen_at,
        Observation created_at을 각각 UTC [from,to)로 집계합니다.
        patrolAreaId를 지정하면 존재 여부를 먼저 확인하고, 존재하지만 가시
        원천 데이터가 없는 구역도 0 집계 한 건을 반환합니다. 미지정 시
        areaCode, patrolAreaId 오름차순으로 페이징합니다.
      x-required-permissions: [MISSION_VIEW, DEFECT_STATUS_VIEW]
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/StatisticsFrom"
        - $ref: "#/components/parameters/StatisticsTo"
        - $ref: "#/components/parameters/StatisticsPatrolAreaId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 지역별 집계 페이지
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticsByAreaResponse"
              example:
                from: "2026-07-01T00:00:00Z"
                to: "2026-07-05T00:00:00Z"
                items:
                  - patrolAreaId: "30000000-0000-4000-8000-000000000001"
                    areaCode: A-11
                    areaName: Fixture Area A
                    metrics:
                      missionCount: 2
                      completedMissionCount: 1
                      cancelledMissionCount: 1
                      failedMissionCount: 0
                      completionRatePercent: 50.00
                      totalMissionDurationSeconds: 5400
                      incidentEventCount: 3
                      defectCount: 2
                      observationCount: 3
                  - patrolAreaId: "30000000-0000-4000-8000-000000000002"
                    areaCode: B-22
                    areaName: Fixture Area B
                    metrics:
                      missionCount: 2
                      completedMissionCount: 1
                      cancelledMissionCount: 0
                      failedMissionCount: 1
                      completionRatePercent: 50.00
                      totalMissionDurationSeconds: 6600
                      incidentEventCount: 3
                      defectCount: 2
                      observationCount: 3
                page: 0
                size: 20
                totalElements: 2
                totalPages: 1
        "400":
          $ref: "#/components/responses/StatisticsBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/StatisticsPatrolAreaNotFound"
        "422":
          $ref: "#/components/responses/StatisticsPeriodInvalid"

  /api/v1/statistics/by-period:
    get:
      tags: [Statistics]
      operationId: getStatisticsByPeriod
      summary: UTC 일별 Mission·Incident·결함·Observation 통계
      description: |
        요청 구간과 겹치는 UTC 날짜를 빠짐없이 오름차순으로 반환합니다.
        첫날과 마지막 날은 요청 [from,to)와 겹치는 부분만 집계하며 빈 날짜도
        0 집계로 반환합니다. Mission은 started_at, Incident는 occurred_at,
        결함은 last_seen_at, Observation은 created_at을 기준으로 합니다.
        v1의 granularity는 DAY만 지원합니다.
      x-required-permissions: [MISSION_VIEW, DEFECT_STATUS_VIEW]
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/StatisticsFrom"
        - $ref: "#/components/parameters/StatisticsTo"
        - $ref: "#/components/parameters/StatisticsGranularity"
      responses:
        "200":
          description: UTC 날짜별 집계
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticsByPeriodResponse"
              example:
                from: "2026-07-01T00:00:00Z"
                to: "2026-07-03T00:00:00Z"
                granularity: DAY
                items:
                  - date: "2026-07-01"
                    metrics:
                      missionCount: 1
                      completedMissionCount: 1
                      cancelledMissionCount: 0
                      failedMissionCount: 0
                      completionRatePercent: 100.00
                      totalMissionDurationSeconds: 3600
                      incidentEventCount: 2
                      defectCount: 1
                      observationCount: 2
                  - date: "2026-07-02"
                    metrics:
                      missionCount: 1
                      completedMissionCount: 0
                      cancelledMissionCount: 1
                      failedMissionCount: 0
                      completionRatePercent: 0.00
                      totalMissionDurationSeconds: 1800
                      incidentEventCount: 1
                      defectCount: 1
                      observationCount: 1
        "400":
          $ref: "#/components/responses/StatisticsBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/StatisticsPeriodInvalid"

  /api/v1/stream/robots:
    get:
      tags: [Robots]
      operationId: streamRobotUpdates
      summary: 권한 범위 내 로봇 실시간 갱신 알림
      description: |
        서버가 CONNECTED, HEARTBEAT, ROBOT_CONNECTIVITY_CHANGED,
        ROBOT_STATE_UPDATED, ROBOT_TELEMETRY_UPDATED, COMMAND_STATUS_CHANGED 이벤트를 전송합니다.
        이벤트는 변경 알림만 제공하며 클라이언트는 REST API로 최신 상태를 다시 조회합니다.
      x-required-permission: ROBOT_STATUS_VIEW
      security:
        - serverSession: []
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    serverSession:
      type: apiKey
      in: cookie
      name: __Host-GILBOM_SESSION
      description: |
        운영 서버 세션 쿠키입니다. 쿠키 존재만으로 인증 완료를 뜻하지 않으며
        서버의 ANONYMOUS, PASSWORD_CHANGE_REQUIRED, MFA 대기, AUTHENTICATED
        상태를 함께 검사합니다.
    robotApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: 로봇 이미지 업로드 전용 기기별 API Key

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    StatisticsFrom:
      name: from
      in: query
      required: true
      description: |
        집계 시작 Instant. ISO-8601 offset date-time으로 받고 UTC로
        정규화하며 결과 구간에 포함합니다.
      schema:
        type: string
        format: date-time
      example: "2026-07-01T00:00:00Z"
    StatisticsTo:
      name: to
      in: query
      required: true
      description: |
        집계 종료 Instant. ISO-8601 offset date-time으로 받고 UTC로
        정규화하며 결과 구간에서 제외합니다. from보다 늦고 차이는 최대
        366일이어야 합니다.
      schema:
        type: string
        format: date-time
      example: "2026-07-05T00:00:00Z"
    StatisticsPatrolAreaId:
      name: patrolAreaId
      in: query
      required: false
      description: |
        지역별 통계를 단일 순찰 구역으로 제한하는 UUID입니다. 형식이
        잘못되면 400, 존재하지 않으면 404 PATROL_AREA_NOT_FOUND입니다.
      schema:
        type: string
        format: uuid
    StatisticsGranularity:
      name: granularity
      in: query
      required: false
      description: 기간별 통계 집계 단위. v1에서는 DAY만 지원합니다.
      schema:
        allOf:
          - $ref: "#/components/schemas/StatisticsGranularity"
        default: DAY
    AdminUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminRoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: 현재 서버 세션에 결합된 CSRF 토큰
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        동일 생성 요청의 중복 처리를 막는 클라이언트 생성 UUID입니다.
        동일 작업의 네트워크·서버 실패 재시도에는 같은 값을 사용하고,
        사용자가 body를 변경한 새 작업에는 새 UUID를 사용합니다.
      schema:
        type: string
        format: uuid
    ReportId:
      name: reportId
      in: path
      required: true
      description: 보고서 내부 식별자
      schema:
        type: string
        format: uuid
    ReportVersionNo:
      name: versionNo
      in: path
      required: true
      description: 보고서 안에서 1부터 증가하는 불변 버전 번호
      schema:
        type: integer
        minimum: 1
    ExpectedReportVersionNo:
      name: expectedVersionNo
      in: query
      required: true
      description: |
        클라이언트가 마지막으로 조회한 currentVersionNo입니다.
        서버 값과 다르면 409 REPORT_STATE_CONFLICT를 반환합니다.
        충돌 응답에는 보고서 본문이나 최신 version 값을 포함하지 않으므로
        GET /api/v1/reports/{reportId}를 다시 조회해야 합니다.
      schema:
        type: integer
        minimum: 1
    PatrolAreaId:
      name: patrolAreaId
      in: path
      required: true
      description: 순찰 구역 UUID
      schema:
        type: string
        format: uuid
    PatrolRouteId:
      name: patrolRouteId
      in: path
      required: true
      description: 순찰 경로 버전 UUID
      schema:
        type: string
        format: uuid
    MissionId:
      name: missionId
      in: path
      required: true
      description: Mission DB UUID
      schema:
        type: string
        format: uuid

  schemas:
    AdminAccountStatus:
      type: string
      enum:
        - PENDING_APPROVAL
        - ACTIVE
        - DISABLED
        - REJECTED
        - DELETED

    AdminAssignedRoleResponse:
      type: object
      required: [roleId, roleCode, roleName, primary]
      additionalProperties: false
      properties:
        roleId:
          type: string
          format: uuid
        roleCode:
          type: string
        roleName:
          type: string
        primary:
          type: boolean

    AdminUserResponse:
      type: object
      required:
        - userId
        - userCode
        - email
        - displayName
        - accountStatus
        - active
        - mfaEnrolled
        - roles
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        userId:
          type: string
          format: uuid
        userCode:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        departmentName:
          type: string
          nullable: true
        jobTitle:
          type: string
          nullable: true
        officeName:
          type: string
          nullable: true
        accountStatus:
          $ref: "#/components/schemas/AdminAccountStatus"
        active:
          type: boolean
        mfaEnrolled:
          type: boolean
        roles:
          type: array
          items:
            $ref: "#/components/schemas/AdminAssignedRoleResponse"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminUserPageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      additionalProperties: false
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserResponse"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    AdminRegistrationApprovalRequest:
      type: object
      required: [roleIds, reason]
      additionalProperties: false
      properties:
        roleIds:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
        primaryRoleId:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          maxLength: 500
          description: 선택 승인 사유. 공백 문자열은 사유 없음으로 정규화한다.

    AdminReasonRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    AdminUserStatusRequest:
      type: object
      required: [status, reason]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        reason:
          type: string
          minLength: 1
          maxLength: 500

    AdminUserRolesRequest:
      type: object
      required: [roleIds, reason]
      additionalProperties: false
      properties:
        roleIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
        primaryRoleId:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          minLength: 1
          maxLength: 500

    AdminOverrideEffect:
      type: string
      enum: [ALLOW, DENY]

    AdminPermissionOverrideItem:
      type: object
      required: [permissionId, effect, reason]
      additionalProperties: false
      properties:
        permissionId:
          type: string
          format: uuid
        effect:
          $ref: "#/components/schemas/AdminOverrideEffect"
        expiresAt:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          minLength: 1
          maxLength: 500

    AdminPermissionOverridesRequest:
      type: object
      required: [overrides, reason]
      additionalProperties: false
      properties:
        overrides:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AdminPermissionOverrideItem"
        reason:
          type: string
          minLength: 1
          maxLength: 500

    AdminPermissionOverrideResponse:
      type: object
      required:
        - permissionOverrideId
        - permissionId
        - permissionCode
        - effect
        - reason
        - grantedAt
      additionalProperties: false
      properties:
        permissionOverrideId:
          type: string
          format: uuid
        permissionId:
          type: string
          format: uuid
        permissionCode:
          type: string
        effect:
          $ref: "#/components/schemas/AdminOverrideEffect"
        reason:
          type: string
        grantedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true

    AdminRobotAssignmentType:
      type: string
      enum: [VIEWER, OPERATOR, OWNER]

    AdminRobotAssignmentItem:
      type: object
      required: [robotId, assignmentType, reason]
      additionalProperties: false
      properties:
        robotId:
          type: string
          format: uuid
        assignmentType:
          $ref: "#/components/schemas/AdminRobotAssignmentType"
        expiresAt:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          minLength: 1
          maxLength: 500

    AdminRobotAssignmentsRequest:
      type: object
      required: [assignments, reason]
      additionalProperties: false
      properties:
        assignments:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/AdminRobotAssignmentItem"
        reason:
          type: string
          minLength: 1
          maxLength: 500

    AdminRobotAssignmentResponse:
      type: object
      required:
        - assignmentId
        - robotId
        - robotName
        - assignmentType
        - reason
        - assignedAt
      additionalProperties: false
      properties:
        assignmentId:
          type: string
          format: uuid
        robotId:
          type: string
          format: uuid
        robotName:
          type: string
        assignmentType:
          $ref: "#/components/schemas/AdminRobotAssignmentType"
        reason:
          type: string
        assignedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true

    AdminRoleResponse:
      type: object
      required:
        - roleId
        - roleCode
        - roleName
