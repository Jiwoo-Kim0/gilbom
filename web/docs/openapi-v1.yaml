  /api/v1/reports:
    get:
      tags: [Reports]
      operationId: listReports
      summary: 보고서 목록·검색
      description: |
        소프트 삭제되지 않은 보고서를 권한 범위에서 검색합니다.
        search는 trim 후 reportCode와 title에 대소문자 무시 부분 일치로 적용합니다.
      x-required-permission: REPORT_VIEW
      x-error-codes:
        - REPORT_ACCESS_DENIED
        - REPORT_VALIDATION_FAILED
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: search
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: statuses
          in: query
          required: false
          description: 쉼표로 구분한 보고서 상태
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: "#/components/schemas/ReportStatus"
        - name: createdBy
          in: query
          required: false
          description: 보고서 최초 작성자 UUID
          schema:
            type: string
            format: uuid
        - name: periodFrom
          in: query
          required: false
          description: 이 시각 이후까지 이어지는 보고서 기간과 겹치는 결과
          schema:
            type: string
            format: date-time
        - name: periodTo
          in: query
          required: false
          description: 이 시각 이전부터 시작한 보고서 기간과 겹치는 결과
          schema:
            type: string
            format: date-time
        - name: reportType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ReportType"
        - name: generationMethod
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ReportGenerationMethod"
        - name: sort
          in: query
          required: false
          description: createdAt, updatedAt, title과 asc, desc만 허용
          schema:
            type: string
            default: createdAt,desc
            pattern: '^(createdAt|updatedAt|title),(asc|desc)$'
      responses:
        "200":
          description: 보고서 페이지
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Reports]
      operationId: createReport
      summary: 수동·템플릿·LLM DRAFT 보고서와 첫 버전 생성
      description: |
        MANUAL·TEMPLATE는 요청의 완성된 snapshot을 저장합니다. LLM은 요청 기간과
        객체 접근 범위로 서버가 통계·결함 근거를 구성한 뒤 정책·rate·budget gate를
        통과한 경우에만 외부 생성을 실행합니다.
        LLM 이미지 근거는 클라이언트가 보내지 않습니다. 서버가 기간 내 대표 결함 이미지
        최대 1장을 내부 Reader에서 bytes로 읽고, 이미지가 없거나 정책 미승인이면
        텍스트만으로 생성합니다.
        LLM 장애·quota·정책 비활성 또는 응답 검증 실패 시 같은 요청 안에서 안전한
        TEMPLATE 보고서를 생성하고 generationFallbackReason 고정 코드만 저장합니다.
        같은 사용자·같은 Idempotency-Key·같은 body는 최초 201 응답을 재사용합니다.
        멱등 claim 소유자만 snapshot 조회와 LLM 호출을 수행하므로 처리 중인 동일 요청도
        보고서나 외부 호출을 중복 실행하지 않습니다.
      x-required-permission: REPORT_CREATE
      x-error-codes:
        - REPORT_ACCESS_DENIED
        - REPORT_VALIDATION_FAILED
        - COMMON_CONFLICT
        - IDEMPOTENCY_KEY_REUSED
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportCreateRequest"
      responses:
        "201":
          description: 보고서 생성
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
