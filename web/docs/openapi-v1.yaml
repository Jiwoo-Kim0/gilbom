    MissionStatus:
      type: string
      enum:
        - CREATED
        - READY
        - RUNNING
        - PAUSED
        - COMPLETED
        - CANCELLED
        - FAILED

    MissionCreateRequest:
      type: object
      required:
        - robotId
        - patrolAreaId
        - patrolRouteId
        - plannedDurationSec
      additionalProperties: false
      properties:
        robotId:
          type: string
          format: uuid
        patrolAreaId:
          type: string
          format: uuid
        patrolRouteId:
          type: string
          format: uuid
          description: >
            API·DB FK 호환 전용 AUTONOMOUS_DEFAULT Route ID.
            화면에서 사용자에게 노출하거나 경로 계획에 사용하지 않습니다.
        plannedDurationSec:
          type: integer
          minimum: 1
          description: 계획 수행 시간(초). 시간 기반 진행률 계산의 분모입니다.
        scheduledStartAt:
          type: string
          format: date-time
          nullable: true

    MissionUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        patrolAreaId:
          type: string
          format: uuid
        patrolRouteId:
          type: string
          format: uuid
          description: API·DB FK 호환 전용 AUTONOMOUS_DEFAULT Route ID
        plannedDurationSec:
          type: integer
          minimum: 1
        scheduledStartAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [READY, CANCELLED, FAILED]
        completionReason:
          type: string
          maxLength: 100
      description: CANCELLED 또는 FAILED에서는 completionReason이 필수입니다.

    MissionResponse:
      type: object
      required:
        - missionId
        - missionCode
        - robotId
        - mqttId
        - robotName
        - patrolAreaId
        - patrolAreaCode
        - patrolAreaName
        - patrolRouteId
        - patrolRouteCode
        - patrolRouteName
        - patrolRouteVersion
        - plannedDurationSec
        - remainingDurationSec
        - progressStale
        - status
        - progressPercent
        - createdBy
        - updatedBy
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        missionId:
          type: string
          format: uuid
        missionCode:
          type: string
          description: MQTT payload의 문자열 mission_id
        robotId:
          type: string
          format: uuid
        mqttId:
          type: string
        robotName:
          type: string
        patrolAreaId:
          type: string
          format: uuid
        patrolAreaCode:
          type: string
        patrolAreaName:
          type: string
        patrolRouteId:
          type: string
          format: uuid
          description: API·DB FK 호환 전용 내부 Route ID
        patrolRouteCode:
          type: string
          description: AUTONOMOUS_DEFAULT. 사용자 화면 비노출 값
        patrolRouteName:
          type: string
          description: 사용자 화면 비노출 내부 호환 값
        patrolRouteVersion:
          type: integer
          minimum: 1
          description: 사용자 화면 비노출 내부 호환 값
        plannedDurationSec:
          type: integer
          minimum: 1
          description: 계획 수행 시간(초)
        elapsedSec:
          type: integer
          minimum: 0
          nullable: true
          description: 최신 유효 Telemetry의 mission.elapsed_sec
        remainingDurationSec:
          type: integer
          minimum: 0
          description: max(plannedDurationSec - elapsedSec, 0)
        progressObservedAt:
          type: string
          format: date-time
          nullable: true
          description: 진행률 계산에 사용한 최신 Telemetry sampled_at
        progressStale:
          type: boolean
          description: >
            RUNNING·PAUSED 상태에서 최신 진행 Telemetry가 없거나
            15초보다 오래되었는지 여부
        status:
          $ref: "#/components/schemas/MissionStatus"
        scheduledStartAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true
        progressPercent:
          type: number
          minimum: 0
          maximum: 100
          description: >
            min(99.99, elapsedSec / plannedDurationSec * 100).
            100은 MISSION_COMPLETED Event에서만 확정합니다.
        estimatedCompletionAt:
          type: string
          format: date-time
          nullable: true
          description: >
            RUNNING·PAUSED Mission에서 최신 progressObservedAt에
            remainingDurationSec을 더한 예상 완료 시각
        completionReason:
          type: string
          nullable: true
        resultDurationSec:
          type: integer
          minimum: 0
          nullable: true
        resultIncidentCount:
          type: integer
          minimum: 0
          nullable: true
        resultNormalDetectionCount:
          type: integer
          minimum: 0
          nullable: true
        resultPayload:
          type: object
          nullable: true
          additionalProperties: true
        createdBy:
          type: string
          format: uuid
        updatedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

