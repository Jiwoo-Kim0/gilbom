  /api/v1/audit-logs:
    get:
      tags: [Audit]
      operationId: listAuditLogs
      summary: 감사 로그 목록 조회
      description: |
        추가 전용 감사 로그를 최신순으로 조회합니다. 검색어 원문이나 전체 결과는
        조회 감사에 복제하지 않고 적용된 필터 이름과 반환 건수만 기록합니다.
      x-required-permission: AUDIT_LOG_VIEW
      security:
        - serverSession: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: requestId
          in: query
          schema:
            type: string
            format: uuid
        - name: actorUserId
          in: query
          schema:
            type: string
            format: uuid
        - name: actionType
          in: query
          schema:
            type: string
            pattern: "^[A-Z][A-Z0-9_]{2,79}$"
        - name: targetType
          in: query
          schema:
            type: string
            pattern: "^[A-Z][A-Z0-9_]{1,49}$"
        - name: targetId
          in: query
          schema:
            type: string
            format: uuid
        - name: result
          in: query
          schema:
            type: string
            enum: [SUCCESS, FAILURE, DENIED]
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: 감사 로그 페이지
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/robots:
