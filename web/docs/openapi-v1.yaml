      summary: 순찰 경로 버전 등록
      description: |
        순찰 구역 내부의 4326 LineString 또는 MultiLineString을 등록한다.
        routeVersion은 동일 구역·routeCode 기준으로 서버가 자동 증가시킨다.
        ACTIVE 버전을 등록하면 기존 활성 버전은 INACTIVE로 전환된다.
        Route 버전의 코드·이름·Geometry는 생성 후 직접 수정하거나 삭제하지 않는다.
        이름 또는 Geometry를 변경하거나 DRAFT를 운영에 반영할 때는 같은 routeCode로
        새 버전을 등록한다. Route PATCH·DELETE·수동 상태 변경 API는 제공하지 않으며,
        ARCHIVED는 기존 데이터 조회 호환을 위한 예약 상태다.
      x-required-permission: MISSION_MANAGE
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/PatrolAreaId"
      requestBody:
        required: true
        content:
