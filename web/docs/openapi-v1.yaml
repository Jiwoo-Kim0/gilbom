        - lifecycleStatus
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        patrolAreaId:
          type: string
          format: uuid
        areaCode:
          type: string
        areaName:
          type: string
        boundary:
          type: object
          description: SRID 4326 Polygon 또는 MultiPolygon GeoJSON
          additionalProperties: true
        lifecycleStatus:
          type: string
          enum: [ACTIVE, INACTIVE, ARCHIVED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PatrolAreaUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        areaName:
          type: string
          minLength: 1
          maxLength: 100
          example: 서울 순찰 구역 1 변경
        boundary:
          type: object
          description: >
            ACTIVE·DRAFT Route를 모두 포함하는 SRID 4326 Polygon 또는
            MultiPolygon GeoJSON
          required: [type, coordinates]
          additionalProperties: true
          properties:
            type:
              type: string
              enum: [Polygon, MultiPolygon]
            coordinates:
              type: array
              minItems: 1
              items: {}

    PatrolAreaStatusChangeRequest:
      type: object
      required:
