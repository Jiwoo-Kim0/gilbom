        type:
          type: string
          enum: [Polygon, MultiPolygon]
        coordinates:
          type: array
          minItems: 1
          items: {}

    PatrolAreaCreateRequest:
      type: object
      required:
        - areaCode
        - areaName
        - boundary
      additionalProperties: false
      properties:
        areaCode:
          type: string
          minLength: 1
          maxLength: 50
          example: AREA-SEOUL-01
        areaName:
          type: string
          minLength: 1
          maxLength: 100
          example: 서울 순찰 구역 1
        boundary:
          type: object
          description: >
            경도 -180~180, 위도 -90~90 범위의 닫힌 선형 링으로 구성된
            SRID 4326 Polygon 또는 MultiPolygon GeoJSON
          required: [type, coordinates]
          additionalProperties: true
          properties:
            type:
              type: string
              enum: [Polygon, MultiPolygon]
            coordinates:
              type: array
              minItems: 1
              items: {}
          example:
            type: Polygon
            coordinates:
              - - [127.0, 37.0]
                - [127.1, 37.0]
                - [127.1, 37.1]
                - [127.0, 37.0]
        lifecycleStatus:
          type: string
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE

    PatrolAreaResponse:
      type: object
      required:
        - patrolAreaId
        - areaCode
        - areaName
