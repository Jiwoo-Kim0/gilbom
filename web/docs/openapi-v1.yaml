      type: object
      required: [authenticationState, challengeExpiresAt]
      additionalProperties: false
      properties:
        authenticationState:
          type: string
          enum:
            - ANONYMOUS
            - PASSWORD_CHANGE_REQUIRED
            - MFA_ENROLLMENT_REQUIRED
            - MFA_REQUIRED
            - AUTHENTICATED
        challengeExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: pre-auth challenge에만 존재하며 그 외 상태에서는 null

    LoginChallengeResponse:
      type: object
      required: [loginState, challengeExpiresAt]
      additionalProperties: false
      properties:
        loginState:
          $ref: "#/components/schemas/LoginState"
        challengeExpiresAt:
          type: string
          format: date-time

    InitialPasswordChangeRequest:
      type: object
      required: [newPassword]
      additionalProperties: false
      properties:
        newPassword:
          type: string
          format: password
          minLength: 10
          maxLength: 24
          description: 조합 규칙 없이 Unicode code point 기준 10~24자
          writeOnly: true

    TotpCodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          writeOnly: true
          description: 로그·오류 응답에 반사하지 않는 6자리 TOTP

    TotpRecoveryRequest:
      type: object
      required: [recoveryCode]
      additionalProperties: false
      properties:
        recoveryCode:
          type: string
          minLength: 22
          maxLength: 22
          pattern: '^(0[1-9]|10)-[A-Z2-7]{4}(?:-[A-Z2-7]{4}){3}$'
          writeOnly: true
          description: 등록 확인 성공 응답에서 한 번만 발급한 위치 식별형 복구 코드

    OwnMfaResetRequest:
      type: object
      required: [currentPassword]
      additionalProperties: false
      description: totpCode와 recoveryCode 중 정확히 하나가 필요합니다.
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 10
          maxLength: 24
          writeOnly: true
        totpCode:
          type: string
          pattern: '^[0-9]{6}$'
          writeOnly: true
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 100
          writeOnly: true
      oneOf:
        - required: [totpCode]
          not:
            required: [recoveryCode]
        - required: [recoveryCode]
          not:
            required: [totpCode]

    AdminMfaResetRequest:
      type: object
