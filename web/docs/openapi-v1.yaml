      description: |
        ADMIN은 전체 로봇을 조회하며 일반 사용자는 현재 유효한
        user_robot_assignment 범위의 로봇만 조회합니다.
        객체 범위는 SQL에서 적용되며 페이지는 0부터 시작합니다.
      x-required-permission: ROBOT_STATUS_VIEW
      security:
        - serverSession: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: 권한 범위 내 로봇 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RobotListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
