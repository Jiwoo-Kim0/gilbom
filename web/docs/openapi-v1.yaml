        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    get:
      tags: [Missions]
      operationId: listPatrolRoutes
      summary: 순찰 구역의 버전별 경로 조회
      description: >
        DRAFT, ACTIVE, INACTIVE와 기존 ARCHIVED 버전을 숨기지 않고 반환한다.
        각 버전은 조회 전용이며 변경은 새 버전 POST로 처리한다.
