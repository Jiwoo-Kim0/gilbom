          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Robots]
      operationId: registerRobot
      summary: 로봇 기준정보 등록
      description: |
        로그인 관리자를 등록자로 사용해 로봇을 PROVISIONING 상태로 등록하고,
        현재 연결 상태를 OFFLINE으로 초기화합니다. MQTT Credential은 발급하지 않습니다.
        동일 관리자·동일 Idempotency-Key의 완료 요청은 최초 201 응답을 재사용합니다.
      x-required-permission: ROBOT_REGISTER
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RobotRegistrationRequest"
      responses:
        "201":
          description: 로봇 등록 완료
          headers:
            Location:
              description: 등록한 로봇 리소스 경로
              schema:
                type: string
                example: /api/v1/robots/8750afcb-d682-4ef6-a90d-f63fcf5c214e
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RobotRegistrationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

