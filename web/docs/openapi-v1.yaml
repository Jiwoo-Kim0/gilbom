      type: string
      enum: [DAY]

    StatisticsAggregateMetrics:
      type: object
      required:
        - missionCount
        - completedMissionCount
        - cancelledMissionCount
        - failedMissionCount
        - completionRatePercent
        - totalMissionDurationSeconds
        - incidentEventCount
        - defectCount
        - observationCount
      additionalProperties: false
      properties:
        missionCount:
          type: integer
          format: int64
          minimum: 0
          description: started_at이 집계 구간에 속하는 Mission 수
        completedMissionCount:
          type: integer
          format: int64
          minimum: 0
        cancelledMissionCount:
          type: integer
          format: int64
          minimum: 0
        failedMissionCount:
          type: integer
          format: int64
          minimum: 0
        completionRatePercent:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: |
            completedMissionCount / missionCount * 100. missionCount가 0이면
            0이며 소수점 둘째 자리까지 HALF_UP으로 반올림합니다.
        totalMissionDurationSeconds:
          type: integer
          format: int64
          minimum: 0
          description: result_duration_sec 합계. null 값은 0으로 취급합니다.
        incidentEventCount:
          type: integer
          format: int64
          minimum: 0
          description: |
            occurred_at이 집계 구간에 속하는
            BRAILLE_BLOCK_INCIDENT_DETECTED Robot Event 수
        defectCount:
          type: integer
          format: int64
          minimum: 0
          description: |
            last_seen_at이 집계 구간에 속하고 merged_into_defect_id가 null인
            현재 결함 수
        observationCount:
          type: integer
          format: int64
          minimum: 0
          description: created_at이 집계 구간에 속하는 가시 Defect Observation 수

