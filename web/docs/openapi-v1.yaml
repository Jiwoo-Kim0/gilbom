          type: integer
          minimum: 1
        routeGeometry:
          type: object
          description: SRID 4326 LineString 또는 MultiLineString GeoJSON
          additionalProperties: true
        lifecycleStatus:
          type: string
          enum: [DRAFT, ACTIVE, INACTIVE, ARCHIVED]
          description: >
            버전 조회 상태. ACTIVE 등록에 의해 이전 ACTIVE가 INACTIVE로 바뀌는
            경우를 제외하면 API에서 기존 버전 상태를 직접 변경하지 않는다.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

