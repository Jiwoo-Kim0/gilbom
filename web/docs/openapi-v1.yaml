openapi: 3.0.3
info:
  title: 길봄 API
  version: 1.0.0
  description: |
    길봄 REST API의 공통 응답·오류와 Day 1 인증·권한·보고서 상태 계약입니다.
    성공 응답은 공통 envelope 없이 실제 DTO를 직접 반환합니다.
    세부 정책은 docs의 주제별 Markdown 정본을 함께 기준으로 합니다.

tags:
  - name: Auth
    description: 관리자 서버 세션·CSRF·TOTP 인증
  - name: Reports
    description: 보고서 생성·버전·검토·승인 상태 계약

x-api-conventions:
  successResponse:
    envelope: false
    description: 성공 응답은 실제 DTO를 직접 반환한다.
  errorResponse:
    schema: "#/components/schemas/ErrorResponse"
    requestIdHeader: X-Request-Id
  validation:
    badRequest: 필드·파라미터·JSON 형식 오류
    conflict: 현재 리소스 상태 또는 기존 데이터와 충돌
    unprocessableEntity: 형식은 유효하지만 업무 규칙 위반
  authentication:
    type: server-session
    productionCookie: __Host-GILBOM_SESSION
    csrfHeader: X-CSRF-TOKEN
    mfa: TOTP required for every administrator
    idleTimeout: PT30M
    absoluteTimeout: PT8H
    preAuthenticationChallengeTimeout: PT5M
    maximumAuthenticatedSessionsPerUser: 1
    csrfClientStorage: memory-only
    ipAuthenticationRateLimit:
      maximumRequests: 20
      window: PT1M
    passwordFailureLimit:
      maximumFailures: 5
      window: PT15M
      temporaryLock: PT15M
    mfaFailureLimit:
      maximumFailures: 5
      window: PT15M
      temporaryLock: PT15M
  authorization:
    model: RBAC permission plus resource scope
    default: deny
    source: authorization-matrix.md

x-contract-sources:
  common: common-api-response-and-errors.md
  api: api-contract.md
  authentication: admin-authentication-security.md
  session: session-cookie-csrf.md
  authenticationDefense: authentication-rate-limit-lock-audit.md
  authorization: authorization-matrix.md
  reportStatus: report-status-contract.md
  environment: environment-configuration-strategy.md
  endpointDtoBaseline: ../../docs/길봄_MQTT 통신_SWAGGER REST SSE_API 명세서.pdf
  migrationRule: 구현하는 endpoint는 같은 변경에서 이 OpenAPI에 operation과 schema를 완성한다.

paths:
  /api/v1/auth/csrf-token:
    get:
      tags: [Auth]
      operationId: issueCsrfToken
      summary: 익명 또는 인증 세션의 CSRF 토큰 발급
      description: |
        로그인 전에도 호출할 수 있습니다. 세션에 토큰을 저장하고 응답은
        Cache-Control: no-store로 전달합니다.
      security: []
      responses:
        "200":
          description: CSRF 토큰 발급
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/email-availability:
    post:
      tags: [Auth]
      operationId: checkRegistrationEmailAvailability
      summary: 회원가입 이메일 중복 확인
      description: |
        이메일이 URL·프록시 access log에 남지 않도록 JSON body를 사용합니다.
        결과는 UX 보조 정보이며 가입 시 DB UNIQUE 제약으로 다시 확인합니다.
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailAvailabilityRequest"
      responses:
        "200":
          description: 이메일 사용 가능 여부
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAvailabilityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/registrations:
    post:
      tags: [Auth]
      operationId: registerPublicAccount
      summary: 공개 회원가입
      description: |
        계정을 PENDING_APPROVAL·역할 없음으로 생성합니다. 인증 세션이나 업무 권한을
        만들지 않으며 클라이언트는 가입 안내 후 로그인 화면으로 이동합니다.
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicRegistrationRequest"
      responses:
        "201":
          description: 승인 대기 회원가입 생성
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRegistrationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 관리자 이메일·비밀번호 검증
      description: |
        성공해도 업무 권한을 부여하지 않고 비밀번호 변경 또는 MFA 다음 상태를 반환합니다.
        익명 세션에 결합된 CSRF 토큰이 필요합니다.
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "202":
          description: 비밀번호 검증 성공, 초기 비밀번호 변경 또는 MFA 단계 필요
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginChallengeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/password/initial-change:
    post:
      tags: [Auth]
      operationId: changeInitialPassword
      summary: 초기 비밀번호 변경
      description: |
        PASSWORD_CHANGE_REQUIRED 세션에서만 호출할 수 있습니다. 성공해도 인증을
        완료하지 않고 MFA_ENROLLMENT_REQUIRED 상태를 202로 반환합니다.
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitialPasswordChangeRequest"
      responses:
        "202":
          description: 초기 비밀번호 변경 완료, TOTP 등록 필요
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginChallengeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/mfa/totp/enroll:
    post:
      tags: [Auth]
      operationId: enrollTotp
      summary: TOTP 등록 정보 일회성 발급
      description: |
        MFA_ENROLLMENT_REQUIRED 세션에서만 호출할 수 있습니다.
        기존 미확인 등록 정보는 폐기되고 새 AES-GCM 암호문이 저장됩니다.
        응답의 otpauth URI와 수동 입력키는 로그·브라우저 저장소에 보관하면 안 됩니다.
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: TOTP 등록 정보 발급
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/mfa/totp/confirm:
    post:
      tags: [Auth]
      operationId: confirmTotpEnrollment
      summary: 첫 TOTP 코드 확인 및 등록 완료
      description: |
        MFA_ENROLLMENT_REQUIRED 세션에서 첫 TOTP를 검증합니다.
        성공할 때 factor 활성화, 복구 코드 hash 저장, 기존 세션 폐기,
        현재 세션 ID·CSRF 교체를 함께 완료합니다.
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
      responses:
        "200":
          description: TOTP 등록과 인증 완료, 복구 코드 일회성 발급
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaEnrollmentConfirmationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/mfa/totp/verify:
    post:
      tags: [Auth]
      operationId: verifyTotp
      summary: 로그인 TOTP 검증
      description: |
        MFA_REQUIRED 세션에서 RFC 6238 TOTP를 검증합니다.
        현재 30초 time-step과 앞뒤 1개만 허용하며 이미 성공한 step은 재사용할 수 없습니다.
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
      responses:
        "200":
          description: MFA와 관리자 인증 완료
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/mfa/recovery:
    post:
      tags: [Auth]
      operationId: verifyMfaRecoveryCode
      summary: 일회용 복구 코드 검증
      description: |
        MFA_REQUIRED 세션에서 미사용 복구 코드를 검증하고 원자적으로 소비합니다.
        성공한 코드는 다시 사용할 수 없으며 응답의 recoveryCodeUsed는 true입니다.
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpRecoveryRequest"
      responses:
        "200":
          description: 복구 코드 소비 및 관리자 인증 완료
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 세션 폐기 및 로그아웃
      description: |
        인증 완료 또는 pre-auth challenge 세션을 서버에서 폐기하고 세션 쿠키를
        Max-Age=0으로 만료합니다. 폐기한 세션 ID는 다시 사용할 수 없습니다.
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: 로그아웃 완료
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Set-Cookie:
              schema:
                type: string
              description: 동일한 이름·Path의 세션 쿠키를 Max-Age=0으로 만료
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: 현재 인증 관리자와 유효 권한 조회
      security:
        - serverSession: []
      responses:
        "200":
          description: 현재 관리자
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/my/profile:
    get:
      tags: [Auth]
      operationId: getMyProfile
      summary: 현재 관리자 마이페이지 프로필 조회
      description: |
        이메일, 표시 이름, 조직 정보, 역할·권한, MFA 상태와 비밀번호·최근 로그인
        시각만 반환합니다. 비밀번호 hash, TOTP secret, 복구 코드, 세션·CSRF는 반환하지
        않습니다.
      security:
        - serverSession: []
      responses:
        "200":
          description: 현재 관리자 프로필
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/my/password:
    patch:
      tags: [Auth]
      operationId: changeMyPassword
      summary: 현재 관리자 비밀번호 변경
      description: |
        현재 비밀번호를 재검증하고 새 비밀번호를 중앙 Argon2id 설정으로 hash합니다.
        성공하면 모든 서버 세션을 폐기하고 현재 세션 쿠키도 만료하므로 다시 로그인해야
        합니다.
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MyPasswordChangeRequest"
      responses:
        "204":
          description: 비밀번호 변경과 모든 세션 폐기 완료
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Set-Cookie:
              schema:
                type: string
              description: 동일한 이름·Path의 세션 쿠키를 Max-Age=0으로 만료
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/my/mfa/totp/reset:
    post:
      tags: [Auth]
      operationId: resetOwnTotp
      summary: 본인 TOTP 교체 시작
      description: |
        현재 비밀번호와 현재 TOTP 또는 미사용 복구 코드를 검증합니다.
        성공하면 기존 factor와 세션을 폐기하고 MFA_ENROLLMENT_REQUIRED 상태로 전환합니다.
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnMfaResetRequest"
      responses:
        "202":
          description: 기존 MFA 폐기 및 재등록 필요
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginChallengeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/admin/users/{userId}/mfa/reset:
    post:
      tags: [Auth]
      operationId: resetUserTotpAsAdmin
      summary: 다른 관리자의 TOTP 긴급 초기화
      description: ADMIN_SETTINGS_MANAGE와 작업자 자신의 비밀번호·TOTP 재검증이 필요합니다.
      x-required-permission: ADMIN_SETTINGS_MANAGE
      security:
        - serverSession: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMfaResetRequest"
      responses:
        "204":
          description: 대상 MFA와 활성 세션 폐기 완료
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/reports:
    post:
      tags: [Reports]
      operationId: createReport
      summary: DRAFT 보고서와 첫 버전 생성
      x-required-permission: REPORT_CREATE
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportCreateRequest"
      responses:
        "201":
          description: 보고서 생성
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/reports/{reportId}:
    patch:
      tags: [Reports]
      operationId: updateReport
      summary: DRAFT·REJECTED 보고서 새 버전 생성
      x-required-permission: REPORT_UPDATE
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportUpdateRequest"
      responses:
        "200":
          description: 새 버전 생성 및 보고서 갱신
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Reports]
      operationId: deleteReport
      summary: DRAFT·REJECTED 보고서 소프트 삭제
      x-required-permission: REPORT_UPDATE
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: 보고서 소프트 삭제
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/reports/{reportId}/submit:
    post:
      tags: [Reports]
      operationId: submitReport
      summary: DRAFT에서 IN_REVIEW로 전이
      x-required-permission: REPORT_UPDATE
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportTransitionRequest"
      responses:
        "200":
          description: 검토 요청 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/reports/{reportId}/approve:
    post:
      tags: [Reports]
      operationId: approveReport
      summary: IN_REVIEW에서 APPROVED로 전이
      x-required-permission: REPORT_APPROVE
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportDecisionRequest"
      responses:
        "200":
          description: 보고서 승인
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/reports/{reportId}/reject:
    post:
      tags: [Reports]
      operationId: rejectReport
      summary: IN_REVIEW에서 REJECTED로 전이
      x-required-permission: REPORT_APPROVE
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRejectionRequest"
      responses:
        "200":
          description: 보고서 반려
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    serverSession:
      type: apiKey
      in: cookie
      name: __Host-GILBOM_SESSION
      description: |
        운영 서버 세션 쿠키입니다. 쿠키 존재만으로 인증 완료를 뜻하지 않으며
        서버의 ANONYMOUS, PASSWORD_CHANGE_REQUIRED, MFA 대기, AUTHENTICATED
        상태를 함께 검사합니다.
    robotApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: 로봇 이미지 업로드 전용 기기별 API Key

  parameters:
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: 현재 서버 세션에 결합된 CSRF 토큰
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 동일 생성 요청의 중복 처리를 막는 클라이언트 생성 UUID
      schema:
        type: string
        format: uuid
    ReportId:
      name: reportId
      in: path
      required: true
      description: 보고서 내부 식별자
      schema:
        type: string
        format: uuid

  schemas:
    PermissionCode:
      type: string
      enum:
        - ROBOT_STATUS_VIEW
        - ROBOT_REGISTER
        - ROBOT_COMMAND_VIEW
        - ROBOT_COMMAND_EXECUTE
        - ROBOT_EVENT_ACKNOWLEDGE
        - MISSION_VIEW
        - MISSION_MANAGE
        - DEFECT_STATUS_VIEW
        - DEFECT_STATUS_UPDATE
        - DEFECT_MERGE
        - DEFECT_EXPORT
        - REPORT_VIEW
        - REPORT_CREATE
        - REPORT_UPDATE
        - REPORT_APPROVE
        - AUDIT_LOG_VIEW
        - ADMIN_SETTINGS_MANAGE
        - SYSTEM_LOG_VIEW

    CsrfTokenResponse:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
          enum: [X-CSRF-TOKEN]
        token:
          type: string
          minLength: 1
          description: 세션 결합 불투명 토큰. 저장·로그 금지.

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: |
            로그인 ID. 앞뒤 공백을 허용하지 않으며 Locale.ROOT 기준 전체 소문자를
            normalized_email로 사용합니다. DNS·MX·사업자별 별칭 정규화는 하지 않습니다.
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 24
          writeOnly: true

    EmailAvailabilityRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: 앞뒤 공백을 허용하지 않는 회원가입 이메일

    EmailAvailabilityResponse:
      type: object
      required: [available]
      additionalProperties: false
      properties:
        available:
          type: boolean
          description: normalized_email 기준 현재 사용 가능 여부

    PublicRegistrationRequest:
      type: object
      required: [email, password, displayName]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: 로그인 ID로 사용할 이메일
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 24
          description: 조합 규칙 없이 Unicode code point 기준 10~24자
          writeOnly: true
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: 앞뒤 공백과 제어문자를 허용하지 않는 표시 이름

    PublicRegistrationResponse:
      type: object
      required: [accountStatus, nextAction]
      additionalProperties: false
      properties:
        accountStatus:
          type: string
          enum: [PENDING_APPROVAL]
        nextAction:
          type: string
          enum: [LOGIN]
          description: 자동 인증 없이 로그인 화면으로 이동하라는 클라이언트 지시

    LoginState:
      type: string
      enum:
        - PASSWORD_CHANGE_REQUIRED
        - MFA_ENROLLMENT_REQUIRED
        - MFA_REQUIRED

    LoginChallengeResponse:
      type: object
      required: [loginState, challengeExpiresAt]
      additionalProperties: false
      properties:
        loginState:
          $ref: "#/components/schemas/LoginState"
        challengeExpiresAt:
          type: string
          format: date-time

    InitialPasswordChangeRequest:
      type: object
      required: [newPassword]
      additionalProperties: false
      properties:
        newPassword:
          type: string
          format: password
          minLength: 10
          maxLength: 24
          description: 조합 규칙 없이 Unicode code point 기준 10~24자
          writeOnly: true

    TotpCodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          writeOnly: true
          description: 로그·오류 응답에 반사하지 않는 6자리 TOTP

    TotpRecoveryRequest:
      type: object
      required: [recoveryCode]
      additionalProperties: false
      properties:
        recoveryCode:
          type: string
          minLength: 22
          maxLength: 22
          pattern: '^(0[1-9]|10)-[A-Z2-7]{4}(?:-[A-Z2-7]{4}){3}$'
          writeOnly: true
          description: 등록 확인 성공 응답에서 한 번만 발급한 위치 식별형 복구 코드

    OwnMfaResetRequest:
      type: object
      required: [currentPassword]
      additionalProperties: false
      description: totpCode와 recoveryCode 중 정확히 하나가 필요합니다.
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 10
          maxLength: 24
          writeOnly: true
        totpCode:
          type: string
          pattern: '^[0-9]{6}$'
          writeOnly: true
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 100
          writeOnly: true
      oneOf:
        - required: [totpCode]
          not:
            required: [recoveryCode]
        - required: [recoveryCode]
          not:
            required: [totpCode]

    AdminMfaResetRequest:
      type: object
      required: [currentPassword, totpCode, reason]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 10
          maxLength: 24
          writeOnly: true
        totpCode:
          type: string
          pattern: '^[0-9]{6}$'
          writeOnly: true
        reason:
          type: string
          minLength: 1
          maxLength: 500

    TotpEnrollmentResponse:
      type: object
      required: [otpauthUri, manualEntryKey, enrollmentExpiresAt]
      additionalProperties: false
      properties:
        otpauthUri:
          type: string
          format: uri
          description: TOTP secret을 포함하는 일회성 등록 URI. 저장·로그 금지.
        manualEntryKey:
          type: string
          description: 일회성 수동 입력키. 저장·로그 금지.
        enrollmentExpiresAt:
          type: string
          format: date-time

    RoleSummary:
      type: object
      required: [roleCode, roleName]
      additionalProperties: false
      properties:
        roleCode:
          type: string
          example: OPERATOR
        roleName:
          type: string
          example: 운영자

    AuthenticatedUser:
      type: object
      required: [userId, displayName, roles, permissions]
      additionalProperties: false
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleSummary"
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PermissionCode"

    MfaProfileStatus:
      type: string
      enum:
        - ENROLLED
        - ENROLLMENT_PENDING
        - NOT_ENROLLED

    MyProfileResponse:
      type: object
      required:
        - userId
        - email
        - displayName
        - roles
        - permissions
        - mfaStatus
      additionalProperties: false
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: string
          maxLength: 100
        departmentName:
          type: string
          maxLength: 100
          nullable: true
        jobTitle:
          type: string
          maxLength: 100
          nullable: true
        officeName:
          type: string
          maxLength: 100
          nullable: true
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleSummary"
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PermissionCode"
        mfaStatus:
          $ref: "#/components/schemas/MfaProfileStatus"
        passwordChangedAt:
          type: string
          format: date-time
          nullable: true
        lastLoginAt:
          type: string
          format: date-time
          nullable: true

    MyPasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 10
          maxLength: 24
          writeOnly: true
        newPassword:
          type: string
          format: password
          minLength: 10
          maxLength: 24
          writeOnly: true
          description: 현재 비밀번호와 달라야 하며 조합 규칙은 적용하지 않음

    AuthenticationResponse:
      type: object
      required: [user, csrfToken, sessionExpiresAt, recoveryCodeUsed]
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/AuthenticatedUser"
        csrfToken:
          type: string
          description: 인증 완료 후 교체된 CSRF 토큰
        sessionExpiresAt:
          type: string
          format: date-time
          description: 서버가 적용하는 세션 절대 만료 시각
        recoveryCodeUsed:
          type: boolean
          default: false

    MfaEnrollmentConfirmationResponse:
      allOf:
        - $ref: "#/components/schemas/AuthenticationResponse"
        - type: object
          required: [recoveryCodes]
          properties:
            recoveryCodes:
              type: array
              minItems: 10
              maxItems: 10
              uniqueItems: true
              description: 한 번만 노출되는 일회용 복구 코드. 저장·로그 금지.
              items:
                type: string
                minLength: 22
                maxLength: 22
                pattern: '^(0[1-9]|10)-[A-Z2-7]{4}(?:-[A-Z2-7]{4}){3}$'

    ReportStatus:
      type: string
      enum:
        - DRAFT
        - IN_REVIEW
        - APPROVED
        - REJECTED

    ReportType:
      type: string
      enum:
        - PERIODIC
        - ISSUE

    ReportCreateRequest:
      type: object
      required: [title, reportType, periodFrom, periodTo, content]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        summary:
          type: string
          maxLength: 255
        reportType:
          $ref: "#/components/schemas/ReportType"
        periodFrom:
          type: string
          format: date-time
        periodTo:
          type: string
          format: date-time
        content:
          type: string
          minLength: 1
        patrolAreaId:
          type: string
          format: uuid
          nullable: true

    ReportUpdateRequest:
      type: object
      required: [expectedVersionNo, content]
      properties:
        expectedVersionNo:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        summary:
          type: string
          maxLength: 255
        content:
          type: string
          minLength: 1
        changeNote:
          type: string
          maxLength: 500

    ReportTransitionRequest:
      type: object
      required: [expectedVersionNo]
      additionalProperties: false
      properties:
        expectedVersionNo:
          type: integer
          minimum: 1

    ReportDecisionRequest:
      type: object
      required: [expectedVersionNo]
      additionalProperties: false
      properties:
        expectedVersionNo:
          type: integer
          minimum: 1
        reason:
          type: string
          maxLength: 500

    ReportRejectionRequest:
      type: object
      required: [expectedVersionNo, reason]
      additionalProperties: false
      properties:
        expectedVersionNo:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 500

    ReportResponse:
      type: object
      required:
        - reportId
        - reportCode
        - title
        - reportType
        - reportStatus
        - currentVersionNo
        - createdAt
        - updatedAt
      properties:
        reportId:
          type: string
          format: uuid
        reportCode:
          type: string
        title:
          type: string
        summary:
          type: string
          nullable: true
        reportType:
          $ref: "#/components/schemas/ReportType"
        reportStatus:
          $ref: "#/components/schemas/ReportStatus"
        currentVersionNo:
          type: integer
          minimum: 1
        approvedBy:
          type: string
          format: uuid
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ErrorCode:
      type: string
      description: 클라이언트 분기에 사용하는 안정적인 UPPER_SNAKE_CASE 오류 코드
      enum:
        - COMMON_INVALID_REQUEST
        - COMMON_MALFORMED_JSON
        - COMMON_VALIDATION_FAILED
        - AUTH_UNAUTHENTICATED
        - AUTH_FORBIDDEN
        - AUTH_PASSWORD_REUSE_NOT_ALLOWED
        - AUTH_MFA_UNAVAILABLE
        - COMMON_RESOURCE_NOT_FOUND
        - ROBOT_NOT_FOUND
        - DEFECT_NOT_FOUND
        - COMMAND_NOT_FOUND
        - REPORT_NOT_FOUND
        - IMAGE_NOT_FOUND
        - COMMON_METHOD_NOT_ALLOWED
        - COMMON_CONFLICT
        - AUTH_EMAIL_ALREADY_REGISTERED
        - COMMAND_STATE_CONFLICT
        - REPORT_STATE_CONFLICT
        - COMMON_PAYLOAD_TOO_LARGE
        - IMAGE_TOO_LARGE
        - COMMON_UNSUPPORTED_MEDIA_TYPE
        - IMAGE_UNSUPPORTED_MEDIA_TYPE
        - COMMON_BUSINESS_RULE_VIOLATION
        - REPORT_PERIOD_INVALID
        - COMMON_RATE_LIMIT_EXCEEDED
        - COMMON_INTERNAL_ERROR
        - COMMON_SERVICE_UNAVAILABLE
        - DB_UNAVAILABLE
        - S3_UNAVAILABLE
        - MQTT_CERTIFICATE_NOT_X509
        - MQTT_SECURITY_CONFIGURATION_INVALID
        - MQTT_UNAVAILABLE

    ValidationErrorDetail:
      type: object
      required:
        - field
        - reason
      properties:
        field:
          type: string
          description: 입력 필드·파라미터 경로. 객체 단위 오류는 $를 사용한다.
          example: title
        constraint:
          type: string
          nullable: true
          description: 실패한 제약 식별자
          example: NotBlank
        rejectedValue:
          type: string
          nullable: true
          maxLength: 200
          description: |
            안전하게 문자열화한 거부 값입니다. 비밀번호, token, secret, API Key,
            Authorization, credential, cookie, session, 파일 및 복합 객체는 null입니다.
          example: ""
        reason:
          type: string
          description: 사용자에게 노출 가능한 필드별 검증 실패 이유
          example: 제목은 필수입니다.

    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - code
        - message
        - path
        - requestId
        - details
      properties:
        timestamp:
          type: string
          format: date-time
          description: 오류 응답을 생성한 UTC 시각
          example: "2026-07-25T10:30:00Z"
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: 실제 HTTP 상태와 같은 값
          example: 400
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: 사용자에게 노출 가능한 전체 오류 요약
          example: 요청 값 검증에 실패했습니다.
        path:
          type: string
          description: query string을 제외한 요청 URI
          example: /api/v1/reports
        requestId:
          type: string
          format: uuid
          description: X-Request-Id 응답 헤더 및 서버 로그와 동일한 요청 식별자
          example: 18c88a89-7d89-4c17-97fa-a6e2253614d9
        details:
          type: array
          description: Validation 상세. 해당 사항이 없으면 빈 배열이다.
          items:
            $ref: "#/components/schemas/ValidationErrorDetail"

  headers:
    RequestId:
      description: 응답 본문 requestId 및 서버 로그와 동일한 요청 식별자
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: 요청 형식·타입·필수값 또는 Validation 오류
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validationFailed:
              value:
                timestamp: "2026-07-25T10:30:00Z"
                status: 400
                code: COMMON_VALIDATION_FAILED
                message: 요청 값 검증에 실패했습니다.
                path: /api/v1/reports
                requestId: 18c88a89-7d89-4c17-97fa-a6e2253614d9
                details:
                  - field: title
                    constraint: NotBlank
                    rejectedValue: ""
                    reason: 제목은 필수입니다.

    Unauthorized:
