          format: uuid
          description: X-Request-Id 응답 헤더 및 서버 로그와 동일한 요청 식별자
          example: 18c88a89-7d89-4c17-97fa-a6e2253614d9
        details:
          type: array
          description: Validation 상세. 해당 사항이 없으면 빈 배열이다.
          items:
            $ref: "#/components/schemas/ValidationErrorDetail"

  headers:
    RequestId:
      description: 응답 본문 requestId 및 서버 로그와 동일한 요청 식별자
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: 요청 형식·타입·필수값 또는 Validation 오류
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validationFailed:
              value:
                timestamp: "2026-07-25T10:30:00Z"
                status: 400
                code: COMMON_VALIDATION_FAILED
                message: 요청 값 검증에 실패했습니다.
                path: /api/v1/reports
                requestId: 18c88a89-7d89-4c17-97fa-a6e2253614d9
                details:
                  - field: title
                    constraint: NotBlank
                    rejectedValue: ""
                    reason: 제목은 필수입니다.

    StatisticsBadRequest:
      description: |
        from·to 누락 또는 날짜·UUID 형식 오류, page·size·granularity
        Validation 오류, endpoint 계약에 없는 query parameter
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            malformedTimestamp:
              value:
                timestamp: "2026-07-29T01:00:00Z"
                status: 400
                code: COMMON_INVALID_REQUEST
                message: 요청 값이 올바르지 않습니다.
                path: /api/v1/statistics/by-status
                requestId: 18c88a89-7d89-4c17-97fa-a6e2253614d9
                details:
                  - field: from
                    constraint: Type
                    rejectedValue: "2026-07-01"
                    reason: ISO-8601 timestamp 형식이어야 합니다.
            malformedPatrolAreaId:
              value:
                timestamp: "2026-07-29T01:00:00Z"
                status: 400
                code: COMMON_INVALID_REQUEST
                message: 요청 값이 올바르지 않습니다.
                path: /api/v1/statistics/by-area
                requestId: 18c88a89-7d89-4c17-97fa-a6e2253614d9
                details:
                  - field: patrolAreaId
                    constraint: Type
                    rejectedValue: not-a-uuid
                    reason: UUID 형식이어야 합니다.

    Unauthorized:
      description: 인증정보 불일치, 인증 필요, 만료·폐기 세션 또는 MFA 미완료
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2026-07-25T10:30:00Z"
            status: 401
            code: AUTH_UNAUTHENTICATED
            message: 인증이 필요합니다.
            path: /api/v1/auth/me
            requestId: 18c88a89-7d89-4c17-97fa-a6e2253614d9
            details: []

    Forbidden:
      description: 권한 부족 또는 CSRF 토큰 누락·불일치
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2026-07-25T10:30:00Z"
            status: 403
            code: AUTH_FORBIDDEN
            message: 요청을 수행할 권한이 없습니다.
            path: /api/v1/admin/roles
            requestId: 18c88a89-7d89-4c17-97fa-a6e2253614d9
            details: []

    NotFound:
      description: 요청한 리소스 없음
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    StatisticsPatrolAreaNotFound:
      description: 통계 필터의 순찰 구역이 존재하지 않음
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2026-07-29T01:00:00Z"
            status: 404
            code: PATROL_AREA_NOT_FOUND
            message: 순찰 구역을 찾을 수 없습니다.
            path: /api/v1/statistics/by-area
            requestId: 18c88a89-7d89-4c17-97fa-a6e2253614d9
            details: []

    MethodNotAllowed:
      description: 지원하지 않는 HTTP 메서드
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: 중복 또는 현재 리소스 상태와 충돌
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    PayloadTooLarge:
      description: 이미지 크기 상한 초과
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    UnsupportedMediaType:
      description: 지원하지 않는 Content-Type 또는 콘텐츠 형식
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    UnprocessableEntity:
      description: 형식은 유효하지만 업무 규칙을 충족하지 않음
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    StatisticsPeriodInvalid:
      description: |
        from이 to보다 이르지 않거나 두 Instant의 차이가 366일을 초과함
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2026-07-29T01:00:00Z"
            status: 422
            code: STATISTICS_PERIOD_INVALID
            message: 통계 조회 기간이 올바르지 않습니다.
            path: /api/v1/statistics/by-period
            requestId: 18c88a89-7d89-4c17-97fa-a6e2253614d9
            details: []

    TooManyRequests:
      description: 요청 한도 초과
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          description: 다시 시도할 수 있을 때까지 남은 초
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2026-07-25T10:30:00Z"
            status: 429
            code: COMMON_RATE_LIMIT_EXCEEDED
            message: 잠시 후 다시 시도해 주세요.
            path: /api/v1/auth/login
            requestId: 18c88a89-7d89-4c17-97fa-a6e2253614d9
            details: []

    InternalServerError:
      description: 예상하지 못한 서버 오류
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    BadGateway:
      description: 외부 LLM 응답이 계약을 충족하지 않음
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2026-07-30T01:00:00Z"
            status: 502
            code: LLM_RESPONSE_INVALID
            message: LLM 응답을 안전한 보고서로 변환할 수 없습니다.
            path: /api/v1/reports
            requestId: 18c88a89-7d89-4c17-97fa-a6e2253614d9
            details: []

    ServiceUnavailable:
      description: DB·S3·MQTT·LLM 등 주요 구성요소 장애
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
