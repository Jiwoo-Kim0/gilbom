openapi: 3.0.3
info:
  title: 길봄 API
  version: 1.0.0
  description: |
    길봄 REST API의 공통 응답·오류와 Day 1 인증·권한·보고서 상태 계약입니다.
    성공 응답은 공통 envelope 없이 실제 DTO를 직접 반환합니다.
    세부 정책은 docs의 주제별 Markdown 정본을 함께 기준으로 합니다.

tags:
  - name: Auth
    description: 관리자 서버 세션·CSRF·TOTP 인증
  - name: Admin
    description: 가입 승인·사용자·RBAC·로봇 배정 관리자 API
  - name: Robots
    description: 로봇 기준정보 등록 및 관제
  - name: Missions
    description: 순찰 구역·경로 조회와 Mission 생성·조회·상태 관리
  - name: Statistics
    description: UTC 기간 기준 순찰·Incident·결함 집계 조회
  - name: Reports
    description: 보고서 생성·버전·검토·승인 상태 계약
  - name: Audit
    description: 추가 전용 보안·업무 감사 로그 조회

x-api-conventions:
  successResponse:
    envelope: false
    description: 성공 응답은 실제 DTO를 직접 반환한다.
  errorResponse:
    schema: "#/components/schemas/ErrorResponse"
    requestIdHeader: X-Request-Id
  validation:
    badRequest: 필드·파라미터·JSON 형식 오류
    conflict: 현재 리소스 상태 또는 기존 데이터와 충돌
    unprocessableEntity: 형식은 유효하지만 업무 규칙 위반
  authentication:
    type: server-session
    productionCookie: __Host-GILBOM_SESSION
    csrfHeader: X-CSRF-TOKEN
    mfa: TOTP required for every administrator
    idleTimeout: PT30M
    absoluteTimeout: PT8H
    preAuthenticationChallengeTimeout: PT5M
    maximumAuthenticatedSessionsPerUser: 1
    csrfClientStorage: memory-only
    ipAuthenticationRateLimit:
      maximumRequests: 20
      window: PT1M
    passwordFailureLimit:
      maximumFailures: 5
      window: PT15M
      temporaryLock: PT15M
    mfaFailureLimit:
      maximumFailures: 5
      window: PT15M
      temporaryLock: PT15M
  authorization:
    model: RBAC permission plus resource scope
    default: deny
    source: authorization-matrix.md
    multiplePermissionExtension:
      field: x-required-permissions
      semantics: 배열에 선언된 모든 권한을 보유해야 한다.

x-statistics-conventions:
  timezone: UTC
  interval: "[from,to)"
  maximumDuration: P366D
  periodGranularity: DAY
  areaPagination:
    pageBase: 0
    defaultSize: 20
    maximumSize: 100

x-contract-sources:
  common: common-api-response-and-errors.md
  api: api-contract.md
  authentication: admin-authentication-security.md
  session: session-cookie-csrf.md
  authenticationDefense: authentication-rate-limit-lock-audit.md
  authorization: authorization-matrix.md
  statistics: statistics-api-contract.md
  administration: admin-api.md
  reportStatus: report-status-contract.md
  environment: environment-configuration-strategy.md
  endpointDtoBaseline: ../../docs/길봄_MQTT 통신_SWAGGER REST SSE_API 명세서.pdf
  migrationRule: 구현하는 endpoint는 같은 변경에서 이 OpenAPI에 operation과 schema를 완성한다.

paths:
  /api/v1/auth/csrf-token:
    get:
      tags: [Auth]
      operationId: issueCsrfToken
      summary: 익명 또는 인증 세션의 CSRF 토큰 발급
      description: |
        로그인 전에도 호출할 수 있습니다. 세션에 토큰을 저장하고 응답은
        Cache-Control: no-store로 전달합니다.
      security: []
      responses:
        "200":
          description: CSRF 토큰 발급
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/email-availability:
    post:
      tags: [Auth]
      operationId: checkRegistrationEmailAvailability
      summary: 회원가입 이메일 중복 확인
      description: |
        이메일이 URL·프록시 access log에 남지 않도록 JSON body를 사용합니다.
        결과는 UX 보조 정보이며 가입 시 DB UNIQUE 제약으로 다시 확인합니다.
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailAvailabilityRequest"
      responses:
        "200":
          description: 이메일 사용 가능 여부
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAvailabilityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/registrations:
    post:
      tags: [Auth]
      operationId: registerPublicAccount
      summary: 공개 회원가입
      description: |
        계정을 PENDING_APPROVAL·역할 없음으로 생성합니다. 인증 세션이나 업무 권한을
        만들지 않으며 클라이언트는 가입 안내 후 로그인 화면으로 이동합니다.
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicRegistrationRequest"
      responses:
        "201":
          description: 승인 대기 회원가입 생성
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRegistrationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/session-state:
    get:
      tags: [Auth]
      operationId: getAuthenticationSessionState
      summary: 브라우저 세션 인증 진행 상태 복원
      description: |
        새로고침 후 쿠키에 결합된 익명·초기 비밀번호 변경·MFA 대기·인증 완료 상태를
        복원합니다. 사용자 ID, 이메일, 역할과 권한은 반환하지 않습니다.
      security:
        - serverSession: []
      responses:
        "200":
          description: 현재 브라우저 세션의 인증 진행 상태
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationSessionStateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 관리자 이메일·비밀번호 검증
      description: |
        성공해도 업무 권한을 부여하지 않고 비밀번호 변경 또는 MFA 다음 상태를 반환합니다.
        익명 세션에 결합된 CSRF 토큰이 필요합니다.
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "202":
          description: 비밀번호 검증 성공, 초기 비밀번호 변경 또는 MFA 단계 필요
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginChallengeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/password/initial-change:
    post:
      tags: [Auth]
      operationId: changeInitialPassword
      summary: 초기 비밀번호 변경
      description: |
        PASSWORD_CHANGE_REQUIRED 세션에서만 호출할 수 있습니다. 성공해도 인증을
        완료하지 않고 MFA_ENROLLMENT_REQUIRED 상태를 202로 반환합니다.
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitialPasswordChangeRequest"
      responses:
        "202":
          description: 초기 비밀번호 변경 완료, TOTP 등록 필요
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginChallengeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/mfa/totp/enroll:
    post:
      tags: [Auth]
      operationId: enrollTotp
      summary: TOTP 등록 정보 일회성 발급
      description: |
        MFA_ENROLLMENT_REQUIRED 세션에서만 호출할 수 있습니다.
        기존 미확인 등록 정보는 폐기되고 새 AES-GCM 암호문이 저장됩니다.
        응답의 otpauth URI와 수동 입력키는 로그·브라우저 저장소에 보관하면 안 됩니다.
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: TOTP 등록 정보 발급
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/mfa/totp/confirm:
    post:
      tags: [Auth]
      operationId: confirmTotpEnrollment
      summary: 첫 TOTP 코드 확인 및 등록 완료
      description: |
        MFA_ENROLLMENT_REQUIRED 세션에서 첫 TOTP를 검증합니다.
        성공할 때 factor 활성화, 복구 코드 hash 저장, 기존 세션 폐기,
        현재 세션 ID·CSRF 교체를 함께 완료합니다.
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
      responses:
        "200":
          description: TOTP 등록과 인증 완료, 복구 코드 일회성 발급
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaEnrollmentConfirmationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/mfa/totp/verify:
    post:
      tags: [Auth]
      operationId: verifyTotp
      summary: 로그인 TOTP 검증
      description: |
        MFA_REQUIRED 세션에서 RFC 6238 TOTP를 검증합니다.
        현재 30초 time-step과 앞뒤 1개만 허용하며 이미 성공한 step은 재사용할 수 없습니다.
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
      responses:
        "200":
          description: MFA와 관리자 인증 완료
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/mfa/recovery:
    post:
      tags: [Auth]
      operationId: verifyMfaRecoveryCode
      summary: 일회용 복구 코드 검증
      description: |
        MFA_REQUIRED 세션에서 미사용 복구 코드를 검증하고 원자적으로 소비합니다.
        성공한 코드는 다시 사용할 수 없으며 응답의 recoveryCodeUsed는 true입니다.
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpRecoveryRequest"
      responses:
        "200":
          description: 복구 코드 소비 및 관리자 인증 완료
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 세션 폐기 및 로그아웃
      description: |
        인증 완료 또는 pre-auth challenge 세션을 서버에서 폐기하고 세션 쿠키를
        Max-Age=0으로 만료합니다. 폐기한 세션 ID는 다시 사용할 수 없습니다.
        SPA는 204 응답 후 기존 메모리 CSRF 토큰을 폐기하고 공개 CSRF 발급 API를
        호출하여 새 익명 세션의 토큰으로 교체합니다.
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: 로그아웃 완료
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Set-Cookie:
              schema:
                type: string
              description: 동일한 이름·Path의 세션 쿠키를 Max-Age=0으로 만료
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: 현재 인증 관리자와 유효 권한 조회
      security:
        - serverSession: []
      responses:
        "200":
          description: 현재 관리자
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/my/profile:
    get:
      tags: [Auth]
      operationId: getMyProfile
      summary: 현재 관리자 마이페이지 프로필 조회
      description: |
        이메일, 표시 이름, 조직 정보, 역할·권한, MFA 상태와 비밀번호·최근 로그인
        시각만 반환합니다. 비밀번호 hash, TOTP secret, 복구 코드, 세션·CSRF는 반환하지
        않습니다.
      security:
        - serverSession: []
      responses:
        "200":
          description: 현재 관리자 프로필
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/my/password:
    patch:
      tags: [Auth]
      operationId: changeMyPassword
      summary: 현재 관리자 비밀번호 변경
      description: |
        현재 비밀번호를 재검증하고 새 비밀번호를 중앙 Argon2id 설정으로 hash합니다.
        성공하면 모든 서버 세션을 폐기하고 현재 세션 쿠키도 만료하므로 다시 로그인해야
        합니다.
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MyPasswordChangeRequest"
      responses:
        "204":
          description: 비밀번호 변경과 모든 세션 폐기 완료
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Set-Cookie:
              schema:
                type: string
              description: 동일한 이름·Path의 세션 쿠키를 Max-Age=0으로 만료
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/my/mfa/totp/reset:
    post:
      tags: [Auth]
      operationId: resetOwnTotp
      summary: 본인 TOTP 교체 시작
      description: |
        현재 비밀번호와 현재 TOTP 또는 미사용 복구 코드를 검증합니다.
        성공하면 기존 factor와 세션을 폐기하고 MFA_ENROLLMENT_REQUIRED 상태로 전환합니다.
      security:
        - serverSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnMfaResetRequest"
      responses:
        "202":
