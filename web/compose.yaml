name: ${COMPOSE_PROJECT_NAME:-gilbom}

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    user: "1883:1883"
    depends_on:
      mqtt-init:
        condition: service_completed_successfully
    ports:
      # 기본은 localhost 전용이다. 팀원 PC와 LAN 통신할 때만 MQTT_BIND_ADDRESS=0.0.0.0으로 바꾼다.
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:${MQTT_TLS_PORT:-8883}:8883"
    volumes:
      - ./infra/mosquitto/local/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/local/runtime:/mosquitto/local:ro
    read_only: true
    tmpfs:
      - /tmp
      - /mosquitto/data
      - /mosquitto/log
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  db:
    # PostgreSQL과 PostGIS 버전을 한 이미지 태그로 고정해 개발자별 공간 기능 차이를 막는다.
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gilbom}
      # Bootstrap 관리 계정은 role/schema 준비에만 사용하고 애플리케이션에는 전달하지 않는다.
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-gilbom_db_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD must be set}
      POSTGRES_FLYWAY_USER: ${POSTGRES_FLYWAY_USER:-gilbom_flyway}
      POSTGRES_FLYWAY_PASSWORD: ${POSTGRES_FLYWAY_PASSWORD:?POSTGRES_FLYWAY_PASSWORD must be set}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-gilbom_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      TZ: ${TZ:-UTC}
      PGTZ: ${TZ:-UTC}
    ports:
      # 개발 DB가 외부 네트워크에 노출되지 않도록 로컬 호스트에서만 접근을 허용한다.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 컨테이너를 재생성해도 DB 데이터가 유지되도록 Compose named volume을 사용한다.
      - postgres_data:/var/lib/postgresql/data
      # 빈 DB 최초 기동 때 Flyway 계정과 runtime 계정을 서로 다른 role로 준비한다.
      - ./infra/postgres/init/20-create-application-roles.sh:/docker-entrypoint-initdb.d/20-create-application-roles.sh:ro
    healthcheck:
      # 서버 readiness뿐 아니라 대상 DB 접속과 PostGIS 확장 초기화까지 확인한다.
      test:
        - CMD-SHELL
        - >-
          pg_isready --host 127.0.0.1 --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
          && PGPASSWORD="$${POSTGRES_PASSWORD}" psql --host 127.0.0.1
          --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}" --no-password
          --tuples-only --command 'SELECT PostGIS_Version();' > /dev/null
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gilbom-backend:local
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local,docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-gilbom}
      # Runtime 계정은 DML만, Flyway 계정은 migration DDL만 수행한다.
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_APP_USER:-gilbom_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set}
      SPRING_FLYWAY_USER: ${POSTGRES_FLYWAY_USER:-gilbom_flyway}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_FLYWAY_PASSWORD:?POSTGRES_FLYWAY_PASSWORD must be set}
      GILBOM_MAX_REQUEST_BODY_SIZE: ${GILBOM_MAX_REQUEST_BODY_SIZE:-1MB}
      GILBOM_MAX_REQUEST_HEADER_SIZE: ${GILBOM_MAX_REQUEST_HEADER_SIZE:-16KB}
      GILBOM_MAX_UPLOAD_FILE_SIZE: ${GILBOM_MAX_UPLOAD_FILE_SIZE:-500KB}
      # TOTP keyring 원문은 이미지나 DB가 아니라 실행 환경에서만 주입한다.
      MFA_TOTP_SECRET_ENCRYPTION_ENABLED: ${MFA_TOTP_SECRET_ENCRYPTION_ENABLED:-false}
      MFA_TOTP_SECRET_ACTIVE_KEY_VERSION: ${MFA_TOTP_SECRET_ACTIVE_KEY_VERSION:-1}
      MFA_TOTP_SECRET_KEYRING: ${MFA_TOTP_SECRET_KEYRING:-}
      MQTT_BROKER: ${MQTT_BROKER:-ssl://mosquitto:8883}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-gilbom-local-docker}
      MQTT_USERNAME: ${MQTT_USERNAME:-gilbom}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD must be set}
      MQTT_TRUST_CERTIFICATE: ${MQTT_TRUST_CERTIFICATE:-/app/config/mqtt/certs/local-ca-cert.pem}
      MQTT_SUBSCRIBE_TOPIC: ${MQTT_SUBSCRIBE_TOPIC:-tbs/v2/robots/+/presence,tbs/v2/robots/+/state,tbs/v2/robots/+/telemetry,tbs/v2/robots/+/events/#,tbs/v2/robots/+/commands/result}
      MQTT_PUBLISH_TOPIC: ${MQTT_PUBLISH_TOPIC:-tbs/v2/robots/robot-test/commands/request}
      MQTT_QOS: ${MQTT_QOS:-1}
      TZ: ${TZ:-UTC}
    volumes:
      - ./infra/mosquitto/local/runtime/certs:/app/config/mqtt/certs:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8080/actuator/health/readiness
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: gilbom-frontend:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Generates the local CA, CA-signed broker certificate, and password file.
  mqtt-init:
    build:
      context: ./infra/mosquitto/local
      dockerfile: Dockerfile.init
    image: gilbom-mqtt-init:local
    restart: "no"
    user: "0:0"
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-gilbom}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD must be set}
      MQTT_ROBOT_USERNAME: ${MQTT_ROBOT_USERNAME:-robot-test}
      MQTT_ROBOT_PASSWORD: ${MQTT_ROBOT_PASSWORD:?MQTT_ROBOT_PASSWORD must be set}
      # 외부 로봇이 IP로 TLS 검증할 때 Broker 인증서 SAN에 포함할 현재 PC의 LAN IPv4다.
      MQTT_LAN_IP: ${MQTT_LAN_IP:-}
      # ngrok TCP 등 외부 hostname으로 접속할 때 Broker 인증서 DNS SAN에 포함한다.
      MQTT_PUBLIC_HOSTNAME: ${MQTT_PUBLIC_HOSTNAME:-}
    volumes:
      - ./infra/mosquitto/local:/mqtt-local
      - ./infra/mosquitto/acl:/mqtt-input/acl:ro
    # 재실행 때 이전 임시 passwd 파일이 남지 않도록 컨테이너 정지 시 폐기되는 tmpfs를 사용한다.
    tmpfs:
      - /tmp
    command:
      - /bin/sh
      - /mqtt-local/init-local-mqtt.sh
    networks:
      - backend

volumes:
  # Docker가 관리하는 영속 볼륨이며 `docker compose down`만으로는 삭제되지 않는다.
  postgres_data:

networks:
  backend:
    driver: bridge
