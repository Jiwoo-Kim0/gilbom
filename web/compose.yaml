name: ${COMPOSE_PROJECT_NAME:-gilbom}

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    user: "1883:1883"
    entrypoint:
      - /bin/sh
      - /mosquitto/config/run-local-mosquitto.sh
    depends_on:
      mqtt-init:
        condition: service_completed_successfully
    ports:
      # 기본은 localhost 전용이다. 팀원 PC와 LAN 통신할 때만 MQTT_BIND_ADDRESS=0.0.0.0으로 바꾼다.
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:${MQTT_TLS_PORT:-8883}:8883"
    volumes:
      - ./infra/mosquitto/local/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/local/run-local-mosquitto.sh:/mosquitto/config/run-local-mosquitto.sh:ro
      - ./infra/mosquitto/local/runtime:/mosquitto/local:ro
    read_only: true
    tmpfs:
      - /tmp
      - /mosquitto/data
      - /mosquitto/log
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  db:
    # PostgreSQL과 PostGIS 버전을 한 이미지 태그로 고정해 개발자별 공간 기능 차이를 막는다.
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gilbom}
      # Bootstrap 관리 계정은 role/schema 준비에만 사용하고 애플리케이션에는 전달하지 않는다.
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-gilbom_db_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD must be set}
      POSTGRES_FLYWAY_USER: ${POSTGRES_FLYWAY_USER:-gilbom_flyway}
      POSTGRES_FLYWAY_PASSWORD: ${POSTGRES_FLYWAY_PASSWORD:?POSTGRES_FLYWAY_PASSWORD must be set}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-gilbom_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      TZ: ${TZ:-UTC}
      PGTZ: ${TZ:-UTC}
    ports:
      # 개발 DB가 외부 네트워크에 노출되지 않도록 로컬 호스트에서만 접근을 허용한다.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 컨테이너를 재생성해도 DB 데이터가 유지되도록 Compose named volume을 사용한다.
      - postgres_data:/var/lib/postgresql/data
      # 빈 DB 최초 기동 때 Flyway 계정과 runtime 계정을 서로 다른 role로 준비한다.
      - ./infra/postgres/init/20-create-application-roles.sh:/docker-entrypoint-initdb.d/20-create-application-roles.sh:ro
    healthcheck:
      # 서버 readiness뿐 아니라 대상 DB 접속과 PostGIS 확장 초기화까지 확인한다.
      test:
        - CMD-SHELL
        - >-
          pg_isready --host 127.0.0.1 --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
          && PGPASSWORD="$${POSTGRES_PASSWORD}" psql --host 127.0.0.1
          --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}" --no-password
          --tuples-only --command 'SELECT PostGIS_Version();' > /dev/null
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gilbom-backend:local
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local,docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-gilbom}
      # Runtime 계정은 DML만, Flyway 계정은 migration DDL만 수행한다.
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_APP_USER:-gilbom_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set}
      SPRING_FLYWAY_USER: ${POSTGRES_FLYWAY_USER:-gilbom_flyway}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_FLYWAY_PASSWORD:?POSTGRES_FLYWAY_PASSWORD must be set}
      GILBOM_MAX_REQUEST_BODY_SIZE: ${GILBOM_MAX_REQUEST_BODY_SIZE:-1MB}
      GILBOM_MAX_REQUEST_HEADER_SIZE: ${GILBOM_MAX_REQUEST_HEADER_SIZE:-16KB}
      GILBOM_MAX_UPLOAD_FILE_SIZE: ${GILBOM_MAX_UPLOAD_FILE_SIZE:-500KB}
      GILBOM_REPORT_PDF_STORAGE_ROOT: ${GILBOM_REPORT_PDF_STORAGE_ROOT:-/app/data/report-pdf}
      GILBOM_STORAGE_LOCAL_ROOT_DIRECTORY: ${GILBOM_STORAGE_LOCAL_ROOT_DIRECTORY:-/app/data/robot-images}
      GILBOM_STORAGE_URL_SIGNING_KEY_BASE64: ${GILBOM_STORAGE_URL_SIGNING_KEY_BASE64:-}
      # 기본은 Nginx same-origin 전용이다. true일 때만 정확한 Origin 목록을 전달한다.
      GILBOM_CORS_ENABLED: ${GILBOM_CORS_ENABLED:-false}
      GILBOM_CORS_ALLOWED_ORIGINS: ${GILBOM_CORS_ALLOWED_ORIGINS:-}
      GILBOM_CORS_ALLOW_CREDENTIALS: ${GILBOM_CORS_ALLOW_CREDENTIALS:-true}
      GILBOM_SESSION_IDLE_TIMEOUT: ${GILBOM_SESSION_IDLE_TIMEOUT:-30m}
      GILBOM_SESSION_ABSOLUTE_TIMEOUT: ${GILBOM_SESSION_ABSOLUTE_TIMEOUT:-8h}
      GILBOM_MFA_CHALLENGE_TIMEOUT: ${GILBOM_MFA_CHALLENGE_TIMEOUT:-5m}
      GILBOM_SESSION_MAX_CONCURRENT: ${GILBOM_SESSION_MAX_CONCURRENT:-1}
      GILBOM_MFA_CHALLENGE_MAX_FAILURES: ${GILBOM_MFA_CHALLENGE_MAX_FAILURES:-5}
      GILBOM_SESSION_CLEANUP_INTERVAL: ${GILBOM_SESSION_CLEANUP_INTERVAL:-1m}
      GILBOM_SESSION_CLEANUP_BATCH_SIZE: ${GILBOM_SESSION_CLEANUP_BATCH_SIZE:-1000}
      # 정책 조건이 하나라도 빠지면 서버 기동은 유지하고 LLM client만 비활성화한다.
      GILBOM_LLM_ENABLED: ${GILBOM_LLM_ENABLED:-false}
      GILBOM_LLM_PROVIDER: ${GILBOM_LLM_PROVIDER:-}
      GILBOM_LLM_BASE_URL: ${GILBOM_LLM_BASE_URL:-https://gms.ssafy.io/gmsapi/api.openai.com/v1}
      GILBOM_LLM_MODEL: ${GILBOM_LLM_MODEL:-}
      GILBOM_LLM_API_KEY: ${GILBOM_LLM_API_KEY:-}
      GILBOM_LLM_CONNECT_TIMEOUT: ${GILBOM_LLM_CONNECT_TIMEOUT:-3s}
      GILBOM_LLM_READ_TIMEOUT: ${GILBOM_LLM_READ_TIMEOUT:-30s}
      GILBOM_LLM_MAX_OUTPUT_TOKENS: ${GILBOM_LLM_MAX_OUTPUT_TOKENS:-1500}
      GILBOM_LLM_DAILY_REQUEST_LIMIT: ${GILBOM_LLM_DAILY_REQUEST_LIMIT:-0}
      GILBOM_LLM_DAILY_BUDGET: ${GILBOM_LLM_DAILY_BUDGET:-0}
      GILBOM_LLM_MAX_CONCURRENT_REQUESTS: ${GILBOM_LLM_MAX_CONCURRENT_REQUESTS:-5}
      GILBOM_LLM_PROMPT_VERSION: ${GILBOM_LLM_PROMPT_VERSION:-}
      GILBOM_LLM_POLICY_APPROVED: ${GILBOM_LLM_POLICY_APPROVED:-false}
      GILBOM_LLM_TRAINING_EXCLUSION_APPROVED: ${GILBOM_LLM_TRAINING_EXCLUSION_APPROVED:-false}
      GILBOM_LLM_DATA_RETENTION_APPROVED: ${GILBOM_LLM_DATA_RETENTION_APPROVED:-false}
      GILBOM_LLM_OUTBOUND_ALLOWLIST_APPLIED: ${GILBOM_LLM_OUTBOUND_ALLOWLIST_APPLIED:-false}
      GILBOM_LLM_IMAGE_INPUT_ENABLED: ${GILBOM_LLM_IMAGE_INPUT_ENABLED:-false}
      GILBOM_LLM_IMAGE_DEIDENTIFICATION_APPROVED: ${GILBOM_LLM_IMAGE_DEIDENTIFICATION_APPROVED:-false}
      # 초기 관리자 bootstrap은 기본 비활성화하며 실제 값은 ignored .env/외부 Secret에서만 받는다.
      INITIAL_ADMIN_BOOTSTRAP_ENABLED: ${INITIAL_ADMIN_BOOTSTRAP_ENABLED:-false}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_DISPLAY_NAME: ${INITIAL_ADMIN_DISPLAY_NAME:-}
      INITIAL_ADMIN_USER_CODE: ${INITIAL_ADMIN_USER_CODE:-}
      # IP 원문 대신 persistent HMAC bucket을 사용한다. 운영에서는 반드시 외부 Secret을 설정한다.
      AUTH_RATE_LIMIT_HMAC_KEY_VERSION: ${AUTH_RATE_LIMIT_HMAC_KEY_VERSION:-1}
      AUTH_RATE_LIMIT_HMAC_KEY_BASE64: ${AUTH_RATE_LIMIT_HMAC_KEY_BASE64:-}
      AUTH_CSRF_TOKEN_ISSUANCE_MAX_REQUESTS: ${AUTH_CSRF_TOKEN_ISSUANCE_MAX_REQUESTS:-60}
      AUTH_CSRF_TOKEN_ISSUANCE_WINDOW: ${AUTH_CSRF_TOKEN_ISSUANCE_WINDOW:-1m}
      AUTH_EMAIL_AVAILABILITY_MAX_REQUESTS: ${AUTH_EMAIL_AVAILABILITY_MAX_REQUESTS:-20}
      AUTH_EMAIL_AVAILABILITY_WINDOW: ${AUTH_EMAIL_AVAILABILITY_WINDOW:-1m}
      AUTH_REGISTRATION_MAX_REQUESTS: ${AUTH_REGISTRATION_MAX_REQUESTS:-5}
      AUTH_REGISTRATION_WINDOW: ${AUTH_REGISTRATION_WINDOW:-1h}
      AUTH_IP_MAX_REQUESTS: ${AUTH_IP_MAX_REQUESTS:-20}
      AUTH_IP_WINDOW: ${AUTH_IP_WINDOW:-1m}
      AUTH_PASSWORD_MAX_FAILURES: ${AUTH_PASSWORD_MAX_FAILURES:-5}
      AUTH_PASSWORD_FAILURE_WINDOW: ${AUTH_PASSWORD_FAILURE_WINDOW:-15m}
      AUTH_MFA_MAX_FAILURES: ${AUTH_MFA_MAX_FAILURES:-5}
      AUTH_MFA_FAILURE_WINDOW: ${AUTH_MFA_FAILURE_WINDOW:-15m}
      AUTH_TEMPORARY_LOCK_DURATION: ${AUTH_TEMPORARY_LOCK_DURATION:-15m}
      AUTH_RATE_LIMIT_CLEANUP_INTERVAL: ${AUTH_RATE_LIMIT_CLEANUP_INTERVAL:-10m}
      AUTH_RATE_LIMIT_CLEANUP_BATCH_SIZE: ${AUTH_RATE_LIMIT_CLEANUP_BATCH_SIZE:-1000}
      # TOTP keyring 원문은 이미지나 DB가 아니라 실행 환경에서만 주입한다.
      MFA_TOTP_SECRET_ENCRYPTION_ENABLED: ${MFA_TOTP_SECRET_ENCRYPTION_ENABLED:-false}
      MFA_TOTP_SECRET_ACTIVE_KEY_VERSION: ${MFA_TOTP_SECRET_ACTIVE_KEY_VERSION:-1}
      MFA_TOTP_SECRET_KEYRING: ${MFA_TOTP_SECRET_KEYRING:-}
      MQTT_BROKER: ${MQTT_BROKER:-ssl://mosquitto:8883}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-gilbom-local-docker}
      MQTT_USERNAME: ${MQTT_USERNAME:-gilbom}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD must be set}
      MQTT_TRUST_CERTIFICATE: ${MQTT_TRUST_CERTIFICATE:-/app/config/mqtt/certs/local-ca-cert.pem}
      MQTT_SUBSCRIBE_TOPIC: ${MQTT_SUBSCRIBE_TOPIC:-tbs/v2/robots/+/presence,tbs/v2/robots/+/state,tbs/v2/robots/+/telemetry,tbs/v2/robots/+/events/#,tbs/v2/robots/+/commands/result}
      MQTT_PUBLISH_TOPIC: ${MQTT_PUBLISH_TOPIC:-tbs/v2/robots/robot-test/commands/request}
      MQTT_QOS: ${MQTT_QOS:-1}
      MQTT_PUBLIC_BROKER_URI: ${MQTT_PUBLIC_BROKER_URI:-ssl://localhost:8883}
      MQTT_CREDENTIAL_PROVISIONING_ENABLED: ${MQTT_CREDENTIAL_PROVISIONING_ENABLED:-true}
      MQTT_CREDENTIAL_PASSWORD_FILE: ${MQTT_CREDENTIAL_PASSWORD_FILE:-/app/config/mqtt/credentials/passwd}
      MQTT_CREDENTIAL_PASSWORD_COMMAND: ${MQTT_CREDENTIAL_PASSWORD_COMMAND:-mosquitto_passwd}
      TZ: ${TZ:-UTC}
    volumes:
      - ./infra/mosquitto/local/runtime/certs:/app/config/mqtt/certs:ro
      - ./infra/mosquitto/local/runtime/credentials:/app/config/mqtt/credentials
      - report_pdf_data:/app/data/report-pdf
      - robot_images:/app/data/robot-images
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8080/actuator/health/readiness
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_NAVER_MAP_CLIENT_ID: ${VITE_NAVER_MAP_CLIENT_ID:?VITE_NAVER_MAP_CLIENT_ID is required}
    image: gilbom-frontend:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Generates the local CA, CA-signed broker certificate, and password file.
  mqtt-init:
    build:
      context: ./infra/mosquitto/local
      dockerfile: Dockerfile.init
    image: gilbom-mqtt-init:local
    restart: "no"
    user: "0:0"
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-gilbom}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD must be set}
      MQTT_ROBOT_USERNAME: ${MQTT_ROBOT_USERNAME:-robot-test}
      MQTT_ROBOT_PASSWORD: ${MQTT_ROBOT_PASSWORD:?MQTT_ROBOT_PASSWORD must be set}
      # 외부 로봇이 IP로 TLS 검증할 때 Broker 인증서 SAN에 포함할 현재 PC의 LAN IPv4다.
      MQTT_LAN_IP: ${MQTT_LAN_IP:-}
      # ngrok TCP 등 외부 hostname으로 접속할 때 Broker 인증서 DNS SAN에 포함한다.
      MQTT_PUBLIC_HOSTNAME: ${MQTT_PUBLIC_HOSTNAME:-}
    volumes:
      - ./infra/mosquitto/local:/mqtt-local
      - ./infra/mosquitto/acl:/mqtt-input/acl:ro
    # 재실행 때 이전 임시 passwd 파일이 남지 않도록 컨테이너 정지 시 폐기되는 tmpfs를 사용한다.
    tmpfs:
      - /tmp
    command:
      - /bin/sh
      - /mqtt-local/init-local-mqtt.sh
    networks:
      - backend

volumes:
  # Docker가 관리하는 영속 볼륨이며 `docker compose down`만으로는 삭제되지 않는다.
  postgres_data:
  # 승인 PDF는 승인 버전·SHA-256과 결합되므로 backend 재배포 뒤에도 유지한다.
  report_pdf_data:
  # S3 전환 전 로컬 결함 이미지를 backend 컨테이너 재생성 뒤에도 유지한다.
  robot_images:

networks:
  backend:
    driver: bridge
