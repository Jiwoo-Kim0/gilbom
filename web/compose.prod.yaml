name: ${COMPOSE_PROJECT_NAME:-gilbom}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILES:-3}"
    # json-file 드라이버가 매 줄에 attrs를 함께 쓴다. Alloy가 Docker socket 없이
    # container를 구분할 수 있는 유일한 경로다.
    labels: "com.docker.compose.project,com.docker.compose.service"

services:
  # 공개 설정은 매 배포에 갱신하고, 운영 중 발급된 credential은 named volume에서 보존한다.
  mosquitto-config-init:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: "no"
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        cp /config-source/mosquitto.conf /mosquitto/config/mosquitto.conf
        cp /config-source/acl /mosquitto/config/acl
        cp /config-source/run-production-mosquitto.sh /mosquitto/config/run-production-mosquitto.sh
        if [ ! -s /mosquitto/credentials/passwd ]; then
          cp /run/secrets/mosquitto_passwd /mosquitto/credentials/passwd
        fi
        chown -R 1883:1883 /mosquitto/config /mosquitto/credentials /mosquitto/data
        chmod 0750 /mosquitto/config /mosquitto/credentials /mosquitto/data
        chmod 0440 /mosquitto/config/mosquitto.conf /mosquitto/config/acl
        chmod 0550 /mosquitto/config/run-production-mosquitto.sh
        chmod 0660 /mosquitto/credentials/passwd
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/config-source/mosquitto.conf:ro
      - ./infra/mosquitto/acl:/config-source/acl:ro
      - ./infra/mosquitto/run-production-mosquitto.sh:/config-source/run-production-mosquitto.sh:ro
      - mosquitto_config:/mosquitto/config
      - mosquitto_credentials:/mosquitto/credentials
      - mosquitto_data:/mosquitto/data
    secrets:
      - mosquitto_passwd
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    cpus: "${MQTT_INIT_CPUS:-0.25}"
    mem_limit: ${MQTT_INIT_MEMORY_LIMIT:-64m}
    pids_limit: ${MQTT_INIT_PIDS_LIMIT:-32}
    logging: *default-logging

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    user: "1883:1883"
    entrypoint:
      - /bin/sh
      - /mosquitto/config/run-production-mosquitto.sh
    depends_on:
      mosquitto-config-init:
        condition: service_completed_successfully
    environment:
      MQTT_TLS_SERVER_NAME: ${MQTT_TLS_SERVER_NAME:?MQTT_TLS_SERVER_NAME is required}
    ports:
      - "${MQTT_BIND_ADDRESS:-0.0.0.0}:${MQTT_TLS_PORT:-8883}:8883"
    volumes:
      - mosquitto_config:/mosquitto/config:ro
      - mosquitto_credentials:/mosquitto/credentials:ro
      - mosquitto_data:/mosquitto/data
    secrets:
      - mosquitto_tls_fullchain
      - mosquitto_tls_private_key
      - mqtt_ca_certificate
      - mqtt_backend_password
    healthcheck:
      # Backend 기동 전 TLS chain, 계정 인증과 Broker system topic 응답까지 확인한다.
      test:
        - CMD-SHELL
        - >-
          mosquitto_sub -h "$$MQTT_TLS_SERVER_NAME" -p 8883
          --cafile /run/secrets/mqtt_ca_certificate
          -u gilbom -P "$$(cat /run/secrets/mqtt_backend_password)"
          -i gilbom-broker-health
          -t '$$SYS/broker/version' -C 1 -W 5
          > /dev/null
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /mosquitto/log:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    cpus: "${MQTT_CPUS:-1.0}"
    mem_limit: ${MQTT_MEMORY_LIMIT:-256m}
    mem_reservation: ${MQTT_MEMORY_RESERVATION:-64m}
    pids_limit: ${MQTT_PIDS_LIMIT:-128}
    networks:
      edge: {}
      data:
        aliases:
          - ${MQTT_TLS_SERVER_NAME:?MQTT_TLS_SERVER_NAME is required}
    logging: *default-logging

  db:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gilbom}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-gilbom_db_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_FLYWAY_USER: ${POSTGRES_FLYWAY_USER:-gilbom_flyway}
      POSTGRES_FLYWAY_PASSWORD_FILE: /run/secrets/postgres_flyway_password
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-gilbom_app}
      POSTGRES_APP_PASSWORD_FILE: /run/secrets/postgres_app_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      TZ: ${TZ:-UTC}
      PGTZ: ${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init/20-create-application-roles.sh:/docker-entrypoint-initdb.d/20-create-application-roles.sh:ro
    secrets:
      - postgres_admin_password
      - postgres_flyway_password
      - postgres_app_password
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready --host 127.0.0.1 --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
          && PGPASSWORD="$$(cat "$${POSTGRES_PASSWORD_FILE}")" psql --host 127.0.0.1
          --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}" --no-password
          --tuples-only --command 'SELECT PostGIS_Version();' > /dev/null
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    shm_size: ${POSTGRES_SHM_SIZE:-256m}
    cpus: "${POSTGRES_CPUS:-2.0}"
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-2g}
    mem_reservation: ${POSTGRES_MEMORY_RESERVATION:-512m}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-256}
    networks:
      - data
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-ec2,docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-gilbom}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_APP_USER:-gilbom_app}
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/postgres_app_password
      SPRING_FLYWAY_USER: ${POSTGRES_FLYWAY_USER:-gilbom_flyway}
      SPRING_FLYWAY_PASSWORD_FILE: /run/secrets/postgres_flyway_password
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:-20s}
      GILBOM_HEALTH_READINESS_COMPONENTS: ${GILBOM_HEALTH_READINESS_COMPONENTS:-readinessState,db,flywayReadiness,storageReadiness}
      GILBOM_REPORT_PDF_STORAGE_ROOT: /app/data/report-pdf
      GILBOM_STORAGE_LOCAL_ROOT_DIRECTORY: /app/data/robot-images
      GILBOM_STORAGE_UPLOAD_URL: ${GILBOM_STORAGE_UPLOAD_URL:?GILBOM_STORAGE_UPLOAD_URL is required}
      GILBOM_STORAGE_URL_SIGNING_KEY_BASE64_FILE: /run/secrets/gilbom_storage_signing_key
      GILBOM_CORS_ENABLED: ${GILBOM_CORS_ENABLED:-false}
      GILBOM_CORS_ALLOWED_ORIGINS: ${GILBOM_CORS_ALLOWED_ORIGINS:-}
      GILBOM_CORS_ALLOW_CREDENTIALS: ${GILBOM_CORS_ALLOW_CREDENTIALS:-true}
      # 실제 운영의 보고서 LLM 생성 검증을 위해 이 릴리스에서 기능 gate를 연다.
      GILBOM_LLM_ENABLED: "true"
      GILBOM_LLM_PROVIDER: ${GILBOM_LLM_PROVIDER:-}
      GILBOM_LLM_BASE_URL: ${GILBOM_LLM_BASE_URL:-https://gms.ssafy.io/gmsapi/api.openai.com/v1}
      GILBOM_LLM_MODEL: ${GILBOM_LLM_MODEL:-}
      GILBOM_LLM_API_KEY_FILE: /run/secrets/gilbom_llm_api_key
      GILBOM_LLM_CONNECT_TIMEOUT: ${GILBOM_LLM_CONNECT_TIMEOUT:-3s}
      GILBOM_LLM_READ_TIMEOUT: ${GILBOM_LLM_READ_TIMEOUT:-30s}
      GILBOM_LLM_MAX_OUTPUT_TOKENS: ${GILBOM_LLM_MAX_OUTPUT_TOKENS:-1500}
      GILBOM_LLM_MAX_REQUEST_BYTES: ${GILBOM_LLM_MAX_REQUEST_BYTES:-98304}
      GILBOM_LLM_DAILY_REQUEST_LIMIT: ${GILBOM_LLM_DAILY_REQUEST_LIMIT:-0}
      GILBOM_LLM_DAILY_BUDGET: ${GILBOM_LLM_DAILY_BUDGET:-0}
      GILBOM_LLM_MAX_CONCURRENT_REQUESTS: ${GILBOM_LLM_MAX_CONCURRENT_REQUESTS:-5}
      # report-v3는 검증된 식별자와 사용자용 한국어 용어 출력을 강제한다.
      GILBOM_LLM_PROMPT_VERSION: "report-v3"
      GILBOM_LLM_POLICY_APPROVED: ${GILBOM_LLM_POLICY_APPROVED:-false}
      GILBOM_LLM_TRAINING_EXCLUSION_APPROVED: ${GILBOM_LLM_TRAINING_EXCLUSION_APPROVED:-false}
      GILBOM_LLM_DATA_RETENTION_APPROVED: ${GILBOM_LLM_DATA_RETENTION_APPROVED:-false}
      GILBOM_LLM_OUTBOUND_ALLOWLIST_APPLIED: ${GILBOM_LLM_OUTBOUND_ALLOWLIST_APPLIED:-false}
      # 운영 승인에 따라 대표 결함 JPEG 1장을 GMS 요청에 포함한다.
      GILBOM_LLM_IMAGE_INPUT_ENABLED: "true"
      GILBOM_LLM_IMAGE_DEIDENTIFICATION_APPROVED: "true"
      AUTH_RATE_LIMIT_HMAC_KEY_VERSION: ${AUTH_RATE_LIMIT_HMAC_KEY_VERSION:-1}
      AUTH_RATE_LIMIT_HMAC_KEY_BASE64_FILE: /run/secrets/gilbom_auth_rate_limit_hmac_key
      MFA_TOTP_SECRET_ENCRYPTION_ENABLED: ${MFA_TOTP_SECRET_ENCRYPTION_ENABLED:-true}
      MFA_TOTP_SECRET_ACTIVE_KEY_VERSION: ${MFA_TOTP_SECRET_ACTIVE_KEY_VERSION:-1}
      MFA_TOTP_SECRET_KEYRING_FILE: /run/secrets/gilbom_mfa_totp_keyring
      INITIAL_ADMIN_BOOTSTRAP_ENABLED: ${INITIAL_ADMIN_BOOTSTRAP_ENABLED:-false}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD_FILE: /run/secrets/gilbom_initial_admin_password
      INITIAL_ADMIN_DISPLAY_NAME: ${INITIAL_ADMIN_DISPLAY_NAME:-}
      INITIAL_ADMIN_USER_CODE: ${INITIAL_ADMIN_USER_CODE:-}
      MQTT_BROKER: ssl://${MQTT_TLS_SERVER_NAME:?MQTT_TLS_SERVER_NAME is required}:8883
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-gilbom-backend-prod}
      MQTT_USERNAME: ${MQTT_USERNAME:-gilbom}
      MQTT_PASSWORD_FILE: /run/secrets/mqtt_backend_password
      MQTT_TRUST_CERTIFICATE: /run/secrets/mqtt_ca_certificate
      MQTT_PUBLIC_BROKER_URI: ${MQTT_PUBLIC_BROKER_URI:?MQTT_PUBLIC_BROKER_URI is required}
      MQTT_CREDENTIAL_PROVISIONING_ENABLED: ${MQTT_CREDENTIAL_PROVISIONING_ENABLED:-false}
      MQTT_CREDENTIAL_PASSWORD_FILE: /app/config/mqtt/credentials/passwd
      MQTT_CREDENTIAL_PASSWORD_COMMAND: mosquitto_passwd
      MQTT_CONNECT_COMPLETION_TIMEOUT: ${MQTT_CONNECT_COMPLETION_TIMEOUT:-10s}
      MQTT_DISCONNECT_COMPLETION_TIMEOUT: ${MQTT_DISCONNECT_COMPLETION_TIMEOUT:-5s}
      TZ: ${TZ:-UTC}
    volumes:
      - report_pdf_data:/app/data/report-pdf
      - robot_images:/app/data/robot-images
      - mosquitto_credentials:/app/config/mqtt/credentials
    secrets:
      - postgres_app_password
      - postgres_flyway_password
      - mqtt_backend_password
      - mqtt_ca_certificate
      - gilbom_llm_api_key
      - gilbom_storage_signing_key
      - gilbom_auth_rate_limit_hmac_key
      - gilbom_mfa_totp_keyring
      - gilbom_initial_admin_password
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/actuator/health/readiness
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    cpus: "${BACKEND_CPUS:-2.0}"
    mem_limit: ${BACKEND_MEMORY_LIMIT:-2g}
    mem_reservation: ${BACKEND_MEMORY_RESERVATION:-512m}
    pids_limit: ${BACKEND_PIDS_LIMIT:-256}
    networks:
      - app
      - data
      - llm-egress
    logging: *default-logging

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped
    environment:
      # 운영 애플리케이션은 HTTP serving 모드로 내릴 수 없다. 인증서가 없으면
      # ACME bootstrap만 제공하고, 인증서가 있으면 HTTPS와 HTTP redirect만 제공한다.
      GILBOM_NGINX_TLS_MODE: auto
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_HTTP_PORT:-80}:8080"
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_HTTPS_PORT:-443}:8443"
    volumes:
      - type: bind
        source: ${CERTBOT_WWW_DIR:-/opt/gilbom/certbot/www}
        target: /var/www/certbot
        read_only: true
      - type: bind
        source: ${NGINX_CERT_DIR:-/opt/gilbom/certbot/nginx}
        target: /etc/nginx/certs
        read_only: true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/gilbom-nginx-healthcheck
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    cpus: "${FRONTEND_CPUS:-0.5}"
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-128m}
    mem_reservation: ${FRONTEND_MEMORY_RESERVATION:-32m}
    pids_limit: ${FRONTEND_PIDS_LIMIT:-64}
    networks:
      - edge
      - app
    logging: *default-logging

  # 인증서 발급·갱신 때만 `--profile certificate run --rm certbot ...`로 실행한다.
  # Frontend에는 원본 Let's Encrypt tree 대신 nginx 전용 복사본만 read-only로 제공한다.
  certbot:
    image: certbot/certbot:v5.7.0
    profiles:
      - certificate
    restart: "no"
    user: "0:0"
    environment:
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN:?CERTBOT_DOMAIN is required}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?CERTBOT_EMAIL is required}
      NGINX_CERT_GID: ${NGINX_CERT_GID:-101}
    volumes:
      - type: bind
        source: ${CERTBOT_CONF_DIR:-/opt/gilbom/certbot/conf}
        target: /etc/letsencrypt
      - type: bind
        source: ${CERTBOT_WWW_DIR:-/opt/gilbom/certbot/www}
        target: /var/www/certbot
      - type: bind
        source: ${NGINX_CERT_DIR:-/opt/gilbom/certbot/nginx}
        target: /etc/nginx/certs
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    cpus: "${CERTBOT_CPUS:-0.5}"
    mem_limit: ${CERTBOT_MEMORY_LIMIT:-256m}
    pids_limit: ${CERTBOT_PIDS_LIMIT:-128}
    networks:
      - edge
    logging: *default-logging

volumes:
  postgres_data:
  mosquitto_config:
  mosquitto_credentials:
  mosquitto_data:
  report_pdf_data:
  robot_images:

secrets:
  postgres_admin_password:
    file: ${POSTGRES_ADMIN_PASSWORD_SECRET_FILE:?POSTGRES_ADMIN_PASSWORD_SECRET_FILE is required}
  postgres_flyway_password:
    file: ${POSTGRES_FLYWAY_PASSWORD_SECRET_FILE:?POSTGRES_FLYWAY_PASSWORD_SECRET_FILE is required}
  postgres_app_password:
    file: ${POSTGRES_APP_PASSWORD_SECRET_FILE:?POSTGRES_APP_PASSWORD_SECRET_FILE is required}
  mqtt_backend_password:
    file: ${MQTT_PASSWORD_SECRET_FILE:?MQTT_PASSWORD_SECRET_FILE is required}
  mqtt_ca_certificate:
    file: ${MQTT_CA_CERTIFICATE_FILE:?MQTT_CA_CERTIFICATE_FILE is required}
  mosquitto_passwd:
    file: ${MOSQUITTO_PASSWORD_FILE_SECRET_FILE:?MOSQUITTO_PASSWORD_FILE_SECRET_FILE is required}
  mosquitto_tls_fullchain:
    file: ${MOSQUITTO_TLS_FULLCHAIN_FILE:?MOSQUITTO_TLS_FULLCHAIN_FILE is required}
  mosquitto_tls_private_key:
    file: ${MOSQUITTO_TLS_PRIVATE_KEY_SECRET_FILE:?MOSQUITTO_TLS_PRIVATE_KEY_SECRET_FILE is required}
  gilbom_llm_api_key:
    # LLM이 비활성화된 배포는 실제 key 없이 /dev/null을 빈 file Secret으로
    # mount한다. enabled 정책은 non-empty key를 별도로 강제한다.
    file: ${GILBOM_LLM_API_KEY_SECRET_FILE:-/dev/null}
  gilbom_storage_signing_key:
    file: ${GILBOM_STORAGE_SIGNING_KEY_SECRET_FILE:?GILBOM_STORAGE_SIGNING_KEY_SECRET_FILE is required}
  gilbom_auth_rate_limit_hmac_key:
    file: ${AUTH_RATE_LIMIT_HMAC_KEY_SECRET_FILE:?AUTH_RATE_LIMIT_HMAC_KEY_SECRET_FILE is required}
  gilbom_mfa_totp_keyring:
    file: ${MFA_TOTP_KEYRING_SECRET_FILE:?MFA_TOTP_KEYRING_SECRET_FILE is required}
  gilbom_initial_admin_password:
    file: ${INITIAL_ADMIN_PASSWORD_SECRET_FILE:?INITIAL_ADMIN_PASSWORD_SECRET_FILE is required}

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true
  llm-egress:
    driver: bridge
