plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.gilbom'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Spring Security Argon2 encoder의 구현 provider를 고정한다.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.84'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // 운영 DB 스키마는 Hibernate가 아니라 버전이 기록되는 Flyway migration으로만 변경한다.
    implementation 'org.flywaydb:flyway-core'
    // Flyway 10+에서 PostgreSQL 지원은 database별 모듈로 분리되어 있다.
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    // 서버 재시작·다중 인스턴스에서도 인증 세션을 공유하도록 JDBC 저장소를 사용한다.
    implementation 'org.springframework.session:spring-session-jdbc'
    implementation 'org.springframework.integration:spring-integration-mqtt'
    implementation 'org.eclipse.paho:org.eclipse.paho.mqttv5.client:1.2.5'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'password-load'
    }
}

tasks.register('passwordHashLoadTest', Test) {
    group = 'verification'
    description = 'Measures Argon2id hashing and concurrent verification cost.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'password-load'
    }
    maxParallelForks = 1
    jvmArgs '-Xms256m', '-Xmx512m'
    testLogging {
        events 'passed', 'failed'
        showStandardStreams = true
    }
}

tasks.named('jar') {
    enabled = false
}
