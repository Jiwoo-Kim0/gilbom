plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.gilbom'
version = '0.0.1-SNAPSHOT'

if (providers.gradleProperty('isolatedBuildDirectory').isPresent()) {
    layout.buildDirectory.set(file(
            providers.gradleProperty('isolatedBuildDirectory').get()
    ))
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Spring Security Argon2 encoder의 구현 provider를 고정한다.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.84'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // 운영 DB 스키마는 Hibernate가 아니라 버전이 기록되는 Flyway migration으로만 변경한다.
    implementation 'org.flywaydb:flyway-core'
    // Flyway 10+에서 PostgreSQL 지원은 database별 모듈로 분리되어 있다.
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    // 서버 재시작·다중 인스턴스에서도 인증 세션을 공유하도록 JDBC 저장소를 사용한다.
    implementation 'org.springframework.session:spring-session-jdbc'
    implementation 'org.springframework.integration:spring-integration-mqtt'
    implementation 'org.eclipse.paho:org.eclipse.paho.mqttv5.client:1.2.5'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'password-load', 'mqtt-broker-e2e'
    }
    afterSuite { descriptor, result ->
        if (descriptor.parent == null) {
            logger.lifecycle(
                    "Backend test summary: tests=${result.testCount}, "
                            + "failures=${result.failedTestCount}, "
                            + "skipped=${result.skippedTestCount}"
            )
        }
        if (descriptor.parent == null
                && result.skippedTestCount > 0
                && !providers.gradleProperty('allowSkippedTests')
                        .map { it.toBoolean() }
                        .getOrElse(false)) {
            throw new GradleException(
                    "Backend tests must not be skipped: "
                            + "${result.skippedTestCount} skipped. "
                            + "Run scripts/backend-test.sh with Docker, or use "
                            + "-PallowSkippedTests=true only in a build stage "
                            + "that is preceded by the container-backed test gate."
            )
        }
    }
}

tasks.register('mqttBrokerE2E', Test) {
    group = 'verification'
    description = 'Runs real TLS MQTT outbound expiry and inbound Event-to-DB E2E tests.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'mqtt-broker-e2e'
    }
    shouldRunAfter tasks.named('test')
    afterSuite { descriptor, result ->
        if (descriptor.parent == null) {
            logger.lifecycle(
                    "MQTT Broker E2E summary: tests=${result.testCount}, "
                            + "failures=${result.failedTestCount}, "
                            + "skipped=${result.skippedTestCount}"
            )
        }
    }
}

tasks.register('securityAcceptanceTest', Test) {
    group = 'verification'
    description = 'Runs the Day 4 RBAC, CSRF, scope, audit, and MFA acceptance gate.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'security-acceptance'
    }
    shouldRunAfter tasks.named('test')
    afterSuite { descriptor, result ->
        if (descriptor.parent == null && result.skippedTestCount > 0) {
            throw new GradleException(
                    "Day 4 security acceptance tests must not be skipped: "
                            + "${result.skippedTestCount} skipped."
            )
        }
    }
}

tasks.register('passwordHashLoadTest', Test) {
    group = 'verification'
    description = 'Measures Argon2id hashing and concurrent verification cost.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'password-load'
    }
    maxParallelForks = 1
    jvmArgs '-Xms256m', '-Xmx512m'
    testLogging {
        events 'passed', 'failed'
        showStandardStreams = true
    }
}

tasks.named('jar') {
    enabled = false
}
