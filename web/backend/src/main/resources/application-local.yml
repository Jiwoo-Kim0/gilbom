spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    com.gilbom: DEBUG

mqtt:
  broker: ${MQTT_BROKER:ssl://localhost:8883}
  client-id: ${MQTT_CLIENT_ID:gilbom-local}
  log-payload: ${MQTT_LOG_PAYLOAD:true}
  credential-provisioning:
    enabled: ${MQTT_CREDENTIAL_PROVISIONING_ENABLED:true}
    password-file: ${MQTT_CREDENTIAL_PASSWORD_FILE:../infra/mosquitto/local/runtime/credentials/passwd}
    password-command: ${MQTT_CREDENTIAL_PASSWORD_COMMAND:mosquitto_passwd}
    process-timeout: ${MQTT_CREDENTIAL_PROCESS_TIMEOUT:10s}
    activation-timeout: ${MQTT_CREDENTIAL_ACTIVATION_TIMEOUT:10s}
    verification-interval: ${MQTT_CREDENTIAL_VERIFICATION_INTERVAL:250ms}
    registry-scan-interval: ${MQTT_CREDENTIAL_REGISTRY_SCAN_INTERVAL:1m}
  security:
    # mqtt-init issues the broker certificate from the local development CA.
    # Point MQTT_TRUST_CERTIFICATE to infra/mosquitto/local/runtime/certs/local-ca-cert.pem.
    trust-certificate: ${MQTT_TRUST_CERTIFICATE:}
    # Set absolute Windows paths when local mTLS is enabled.
    # Example: C:/ssafy/SSAFY-TASK/web/infra/mosquitto/local/runtime/certs/client.pem
    client-certificate: ${MQTT_CLIENT_CERTIFICATE:}
    client-private-key: ${MQTT_CLIENT_PRIVATE_KEY:}
