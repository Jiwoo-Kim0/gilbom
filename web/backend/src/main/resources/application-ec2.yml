spring:
  config:
    activate:
      on-profile: ec2
  jpa:
    # 운영에서는 stdout SQL 출력이 실수로 활성화되지 않도록 명시적으로 차단한다.
    show-sql: false

server:
  servlet:
    session:
      cookie:
        # __Host- cookie는 Secure, Path=/, Domain 미설정을 함께 요구한다.
        name: __Host-GILBOM_SESSION
        secure: true

logging:
  # 예외를 넘긴 타 라이브러리 로그까지 stack trace를 출력하지 않는 운영 안전망이다.
  exception-conversion-word: "%nopex"
  level:
    com.gilbom: INFO
    # SQL 문, bind 값, DB 오류 원문을 출력할 수 있는 logger는 운영에서 비활성화한다.
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
    org.hibernate.orm.jdbc.extract: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
    org.springframework.jdbc.core: "OFF"
    org.flywaydb.core.internal.sqlscript: "OFF"

gilbom:
  security:
    rate-limit:
      key:
        # 다중 인스턴스와 재시작에서도 같은 HMAC bucket을 사용하도록 운영 Secret을 강제한다.
        external-required: true
    mfa:
      totp-secret-encryption:
        # 운영 서버에서는 disabled 또는 keyring 누락 상태로 기동하지 못한다.
        required: true

mqtt:
  broker: ${MQTT_BROKER:ssl://i15d101.p.ssafy.io:8883}
  client-id: ${MQTT_CLIENT_ID:gilbom-backend-ec2}
  security:
    # Public CA certificates can use the JVM default trust store by leaving this empty.
    trust-certificate: ${MQTT_TRUST_CERTIFICATE:}
    # EC2 client credentials for mTLS. Override these when the deployment path differs.(내가 만들어 놨음 ec2 경로에)
    client-certificate: ${MQTT_CLIENT_CERTIFICATE:/opt/gilbom/backend/certs/client.pem}
    client-private-key: ${MQTT_CLIENT_PRIVATE_KEY:/opt/gilbom/backend/certs/client-key.pem}
