#common
spring:
  application:
    name: gilbom-backend
  lifecycle:
    # Compose의 30초 SIGKILL 상한보다 먼저 요청·DB pool·MQTT client 정리를 끝낸다.
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:20s}
  # STS에서 직접 실행: 별도 지정 없이 local을 기본 프로필로 사용
  # 로컬 Docker에서 실행: SPRING_PROFILES_ACTIVE=local,docker
  # EC2의 Docker에서 실행: SPRING_PROFILES_ACTIVE=ec2,docker
  profiles:
    default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gilbom}
    username: ${SPRING_DATASOURCE_USERNAME:gilbom_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # migration 이력은 업무·세션 테이블과 분리된 전용 schema에 보관한다.
    default-schema: ${SPRING_FLYWAY_DEFAULT_SCHEMA:flyway_history}
    user: ${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME:gilbom_app}}
    password: ${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    clean-disabled: true
    validate-migration-naming: true
    placeholders:
      # migration이 생성한 객체에는 runtime 계정의 최소 권한만 부여한다.
      applicationRole: ${SPRING_DATASOURCE_USERNAME:gilbom_app}
  session:
    timeout: ${GILBOM_SESSION_IDLE_TIMEOUT:30m}
    jdbc:
      # Spring의 자동 DDL 대신 Flyway가 표준 Session JDBC 테이블을 생성한다.
      initialize-schema: never
      table-name: session_store.spring_session
  servlet:
    multipart:
      # 대표 이미지 계약(500KB)과 전체 요청 상한(1MB)을 컨테이너 파싱 전에도 강제한다.
      max-file-size: ${GILBOM_MAX_UPLOAD_FILE_SIZE:500KB}
      max-request-size: ${GILBOM_MAX_REQUEST_BODY_SIZE:1MB}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    open-in-view: false
  jackson:
    deserialization:
      # OpenAPI의 additionalProperties: false 계약과 동일하게 미정의 JSON 필드를 거부한다.
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Cookie를 포함한 전체 요청 헤더가 비정상적으로 커지기 전에 Connector에서 거부한다.
  max-http-request-header-size: ${GILBOM_MAX_REQUEST_HEADER_SIZE:16KB}
  tomcat:
    max-http-form-post-size: ${GILBOM_MAX_REQUEST_BODY_SIZE:1MB}
    max-swallow-size: ${GILBOM_MAX_REQUEST_BODY_SIZE:1MB}
  servlet:
    session:
      # 로컬 HTTP용 이름이며 운영 profile은 __Host- prefix와 Secure를 강제한다.
      cookie:
        name: GILBOM_SESSION
        http-only: true
        secure: false
        same-site: lax
        path: /
      tracking-modes: cookie
  error:
    # ControllerAdvice 밖에서 발생한 오류도 Spring 기본 응답에 내부 정보를 싣지 않는다.
    include-exception: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    # Secret 이름이 알려져도 관리 endpoint에서 실제 설정값을 반환하지 않는다.
    configprops:
      show-values: never
    env:
      show-values: never

info:
  app:
    name: ${spring.application.name}

gilbom:
  http:
    # JSON과 chunked body를 포함한 모든 요청 본문의 애플리케이션 전역 상한이다.
    max-request-body-size: ${GILBOM_MAX_REQUEST_BODY_SIZE:1MB}
  report:
    pdf:
      # Docker/운영은 영속 volume 경로를 명시하고 IDE/test만 OS 임시 경로를 기본 사용한다.
      storage-root: ${GILBOM_REPORT_PDF_STORAGE_ROOT:${java.io.tmpdir}/gilbom-report-pdf}
    sse:
      # 다중 탭 오남용과 단일 인스턴스 emitter 고갈을 함께 제한한다.
      max-connections-per-user: ${GILBOM_REPORT_SSE_MAX_CONNECTIONS_PER_USER:3}
      max-connections-total: ${GILBOM_REPORT_SSE_MAX_CONNECTIONS_TOTAL:200}
  llm:
    # 정책 gate를 모두 통과하기 전에는 DisabledLlmClient와 TEMPLATE fallback을 사용한다.
    enabled: ${GILBOM_LLM_ENABLED:false}
    provider: ${GILBOM_LLM_PROVIDER:}
    base-url: ${GILBOM_LLM_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1}
    model: ${GILBOM_LLM_MODEL:}
    api-key: ${GILBOM_LLM_API_KEY:}
    connect-timeout: ${GILBOM_LLM_CONNECT_TIMEOUT:3s}
    read-timeout: ${GILBOM_LLM_READ_TIMEOUT:30s}
    max-output-tokens: ${GILBOM_LLM_MAX_OUTPUT_TOKENS:1500}
    daily-request-limit: ${GILBOM_LLM_DAILY_REQUEST_LIMIT:0}
    daily-budget: ${GILBOM_LLM_DAILY_BUDGET:0}
    max-concurrent-requests: ${GILBOM_LLM_MAX_CONCURRENT_REQUESTS:5}
    prompt-version: ${GILBOM_LLM_PROMPT_VERSION:}
    policy-approved: ${GILBOM_LLM_POLICY_APPROVED:false}
    training-exclusion-approved: ${GILBOM_LLM_TRAINING_EXCLUSION_APPROVED:false}
    data-retention-approved: ${GILBOM_LLM_DATA_RETENTION_APPROVED:false}
    outbound-allowlist-applied: ${GILBOM_LLM_OUTBOUND_ALLOWLIST_APPLIED:false}
    # 비식별화 완료가 별도 확인되기 전에는 이미지가 있어도 텍스트만 전송한다.
    image-input-enabled: ${GILBOM_LLM_IMAGE_INPUT_ENABLED:false}
    image-deidentification-approved: ${GILBOM_LLM_IMAGE_DEIDENTIFICATION_APPROVED:false}
  robot:
    presence:
      # State는 30초마다 발행하므로 3회 주기 동안 아무 메시지도 없으면 Offline으로 판정한다.
      offline-timeout: ${GILBOM_ROBOT_OFFLINE_TIMEOUT:90s}
      offline-scan-interval: ${GILBOM_ROBOT_OFFLINE_SCAN_INTERVAL:30s}
  security:
    cors:
      # Nginx의 /api same-origin proxy가 기본이다. 교차 Origin이 필요한 환경만 명시적으로 연다.
      enabled: ${GILBOM_CORS_ENABLED:false}
      allowed-origins: ${GILBOM_CORS_ALLOWED_ORIGINS:}
      allow-credentials: ${GILBOM_CORS_ALLOW_CREDENTIALS:true}
    session:
      idle-timeout: ${GILBOM_SESSION_IDLE_TIMEOUT:30m}
      absolute-timeout: ${GILBOM_SESSION_ABSOLUTE_TIMEOUT:8h}
      challenge-timeout: ${GILBOM_MFA_CHALLENGE_TIMEOUT:5m}
      maximum-authenticated-sessions: ${GILBOM_SESSION_MAX_CONCURRENT:1}
      maximum-challenge-failures: ${GILBOM_MFA_CHALLENGE_MAX_FAILURES:5}
      cleanup-interval: ${GILBOM_SESSION_CLEANUP_INTERVAL:1m}
      cleanup-batch-size: ${GILBOM_SESSION_CLEANUP_BATCH_SIZE:1000}
    rate-limit:
      key:
        # 운영은 ec2 profile에서 외부 key를 강제한다. 값은 최소 32-byte Base64 Secret이다.
        version: ${AUTH_RATE_LIMIT_HMAC_KEY_VERSION:1}
        base64: ${AUTH_RATE_LIMIT_HMAC_KEY_BASE64:}
        external-required: false
      public-auth:
        # 유효 세션이 없는 CSRF 조회만 소비한다. 정상 세션의 새로고침·다중 탭은 제외한다.
        csrf-token-issuance-max-requests: ${AUTH_CSRF_TOKEN_ISSUANCE_MAX_REQUESTS:60}
        csrf-token-issuance-window: ${AUTH_CSRF_TOKEN_ISSUANCE_WINDOW:1m}
        email-availability-max-requests: ${AUTH_EMAIL_AVAILABILITY_MAX_REQUESTS:20}
        email-availability-window: ${AUTH_EMAIL_AVAILABILITY_WINDOW:1m}
        registration-max-requests: ${AUTH_REGISTRATION_MAX_REQUESTS:5}
        registration-window: ${AUTH_REGISTRATION_WINDOW:1h}
        cleanup-interval: ${AUTH_RATE_LIMIT_CLEANUP_INTERVAL:10m}
        cleanup-batch-size: ${AUTH_RATE_LIMIT_CLEANUP_BATCH_SIZE:1000}
      authentication:
        ip-maximum-requests: ${AUTH_IP_MAX_REQUESTS:20}
        ip-window: ${AUTH_IP_WINDOW:1m}
        password-maximum-failures: ${AUTH_PASSWORD_MAX_FAILURES:5}
        password-failure-window: ${AUTH_PASSWORD_FAILURE_WINDOW:15m}
        mfa-maximum-failures: ${AUTH_MFA_MAX_FAILURES:5}
        mfa-failure-window: ${AUTH_MFA_FAILURE_WINDOW:15m}
        temporary-lock-duration: ${AUTH_TEMPORARY_LOCK_DURATION:15m}
    initial-admin:
      # 평상시 false. 빈 DB 최초 bootstrap 때만 외부 Secret을 주입해 일시적으로 활성화한다.
      enabled: ${INITIAL_ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${INITIAL_ADMIN_EMAIL:}
      password: ${INITIAL_ADMIN_PASSWORD:}
      display-name: ${INITIAL_ADMIN_DISPLAY_NAME:}
      user-code: ${INITIAL_ADMIN_USER_CODE:}
    mfa:
      totp-secret-encryption:
        # 로컬은 MFA 기능을 사용하기 전까지 비활성화할 수 있고 운영 profile은 이를 강제한다.
        enabled: ${MFA_TOTP_SECRET_ENCRYPTION_ENABLED:false}
        required: false
        active-key-version: ${MFA_TOTP_SECRET_ACTIVE_KEY_VERSION:1}
        # "version=base64Key;version=base64Key" 형식이며 실제 값은 외부 Secret 저장소에서 주입한다.
        keyring: ${MFA_TOTP_SECRET_KEYRING:}

mqtt:
  # Select tls or mtls.
  now-mqtt-security-strategy: tls
  username: ${MQTT_USERNAME}
  password: ${MQTT_PASSWORD}
  # Comma-separated MQTT topic filters.
  subscribe-topic: "${MQTT_SUBSCRIBE_TOPIC:tbs/v2/robots/+/presence,tbs/v2/robots/+/state,tbs/v2/robots/+/telemetry,tbs/v2/robots/+/events/#,tbs/v2/robots/+/commands/result}"
  publish-topic: ${MQTT_PUBLISH_TOPIC:tbs/v2/robots/robot-test/commands/request}
  qos: ${MQTT_QOS:1}
  # Paho exponential backoff의 상한이다. Broker 복구 뒤 다음 재연결이 오래 지연되지 않게 한다.
  reconnect-max-delay: ${MQTT_RECONNECT_MAX_DELAY:5s}
  # Broker 장애 중에도 container의 graceful shutdown 상한 전에 연결 정리를 끝낸다.
  connect-completion-timeout: ${MQTT_CONNECT_COMPLETION_TIMEOUT:10s}
  disconnect-completion-timeout: ${MQTT_DISCONNECT_COMPLETION_TIMEOUT:5s}
  # Full payload logging is for isolated local communication tests only.
  log-payload: ${MQTT_LOG_PAYLOAD:false}
  inbound-freshness:
    # Topic별 기준시각부터 서버 수신까지 허용하는 최대 지연이다.
    telemetry-max-delay: ${MQTT_TELEMETRY_MAX_DELAY:60s}
    state-max-delay: ${MQTT_STATE_MAX_DELAY:300s}
    command-result-max-delay: ${MQTT_COMMAND_RESULT_MAX_DELAY:60s}
    future-tolerance: ${MQTT_FUTURE_TIMESTAMP_TOLERANCE:5s}
  credential-provisioning:
    # The URI returned to a robot may differ from the backend container's broker URI.
    public-broker-uri: ${MQTT_PUBLIC_BROKER_URI:${MQTT_BROKER:ssl://localhost:8883}}
