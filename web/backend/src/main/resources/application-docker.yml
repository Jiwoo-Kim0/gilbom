spring:
  config:
    activate:
      on-profile: docker

server:
  # Backend는 loopback에만 publish되고 신뢰된 Docker Nginx가 전달한 X-Forwarded-*를 해석한다.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto

logging:
  level:
    com.gilbom: INFO

mqtt:
  security:
    # MQTT certificate convention inside the backend container:
    # /app/config/mqtt/certs/{local-ca-cert.pem,client.pem,client-key.pem}
    trust-certificate: ${MQTT_TRUST_CERTIFICATE:}
    client-certificate: ${MQTT_CLIENT_CERTIFICATE:/app/config/mqtt/certs/client.pem}
    client-private-key: ${MQTT_CLIENT_PRIVATE_KEY:/app/config/mqtt/certs/client-key.pem}
