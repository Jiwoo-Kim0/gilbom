name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

services:
  db:
    image: postgres:16.10-alpine3.22
    restart: "no"
    environment:
      POSTGRES_DB: rollback_drill
      POSTGRES_USER: rollback_drill
      POSTGRES_PASSWORD: rollback-drill-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          --host 127.0.0.1
          --username "$${POSTGRES_USER}"
          --dbname "$${POSTGRES_DB}"
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 3s
    networks:
      - data

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: "no"
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: rollback_drill
      PGUSER: rollback_drill
      PGPASSWORD: rollback-drill-only
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - robot_images:/data/robot-images
      - report_pdf_data:/data/report-pdf
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - data

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: "no"
    depends_on:
      backend:
        condition: service_started
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=8m
      - /var/run:rw,noexec,nosuid,nodev,size=8m
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - data

volumes:
  postgres_data:
  robot_images:
  report_pdf_data:

networks:
  data:
    internal: true
