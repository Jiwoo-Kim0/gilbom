services:
  # 이 override는 운영 topology와 image를 그대로 사용하되 자동 재시작을 끈다.
  # 실패한 container가 restart loop로 성공처럼 보이지 않게 하고, project별 named
  # volume은 container-report-smoke.sh가 종료 시 항상 폐기한다.
  db:
    restart: "no"
    labels:
      com.gilbom.validation-scope: container-report-smoke

  mosquitto:
    restart: "no"
    labels:
      com.gilbom.validation-scope: container-report-smoke

  backend:
    restart: "no"
    environment:
      INITIAL_ADMIN_BOOTSTRAP_ENABLED: "true"
      # 운영 gate는 true로 유지하되 fallback smoke와 명시적 GMS canary가
      # 각 시나리오에 맞는 값을 선택할 수 있게 한다.
      GILBOM_LLM_ENABLED: ${GILBOM_LLM_ENABLED:-false}
    labels:
      com.gilbom.validation-scope: container-report-smoke

  frontend:
    restart: "no"
    # 일회성 report/resilience smoke client는 임의 host port의 HTTP URL을 사용한다.
    # 운영 Compose 단독 실행에는 이 override가 포함되지 않는다.
    environment:
      GILBOM_NGINX_TLS_MODE: "off"
    labels:
      com.gilbom.validation-scope: container-report-smoke
