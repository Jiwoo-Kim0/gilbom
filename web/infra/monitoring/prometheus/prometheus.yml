global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  # Host metric은 Alloy가 remote_write로 밀어 넣는다. 여기서는 수집기 생존만 본다.
  # container 단위 metric도 같은 경로다 — host가 textfile로 쓰고 Alloy가 노출한다.
  - job_name: alloy
    static_configs:
      - targets:
          - alloy:12345

  # Backend는 port를 publish하지 않고 Nginx도 /actuator를 프록시하지 않는다.
  # internal app network 안에서만 닿는 경로다.
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:8080

  # 공개 HTTPS 종단을 바깥에서 보듯 확인한다. 인증서 만료일도 여기서 나온다.
  # 도메인이 바뀌면 이 target과 blackbox.yml의 SNI 설정을 함께 고친다.
  - job_name: blackbox-https
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - https://i15d101.p.ssafy.io/healthz
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox
    static_configs:
      - targets:
          - blackbox:9115
