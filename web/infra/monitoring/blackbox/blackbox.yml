modules:
  # 공개 HTTPS 종단을 바깥에서 보듯 확인한다. 인증서 만료일(probe_ssl_earliest_cert_expiry)도
  # 이 모듈이 함께 노출한다.
  http_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_http_versions:
        - HTTP/1.1
        - HTTP/2.0
      valid_status_codes:
        - 200
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      tls_config:
        # 공개 인증서를 실제 브라우저와 같은 기준으로 검증한다. 검증을 끄면
        # 만료·불일치를 알람으로 잡지 못한다.
        insecure_skip_verify: false
