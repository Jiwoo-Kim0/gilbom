# 길봄 운영 MQTT: 서버 TLS + MQTT 계정 인증
listener 8883
protocol mqtt

# TLS private key와 certificate는 image/config volume이 아니라
# Compose file Secret으로 /run/secrets에 read-only mount한다.
certfile /run/secrets/mosquitto_tls_fullchain
keyfile /run/secrets/mosquitto_tls_private_key
tls_version tlsv1.2

listener_allow_anonymous false

plugin /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /mosquitto/credentials/passwd

plugin /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/config/acl

# QoS session과 inflight message를 container 재생성 뒤에도 복원한다.
# 업무 데이터의 정본은 DB지만 Broker 전달 상태는 별도 named volume에 보존한다.
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 300
autosave_on_changes false

set_tcp_nodelay true
connection_messages true

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
