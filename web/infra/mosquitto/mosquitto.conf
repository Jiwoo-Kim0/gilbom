# 길봄 운영 MQTT: 서버 TLS + MQTT 계정 인증
listener 8883
protocol mqtt

certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2

listener_allow_anonymous false

plugin /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /mosquitto/config/passwd

plugin /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/config/acl

# DB가 텔레메트리와 명령 상태의 원본이므로 Broker 파일 영속화는
# 통신 1차 완료 범위에서 사용하지 않는다.
persistence false

set_tcp_nodelay true
connection_messages true

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
