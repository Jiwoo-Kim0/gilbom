name: gilbom-mqtt-test

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    user: "1883:1883"
    restart: unless-stopped

    # Safe default: only clients running on the EC2 host can connect.
    # For a short remote-device test, change this to "1883:1883" and
    # restrict inbound TCP/1883 to the device IP in the EC2 security group.
    ports:
      - "127.0.0.1:1883:1883"

    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

    read_only: true
    tmpfs:
      - /tmp
      - /mosquitto/data
      - /mosquitto/log

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
