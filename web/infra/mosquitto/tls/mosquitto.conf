# Server TLS plus MQTT username/password authentication.
listener 8883
protocol mqtt

certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2

allow_anonymous false

plugin /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /mosquitto/config/passwd

plugin /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/config/acl

persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
