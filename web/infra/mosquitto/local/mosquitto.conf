listener 8883
protocol mqtt

certfile /mosquitto/local/certs/local-broker-cert.pem
keyfile /mosquitto/local/certs/local-broker-key.pem
tls_version tlsv1.2

allow_anonymous false
password_file /mosquitto/local/passwd
acl_file /mosquitto/local/acl

persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
