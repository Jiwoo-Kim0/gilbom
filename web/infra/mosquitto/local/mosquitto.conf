listener 8883
protocol mqtt

certfile /mosquitto/local/certs/local-broker-cert.pem
keyfile /mosquitto/local/certs/local-broker-key.pem
tls_version tlsv1.2

listener_allow_anonymous false

plugin /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /mosquitto/local/credentials/passwd

plugin /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/local/acl

persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
