name: gilbom-mqtt-local

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    user: "1883:1883"
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - /mosquitto/config/run-local-mosquitto.sh
    depends_on:
      mqtt-init:
        condition: service_completed_successfully

    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:${MQTT_TLS_PORT:-8883}:8883"

    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./run-local-mosquitto.sh:/mosquitto/config/run-local-mosquitto.sh:ro
      - ./runtime:/mosquitto/local:ro

    read_only: true
    tmpfs:
      - /tmp
      - /mosquitto/data
      - /mosquitto/log

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

  mqtt-init:
    build:
      context: .
      dockerfile: Dockerfile.init
    image: gilbom-mqtt-init:local
    restart: "no"
    user: "0:0"
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-gilbom}
      MQTT_PASSWORD_FILE: /run/secrets/mqtt_backend_password
      MQTT_LAN_IP: ${MQTT_LAN_IP:-}
      MQTT_PUBLIC_HOSTNAME: ${MQTT_PUBLIC_HOSTNAME:-}
    volumes:
      - .:/mqtt-local
      - ../acl:/mqtt-input/acl:ro
    secrets:
      - mqtt_backend_password
    tmpfs:
      - /tmp
    command:
      - /bin/sh
      - /mqtt-local/init-local-mqtt.sh

secrets:
  mqtt_backend_password:
    file: ${MQTT_PASSWORD_SECRET_FILE:-../../../secrets/mqtt_backend_password}
