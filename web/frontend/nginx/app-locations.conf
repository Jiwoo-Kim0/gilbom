location = /healthz {
    access_log off;
    default_type text/plain;
    expires -1;
    return 200 "ok\n";
}

# 기존 로컬 점검 경로는 호환성을 위해 유지하되 readiness 정본은 /healthz다.
location = /health {
    access_log off;
    default_type text/plain;
    expires -1;
    return 200 "ok\n";
}

location = /api/v1/auth/csrf-token {
    # 공유 NAT의 정상적인 동시 새로고침은 burst로 수용하되 지속 flood는 429로 거부한다.
    limit_req zone=csrf_token_issuance burst=60 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;

    proxy_pass http://backend_upstream;
    proxy_http_version 1.1;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 서명 URL 자체로 인증하는 이미지 본문은 관리자 세션과 완전히 분리한다.
#
# 브라우저의 <img>는 같은 Origin 쿠키를 자동 첨부한다. Backend 이미지 체인이
# STATELESS여도 Spring Session의 servlet filter는 SecurityFilterChain 바깥에 있어
# 동시 이미지 응답이 새 session cookie를 내보낼 수 있다. 그 응답이 관리자 쿠키를
# 덮으면 다음 API 요청이 401이 된다. Edge에서 양방향을 끊어 이 경로가 관리자
# session을 읽지도, 쓸 수도 없게 한다.
location ~ "^/api/v1/images/[0-9a-fA-F-]{36}/content$" {
    access_log /dev/stdout signed_image;

    proxy_pass http://backend_upstream;
    proxy_http_version 1.1;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;

    # Signed URL만 자격증명으로 사용한다. 관리자 cookie를 Backend에 보내지 않고,
    # Backend가 실수로 만든 session cookie도 브라우저에 전달하지 않는다.
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# EventSource 연결은 일반 API보다 먼저 매칭해 buffering과 짧은 기본 timeout을 피한다.
location ^~ /api/v1/stream/ {
    proxy_pass http://backend_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_hide_header Cache-Control;
    expires -1;

    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/ {
    proxy_pass http://backend_upstream;
    proxy_http_version 1.1;
    # 공개 응답에는 edge 정책을 단일 값으로 제공하고 Backend 직접 접근도 자체 헤더를 유지한다.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 이 Nginx가 유일한 신뢰 edge이므로 클라이언트가 보낸 X-Forwarded-For를
    # 이어붙이지 않는다. 그렇지 않으면 IP Rate Limit bucket을 임의 선택할 수 있다.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Vite content hash가 포함된 asset만 1년 캐시한다. 파일명이 바뀌므로 재배포와 충돌하지 않는다.
location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:css|js|png|jpg|jpeg|gif|svg|webp|woff2?)$" {
    expires 1y;
    try_files $uri =404;
}

# SPA 진입점은 배포 직후 새 hash asset 목록을 다시 확인해야 한다.
location = /index.html {
    expires -1;
    try_files /index.html =404;
}

location / {
    # BrowserRouter deep link도 index.html에서 시작해 React route가 해석한다.
    try_files $uri $uri/ /index.html;
}
