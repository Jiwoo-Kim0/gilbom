## 공개 CSRF 조회의 순간 폭주를 애플리케이션·DB에 도달하기 전에 제한한다.
## 애플리케이션의 영속 60회/분 정책이 정본이고, 이 zone은 짧은 burst 차단용이다.
limit_req_zone $binary_remote_addr zone=csrf_token_issuance:10m rate=2r/s;

# Build 시점의 DNS에 의존하지 않고 Docker runtime에서 Backend IP를 재해석한다.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend_upstream {
    zone backend_upstream 64k;
    server backend:8080 resolve;
    keepalive 32;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Edge에서 먼저 거부하고 Backend도 같은 1MiB 상한을 독립적으로 검증한다.
    client_max_body_size 1m;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 8k;

    server_tokens off;

    # 정적 SPA와 proxied API 응답에 동일한 브라우저 보안 기준을 적용한다.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://oapi.map.naver.com http://oapi.map.naver.com https://nrbe.map.naver.net http://nrbe.map.naver.net; style-src 'self'; img-src 'self' data: blob: https://map.pstatic.net https://nrbe.pstatic.net https://simg.pstatic.net https://ssl.pstatic.net http://static.naver.net http://*.map.naver.net; font-src 'self'; connect-src 'self' https://oapi.map.naver.com https://map.pstatic.net https://nrbe.pstatic.net http://*.map.naver.net; worker-src 'self' blob:;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # HTTP에서는 브라우저가 무시하고, 이 Nginx 앞에서 TLS가 종료되는 운영 경로에서는 효력이 있다.
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        expires -1;
        return 200 "ok\n";
    }

    # 기존 로컬 점검 경로는 호환성을 위해 유지하되 readiness 정본은 /healthz다.
    location = /health {
        access_log off;
        default_type text/plain;
        expires -1;
        return 200 "ok\n";
    }

    location = /api/v1/auth/csrf-token {
        # 공유 NAT의 정상적인 동시 새로고침은 burst로 수용하되 지속 flood는 429로 거부한다.
        limit_req zone=csrf_token_issuance burst=60 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # EventSource 연결은 일반 API보다 먼저 매칭해 buffering과 짧은 기본 timeout을 피한다.
    location ^~ /api/v1/stream/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_hide_header Cache-Control;
        expires -1;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        # 공개 응답에는 edge 정책을 단일 값으로 제공하고 Backend 직접 접근도 자체 헤더를 유지한다.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 이 Nginx가 유일한 신뢰 edge이므로 클라이언트가 보낸 X-Forwarded-For를
        # 이어붙이지 않는다. 그렇지 않으면 IP Rate Limit bucket을 임의 선택할 수 있다.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite content hash가 포함된 asset만 1년 캐시한다. 파일명이 바뀌므로 재배포와 충돌하지 않는다.
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:css|js|png|jpg|jpeg|gif|svg|webp|woff2?)$" {
        expires 1y;
        try_files $uri =404;
    }

    # SPA 진입점은 배포 직후 새 hash asset 목록을 다시 확인해야 한다.
    location = /index.html {
        expires -1;
        try_files /index.html =404;
    }

    location / {
        # BrowserRouter deep link도 index.html에서 시작해 React route가 해석한다.
        try_files $uri $uri/ /index.html;
    }
}
