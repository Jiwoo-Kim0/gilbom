server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Edge에서 먼저 거부하고 Backend도 같은 1MiB 상한을 독립적으로 검증한다.
    client_max_body_size 1m;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 8k;

    server_tokens off;

    # 정적 SPA와 proxied API 응답에 동일한 브라우저 보안 기준을 적용한다.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://oapi.map.naver.com; style-src 'self'; img-src 'self' data: blob: https://map.pstatic.net https://nrbe.pstatic.net https://simg.pstatic.net https://ssl.pstatic.net http://static.naver.net http://*.map.naver.net; font-src 'self'; connect-src 'self' https://oapi.map.naver.com https://map.pstatic.net https://nrbe.pstatic.net http://*.map.naver.net; worker-src 'self' blob:;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # HTTP에서는 브라우저가 무시하고, 이 Nginx 앞에서 TLS가 종료되는 운영 경로에서는 효력이 있다.
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # 공개 응답에는 edge 정책을 단일 값으로 제공하고 Backend 직접 접근도 자체 헤더를 유지한다.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 이 Nginx가 유일한 신뢰 edge이므로 클라이언트가 보낸 X-Forwarded-For를
        # 이어붙이지 않는다. 그렇지 않으면 IP Rate Limit bucket을 임의 선택할 수 있다.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # BrowserRouter deep link도 index.html에서 시작해 React route가 해석한다.
        try_files $uri $uri/ /index.html;
    }
}
