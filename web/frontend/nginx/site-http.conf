server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    include /etc/nginx/gilbom/server-common.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    include /etc/nginx/gilbom/app-locations.conf;
}
