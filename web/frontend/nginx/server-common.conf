# Edge에서 먼저 거부하고 Backend도 같은 1MiB 상한을 독립적으로 검증한다.
client_max_body_size 1m;
client_header_buffer_size 1k;
large_client_header_buffers 2 8k;

server_tokens off;

# 정적 SPA와 proxied API 응답에 동일한 브라우저 보안 기준을 적용한다.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://oapi.map.naver.com https://nrbe.map.naver.net https://nrbe.pstatic.net; style-src 'self'; img-src 'self' data: blob: https://map.pstatic.net https://nrbe.pstatic.net https://simg.pstatic.net https://ssl.pstatic.net https://static.naver.net https://*.map.naver.net; font-src 'self'; connect-src 'self' https://oapi.map.naver.com https://map.pstatic.net https://nrbe.pstatic.net https://*.map.naver.net; worker-src 'self' blob:;" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

root /usr/share/nginx/html;
index index.html;
