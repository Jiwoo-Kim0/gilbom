# Edge에서 먼저 거부하고 Backend도 같은 1MiB 상한을 독립적으로 검증한다.
client_max_body_size 1m;
client_header_buffer_size 1k;
large_client_header_buffers 2 8k;

server_tokens off;

# 정적 SPA와 proxied API 응답에 동일한 브라우저 보안 기준을 적용한다.
# CSP는 사이트 파일이 각자 include한다. 페이지가 http로 열리면 Naver 지도 SDK가
# 타일·아이콘을 http로 요청하는데(location.protocol을 따른다), https만 허용하면
# 전부 차단되어 지도가 "500 Internal Server Error"로 보인다.
#   site-http.conf  -> csp-http.conf   (로컬 개발)
#   site-https.conf -> csp-https.conf  (운영, 스킴 https만)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

root /usr/share/nginx/html;
index index.html;
