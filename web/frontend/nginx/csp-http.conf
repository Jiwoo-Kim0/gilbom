# 로컬 개발용(GILBOM_NGINX_TLS_MODE=off). 페이지가 http라 SDK가 타일·아이콘을
# http로 요청하므로 Naver 호스트에 한해 두 스킴을 모두 허용한다.
# 운영에는 쓰이지 않는다 — configure-runtime.sh가 site-https.conf를 고른다.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://oapi.map.naver.com http://oapi.map.naver.com https://nrbe.map.naver.net http://nrbe.map.naver.net https://nrbe.pstatic.net http://nrbe.pstatic.net; style-src 'self'; img-src 'self' data: blob: https://map.pstatic.net http://map.pstatic.net https://nrbe.pstatic.net http://nrbe.pstatic.net https://simg.pstatic.net http://simg.pstatic.net https://ssl.pstatic.net http://ssl.pstatic.net https://static.naver.net http://static.naver.net https://*.map.naver.net http://*.map.naver.net; font-src 'self'; connect-src 'self' https://oapi.map.naver.com http://oapi.map.naver.com https://map.pstatic.net http://map.pstatic.net https://nrbe.pstatic.net http://nrbe.pstatic.net https://*.map.naver.net http://*.map.naver.net https://kr-col-ext.nelo.navercorp.com; worker-src 'self' blob:;" always;
