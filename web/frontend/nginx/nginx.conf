# 0.5 CPU 기본 quota에서 host 전체 core 수만큼 worker를 만드는 과도한
# scheduling을 피하면서 SSE와 일반 요청을 분리 처리할 최소 여유를 둔다.
worker_processes 2;

error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 마지막 항목은 Backend가 내려준 X-Request-Id다. 같은 값이 Backend 로그에도
    # 찍히므로 Loki에서 edge와 애플리케이션 로그를 한 요청으로 이어 볼 수 있다.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '"$sent_http_x_request_id"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/gilbom/upstream.conf;
    # read-only rootfs에서도 최초 인증서 발급 전 bootstrap 설정과 HTTPS 설정을
    # 원자적으로 전환할 수 있도록 runtime 설정은 /tmp에 둔다.
    include /tmp/nginx-conf.d/*.conf;
}
