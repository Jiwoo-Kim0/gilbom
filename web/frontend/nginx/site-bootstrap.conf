# 최초 인증서가 없을 때는 ACME HTTP-01과 container health만 제공한다.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        expires -1;
        return 200 "bootstrap\n";
    }

    location / {
        add_header Retry-After "60" always;
        return 503;
    }
}
